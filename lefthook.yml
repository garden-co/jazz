pre-commit:
  commands:
    no-sensitive-data:
      # Patterns live in jazz-private (cleartext there instead of decodable
      # base64 here). Contributors without that checkout are not blocked, but
      # the skip is announced: a silent pass is indistinguishable from a clean
      # scan, and this hook is the only thing keeping customer-identifying
      # strings out of this public repo.
      run: >-
        sh -c 'GATE="$HOME/jazz-private/dev/gates/no-sensitive-data.sh";
        if [ -x "$GATE" ]; then "$GATE";
        else echo "WARNING - sensitive-data guard NOT RUN. $GATE is missing, so commits are not scanned for customer-identifying strings. Clone jazz-private to enable it." >&2; exit 0; fi'
    rustfmt:
      glob: "*.rs"
      run: cargo fmt
      stage_fixed: true
    clippy:
      glob:
        - "*.rs"
        - "Cargo.toml"
        - "**/Cargo.toml"
      # `{staged_files}` is the exact staged-file list already computed by
      # Lefthook. The native shell wrapper invokes Cargo directly, avoiding
      # Node child_process spawns that restricted shells may reject.
      run: sh dev/scripts/clippy-staged.sh {staged_files}
    oxfmt:
      glob: "*.{ts,tsx,js,jsx,md,mdx,json,html}"
      exclude:
        - "crates/jazz-napi/index.d.ts"
        # This package owns its Prettier policy (single quotes); root oxfmt
        # otherwise rewrites it to its incompatible default.
        - "crates/jazz-rn/react-native.config.js"
        - "crates/jazz-rn/src/**"
      run: pnpm exec oxfmt --ignore-path .oxfmtignore {staged_files}
      stage_fixed: true
    oxlint:
      glob: "*.{ts,tsx,js,jsx}"
      exclude: "crates/jazz-rn/src/**, examples/*/schema/app.ts, examples/docs/*/schema/app.ts, crates/jazz-napi/index.d.ts, crates/jazz-napi/index.js"
      run: pnpm oxlint --fix {staged_files}
      stage_fixed: true
    starters-parity:
      glob: "starters/**"
      run: node dev/scripts/check-starters-parity.mjs
    # Type-check the docs snippet packages. `--only` skips the topological
    # `^build` chain, which otherwise drags in jazz-rn's native (NDK) build —
    # not needed to type-check the snippets. Because `--only` skips that chain,
    # jazz-tools must already be built (run `pnpm build:core`); otherwise each
    # package's `cli.js validate` step fails with a missing-module error.
    docs-snippets:
      glob: "examples/docs/**"
      run: pnpm turbo run build --filter='./examples/docs/*' --only
    docs-site-types:
      glob: "docs/**"
      run: pnpm --filter docs types:check
