# `cargo nextest` is optional locally, but CI installs it.  This profile makes
# a stuck Rust test name visible within a minute and terminates it one minute
# later, instead of leaving the whole job to hit GitHub's job timeout.
[profile.jazz]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 1 }

# CI shares a 16-core host with independently scheduled jobs.  Compiling the
# TypeScript correctness artifacts can briefly starve CPU-bound Rust tests, so
# use a wider but still finite per-test watchdog there.  Local runs retain the
# tighter jazz profile above for fast hang attribution.
[profile.jazz-ci]
fail-fast = false
slow-timeout = { period = "180s", terminate-after = 1 }

# Wall-clock scaling comparisons need exclusive access to this test runner's
# slots. Keep the workload, ratio bounds, and other tests' parallelism intact.
[[profile.default.overrides]]
filter = 'package(=jazz) & binary(=incremental_delivery_canary) & test(=mergeable_transaction_write_cost_is_scale_independent)'
threads-required = 'num-test-threads'
