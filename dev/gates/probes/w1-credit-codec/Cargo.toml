[package]
name = "w1-credit-codec-probe"
version = "0.0.0"
edition = "2024"
publish = false

# Deliberately independent of Jazz and its storage/FFI dependencies.
[workspace]

[[bin]]
name = "w1-credit-codec-probe"
path = "../w1_credit_class_probe.rs"

[features]
default = ["codec"]
codec = []

[dependencies]
postcard = { version = "=1.1.3", features = ["alloc"] }
serde = { version = "=1.0.228", features = ["derive"] }
