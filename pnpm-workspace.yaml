packages:
  - docs
  - packages/*
  - crates/jazz-rn
  - crates/jazz-rn/npm/*
  - examples/*
  - examples/*/apps/*
  # dev/app-comparisons: the hero apps ported to other stacks (see its
  # README.md). Each is a standalone pnpm project with its own lockfile, kept
  # out of the workspace and every gate for now. Literal paths:
  # dev/gates/test/example-typecheck.test.mjs reads these entries as directories.
  - "!examples/stage-plan/apps/react-zero"
  - "!examples/stage-plan/apps/react-convex"
  - "!examples/stage-plan/apps/react-instantdb"
  - "!examples/stage-plan/apps/react-postgres"
  - "!examples/stage-plan/apps/react-neon"
  - "!examples/band-chat/apps/react-hono-zero"
  - "!examples/band-chat/apps/react-hono-convex"
  - "!examples/band-chat/apps/react-hono-instantdb"
  - "!examples/band-chat/apps/react-hono-postgres"
  - "!examples/band-chat/apps/react-hono-neon"
  - "!examples/wequencer/apps/next-zero"
  - "!examples/wequencer/apps/next-convex"
  - "!examples/wequencer/apps/next-instantdb"
  - "!examples/wequencer/apps/next-postgres"
  - "!examples/wequencer/apps/next-neon"
  - "!examples/big-label/apps/next-zero"
  - "!examples/big-label/apps/next-convex"
  - "!examples/big-label/apps/next-instantdb"
  - "!examples/big-label/apps/next-postgres"
  - "!examples/big-label/apps/next-neon"
  - examples/docs/*
  - "!examples/docs/todo-client-localfirst-expo"
  - dev/stress-tests/*
  - "!dev/stress-tests/stress-test-expo"
  - dev/local-telemetry/web
  - dev/benchmarks/example-load-times
  # The label-gated Android/iOS acceptance workflow invokes this package via
  # `pnpm --filter`; it must be a workspace member so CI installs Expo and its
  # declared native dependencies before prebuild.
  - dev/rn-device-acceptance
  - crates
  - crates/jazz-wasm
  - crates/jazz-napi

catalogs:
  default:
    "@sveltejs/vite-plugin-svelte": 7.3.1
    "@types/node": "^22.0.0"
    "@vitest/browser": 5.1.0
    "@vitest/browser-playwright": 5.1.0
    "@vitejs/plugin-react": 6.3.0
    "@vitejs/plugin-vue": 6.0.11
    next: 16.2.11
    svelte-check: "^4.0.0"
    typescript: 6.0.2
    vite: 8.3.8
    vite-plus: 1.7.0
    vite-plugin-solid: 2.11.17
    "vite-plugin-top-level-await": 1.6.0
    "vite-plugin-wasm": 3.6.0
    jsdom: 26.1.0
    vitest: 5.1.0
    vue-tsc: "^2.1.10"

# Expose Vite+'s tsrs binary to workspace type-check scripts.
publicHoistPattern:
  - tsrs

allowBuilds:
  "@swc/core": true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true

overrides:
  react: 19.2.4
  react-dom: 19.2.4

patchedDependencies:
  playwright-core@1.58.2: patches/playwright-core@1.58.2.patch
