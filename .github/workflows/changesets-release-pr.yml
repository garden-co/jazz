name: Changesets Release PR

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: changesets-release-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    if: github.ref == 'refs/heads/release'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Guard alpha prerelease mode
        run: |
          test -f .changeset/pre.json
          node -e 'const fs=require("fs");const pre=JSON.parse(fs.readFileSync(".changeset/pre.json","utf8"));if(pre.mode!=="pre"||pre.tag!=="alpha"){throw new Error(`Expected .changeset/pre.json mode=pre tag=alpha, got mode=${pre.mode} tag=${pre.tag}`);}console.log("Changesets prerelease mode: alpha");'

      - name: Create or update release PR
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1
        with:
          version: pnpm release:version
          title: "Version Packages (alpha)"
          commit: "Version Packages (alpha)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger release CI and preview workflows
        if: steps.changesets.outputs.hasChangesets == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          RELEASE_BRANCH="changeset-release/${BASE_BRANCH}"
          PR_NUMBER=$(gh pr list --repo "${REPO}" --head "${RELEASE_BRANCH}" --base "${BASE_BRANCH}" --state open --json number -q '.[0].number')

          if [ -z "${PR_NUMBER}" ]; then
            echo "No open release PR found for ${RELEASE_BRANCH}; skipping preview dispatch."
            exit 0
          fi

          RELEASE_SHA=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefOid -q .headRefOid)
          assert_release_head() {
            CURRENT_SHA=$(gh api "repos/${REPO}/git/ref/heads/${RELEASE_BRANCH}" --jq .object.sha)
            PR_SHA=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefOid -q .headRefOid)
            if [ "${CURRENT_SHA}" != "${RELEASE_SHA}" ] || [ "${PR_SHA}" != "${RELEASE_SHA}" ]; then
              echo "::error::Release PR head changed during dispatch; rerun Changesets on release."
              exit 1
            fi
          }
          assert_release_head
          # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
          # Dispatch explicitly so protected release receives CI on this head.
          gh workflow run ci.yml --repo "${REPO}" --ref "${RELEASE_BRANCH}"
          assert_release_head
          gh workflow run preview-jazz-tools-alpha-release.yml --repo "${REPO}" --ref "${RELEASE_BRANCH}"
          assert_release_head
          echo "Dispatched release CI and preview for ${RELEASE_BRANCH} at ${RELEASE_SHA} (PR #${PR_NUMBER})."
