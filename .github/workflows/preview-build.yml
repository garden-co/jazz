name: Preview build (pkg.pr.new)

on:
  pull_request:
    # Keep previews current after the label opt-in. An unlabeled event cancels
    # any in-flight preview when its last preview label is removed.
    types: [labeled, unlabeled, synchronize, reopened]

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  CACHE_SCOPE_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id || github.repository_id }}

jobs:
  build:
    # `preview-build` publishes a package preview using OIDC in the downstream
    # job. Labels do not make fork code trusted, so every path through this
    # reusable build is restricted to same-repository pull requests.
    if: >-
      ${{
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          contains(github.event.pull_request.labels.*.name, 'preview-build') ||
          contains(github.event.pull_request.labels.*.name, 'rn-preview-release')
        )
      }}
    uses: ./.github/workflows/build-jazz-packages.yml
    secrets: inherit
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      napi_matrix: '[{"os":"blacksmith-4vcpu-ubuntu-2404","target":"x86_64-unknown-linux-gnu","platform":"linux-x64-gnu","use_sccache":true},{"os":"blacksmith-6vcpu-macos-15","target":"x86_64-apple-darwin","platform":"darwin-x64","use_sccache":false},{"os":"blacksmith-6vcpu-macos-15","target":"aarch64-apple-darwin","platform":"darwin-arm64","use_sccache":false}]'
      include_rn: >-
        ${{
          contains(github.event.pull_request.labels.*.name, 'rn-preview-release') &&
          github.event.pull_request.head.repo.full_name == github.repository
        }}

  publish-pkg-pr-new:
    name: Publish to pkg.pr.new
    if: >-
      ${{
        always() &&
        needs.build.result == 'success' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          contains(github.event.pull_request.labels.*.name, 'preview-build') ||
          contains(github.event.pull_request.labels.*.name, 'rn-preview-release')
        )
      }}
    needs: [build]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/setup-build
        with:
          rust-toolchain: ""

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: pkg-jazz-tools
          path: packages/jazz-tools

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: pkg-jazz-wasm
          path: crates/jazz-wasm

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: pkg-jazz-napi
          path: crates/jazz-napi

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: pkg-create-jazz
          path: packages/create-jazz

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: >-
          contains(github.event.pull_request.labels.*.name, 'rn-preview-release') &&
          github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: pkg-jazz-rn
          path: crates/jazz-rn

      - name: Ensure CLI binaries stay executable
        run: |
          chmod 755 \
            packages/jazz-tools/bin/native/jazz-tools-darwin-arm64 \
            packages/jazz-tools/bin/native/jazz-tools-darwin-x64 \
            packages/jazz-tools/bin/native/jazz-tools-linux-arm64 \
            packages/jazz-tools/bin/native/jazz-tools-linux-x64

      # Match alpha releases: the inspector is private and must be embedded in
      # jazz-tools before publishing a self-contained consumer package.
      - name: Stage inspector overlay assets into jazz-tools
        run: |
          pnpm --filter inspector run build:embedded
          pnpm --filter jazz-tools run stage:inspector-overlay

      - name: Verify packed inspector overlay assets
        run: |
          PACK_DIRECTORY=$(mktemp -d)
          trap 'rm -rf "${PACK_DIRECTORY}"' EXIT
          pnpm --filter jazz-tools pack --pack-destination "${PACK_DIRECTORY}"
          TARBALLS=("${PACK_DIRECTORY}"/jazz-tools-*.tgz)
          test "${#TARBALLS[@]}" -eq 1
          tar -tf "${TARBALLS[0]}" > "${PACK_DIRECTORY}/contents.txt"
          grep -Fxq 'package/dist/dev/inspector-overlay/embedded/embedded.html' "${PACK_DIRECTORY}/contents.txt"

      - name: Publish to pkg.pr.new
        env:
          PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
          INCLUDE_RN: >-
            ${{
              contains(github.event.pull_request.labels.*.name, 'rn-preview-release') &&
              github.event.pull_request.head.repo.full_name == github.repository
            }}
        run: |
          PACKAGES=(
            './packages/jazz-tools'
            './crates/jazz-wasm'
            './crates/jazz-napi'
            './crates/jazz-napi/npm/linux-x64-gnu'
            './crates/jazz-napi/npm/darwin-x64'
            './crates/jazz-napi/npm/darwin-arm64'
            './packages/create-jazz'
          )
          if [[ "${INCLUDE_RN}" == "true" ]]; then
            PACKAGES+=('./crates/jazz-rn')
          fi
          # Bind source and dependency URLs to the exact same publication list.
          node packages/create-jazz/scripts/write-preview-snapshot.mjs "${PREVIEW_COMMIT}" "${PACKAGES[@]}"
          pnpm exec pkg-pr-new publish \
            --pnpm \
            --comment=update \
            --commentWithSha \
            --packageManager=pnpm \
            "${PACKAGES[@]}"
