name: Publish jazz-kotlin

# Publishes jazz-kotlin (the JVM jar, with every platform's libjazz_ffi) and
# jazz-kotlin-android (the AAR) to Maven Central as
# tools.jazz:jazz-kotlin:<version> and tools.jazz:jazz-kotlin-android:<version>,
# at jazz-tools' version (dev/scripts/publish-kotlin.sh), with the pinned JDK
# and Gradle 8.14.3 whatever the runner has.
#
# The tag is resolved once, to the commit refs/tags/<tag> points at (never a
# branch of the same name), and every job builds that commit.
#
# mode=publish (dispatched with tag=v2.0.0-alpha.N, once the GitHub release is
# published with the assets "Attach language artifacts" built): the jar
# bundles exactly the release's libjazz_ffi-<platform>.tar.gz, checked against
# SHA256SUMS-languages and their build-provenance attestations, and built from
# that same commit (libjazz_ffi-source.txt); the AAR's are cross-built here
# (dev/scripts/kotlin-release-natives.sh). It runs in the `publish`
# environment (its required reviewer), with its secrets:
#   MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD  a Central Portal user token
#   MAVEN_SIGNING_KEY            the ASCII-armored private key (RSA 4096)
#   MAVEN_SIGNING_KEY_PASSWORD   its passphrase
# One Gradle run builds, signs, uploads and installs locally; the checks then
# run on those files. Both deployments wait, validated, in the Central Portal
# for Publish there: nothing is released from here.
#
# mode=dry-run (and a pull request changing what publishes) does the same
# with a throwaway key and no upload, and keeps the result as a workflow
# artifact: no secret, nothing leaves the runner. With a tag it uses that
# release's libraries; without, this platform's own (linux-x86-64), built
# here.

on:
  pull_request:
    paths:
      - .github/workflows/publish-jazz-kotlin.yml
      - dev/scripts/publish-kotlin.sh
      - dev/scripts/kotlin-release-natives.sh
      - dev/scripts/kotlin-toolchain.sh
      - dev/scripts/test-kotlin-android.sh
      - packages/jazz-kotlin/build.gradle.kts
      - packages/jazz-kotlin/settings.gradle.kts
      - packages/jazz-kotlin-android/build.gradle.kts
      - packages/jazz-kotlin-android/settings.gradle.kts
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (throwaway key, local Maven repository, publishes nothing) or publish"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      tag:
        description: "The release tag (v2.0.0-alpha.N). Required to publish; a dry run without one builds this platform's library from the dispatched commit."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-jazz-kotlin-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CACHE_SCOPE_REPOSITORY_ID: ${{ github.repository_id }}

jobs:
  resolve:
    name: Resolve the commit
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          TAG: ${{ inputs.tag }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A release candidate's tag (v2.0.0-alpha.N-rc.M, or a rehearsal's
          # v2.0.0-alpha.N.K-rc.M) publishes too: Maven orders -rc below the release.
          if [ "${EVENT}" = workflow_dispatch ] && [ "${MODE}" = publish ] && ! [[ "${TAG}" =~ ^v2\.0\.0-alpha\.[0-9]+((\.[0-9]+)?-rc\.[0-9]+)?$ ]]; then
            echo "::error::A publish needs tag=v2.0.0-alpha.N (or an rc), got '${TAG}'"
            exit 1
          fi
          if [ -z "${TAG}" ]; then
            sha="${EVENT_SHA}"
          else
            if ! [[ "${TAG}" =~ ^v2\.0\.0-alpha\.[0-9]+((\.[0-9]+)?-rc\.[0-9]+)?$ ]]; then
              echo "::error::tag must look like v2.0.0-alpha.N, got '${TAG}'"
              exit 1
            fi
            # The tag's commit (peeled, for annotated tags); never a branch
            # of the same name.
            refs=$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}" "refs/tags/${TAG}^{}")
            sha=$(awk '/\^\{\}$/ {print $1}' <<<"${refs}")
            [ -n "${sha}" ] || sha=$(awk '{print $1}' <<<"${refs}" | head -1)
          fi
          if ! [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::No tag ${TAG} in ${GITHUB_REPOSITORY}"
            exit 1
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "Building ${TAG:-the dispatched commit} at ${sha}"

  dry-run:
    name: Dry run (local Maven repository)
    needs: resolve
    if: github.event_name == 'pull_request' || inputs.mode == 'dry-run'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-build
        with:
          setup-node: "false"
          rust-cache: "false"

      - name: Natives from the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: bash dev/scripts/kotlin-release-natives.sh "${TAG}" "${SHA}" natives

      - name: Natives built here
        if: inputs.tag == ''
        run: |
          cargo build -p jazz-ffi --release
          mkdir -p natives/linux-x86-64
          cp target/release/libjazz_ffi.so natives/linux-x86-64/

      - name: Throwaway signing key
        run: |
          set -euo pipefail
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          gpg --batch --pinentry-mode loopback --passphrase dry-run \
            --quick-gen-key "Jazz dry run <dry-run@example.invalid>" rsa4096 sign 1d
          {
            echo "ORG_GRADLE_PROJECT_signingInMemoryKey<<EOF_KEY"
            gpg --batch --pinentry-mode loopback --passphrase dry-run --armor --export-secret-keys
            echo "EOF_KEY"
            echo "ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=dry-run"
          } >> "${GITHUB_ENV}"

      - name: Build, sign, check
        run: bash dev/scripts/publish-kotlin.sh natives local

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jazz-kotlin-maven-dry-run
          path: ~/.m2/repository/tools/jazz
          if-no-files-found: error

  # The only job with the Central Portal token and the signing key.
  publish:
    name: Publish ${{ inputs.tag }} to Maven Central
    needs: resolve
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    environment: publish
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Check the version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="$(jq -r '.version // empty' packages/jazz-tools/package.json)"
          if [ -z "${VERSION}" ] || [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::${TAG} has jazz-tools '${VERSION}': the Kotlin packages publish at jazz-tools' version."
            exit 1
          fi
          if [ ! -f dev/scripts/publish-kotlin.sh ]; then
            echo "::error::${TAG} has no dev/scripts/publish-kotlin.sh: it predates Maven Central publishing."
            exit 1
          fi

      - uses: ./.github/actions/setup-build
        with:
          setup-node: "false"
          rust-cache: "false"

      - name: Natives from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: bash dev/scripts/kotlin-release-natives.sh "${TAG}" "${SHA}" natives

      - name: Build, sign, upload, check
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
        run: bash dev/scripts/publish-kotlin.sh natives central
