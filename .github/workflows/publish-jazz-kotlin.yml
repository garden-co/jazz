name: Publish jazz-kotlin

# Publishes jazz-kotlin (the JVM jar, with every platform's libjazz_ffi) and
# jazz-kotlin-android (the AAR) to Maven Central as
# tools.jazz:jazz-kotlin:<version> and tools.jazz:jazz-kotlin-android:<version>,
# at jazz-tools' version (dev/scripts/publish-kotlin.sh).
#
# mode=publish (dispatched with tag=v2.0.0-alpha.N, once the GitHub release
# is published with the assets "Attach language artifacts" built): the jar
# bundles exactly the release's libjazz_ffi-<platform>.tar.gz libraries,
# checked against its SHA256SUMS; the AAR's are cross-built here. It runs in
# the `publish` environment (its required reviewer), with its secrets:
#   MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD  a Central Portal user token
#   MAVEN_SIGNING_KEY            the ASCII-armored private key (RSA 4096)
#   MAVEN_SIGNING_KEY_PASSWORD   its passphrase
# release=manual (the default) leaves both deployments validated in the
# Central Portal for Publish there; automatic releases them at once.
#
# mode=dry-run (and a pull request changing what publishes) builds, signs
# with a throwaway key and checks everything into the local Maven repository,
# then uploads it as a workflow artifact: no secret, nothing leaves the
# runner. With a tag it uses that release's libraries; without, this
# platform's own (linux-x86-64), built here.

on:
  pull_request:
    paths:
      - .github/workflows/publish-jazz-kotlin.yml
      - dev/scripts/publish-kotlin.sh
      - packages/jazz-kotlin/build.gradle.kts
      - packages/jazz-kotlin-android/build.gradle.kts
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (throwaway key, local Maven repository, publishes nothing) or publish"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      tag:
        description: "The release tag (v2.0.0-alpha.N). Required to publish; a dry run without one builds this platform's library from the dispatched ref."
        required: false
        type: string
      release:
        description: "publish: manual (validated, waiting for Publish in the Central Portal) or automatic"
        required: true
        default: manual
        type: choice
        options:
          - manual
          - automatic

permissions:
  contents: read

concurrency:
  group: publish-jazz-kotlin-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CACHE_SCOPE_REPOSITORY_ID: ${{ github.repository_id }}

jobs:
  dry-run:
    name: Dry run (local Maven repository)
    if: github.event_name == 'pull_request' || inputs.mode == 'dry-run'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 75
    steps:
      - name: Validate inputs
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "${TAG}" ] && ! [[ "${TAG}" =~ ^v2\.0\.0-alpha\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::tag must look like v2.0.0-alpha.N, got '${TAG}'"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.tag || github.sha }}

      - uses: ./.github/actions/setup-build
        with:
          setup-node: "false"
          rust-cache: "false"

      - name: Natives from the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: bash dev/scripts/kotlin-release-natives.sh "${TAG}" natives

      - name: Natives built here
        if: inputs.tag == ''
        run: |
          cargo build -p jazz-ffi --release
          mkdir -p natives/linux-x86-64
          cp target/release/libjazz_ffi.so natives/linux-x86-64/

      - name: Throwaway signing key
        run: |
          set -euo pipefail
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          gpg --batch --pinentry-mode loopback --passphrase dry-run \
            --quick-gen-key "Jazz dry run <dry-run@example.invalid>" rsa4096 sign 1d
          {
            echo "ORG_GRADLE_PROJECT_signingInMemoryKey<<EOF_KEY"
            gpg --batch --pinentry-mode loopback --passphrase dry-run --armor --export-secret-keys
            echo "EOF_KEY"
            echo "ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=dry-run"
          } >> "${GITHUB_ENV}"

      - name: Build, sign, check
        run: bash dev/scripts/publish-kotlin.sh natives local

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jazz-kotlin-maven-dry-run
          path: ~/.m2/repository/tools/jazz
          if-no-files-found: error

  # The only job with the Central Portal token and the signing key.
  publish:
    name: Publish ${{ inputs.tag }} to Maven Central
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    environment: publish
    steps:
      - name: Validate inputs
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "${TAG}" =~ ^v2\.0\.0-alpha\.[0-9]+$ ]]; then
            echo "::error::A publish needs tag=v2.0.0-alpha.N, got '${TAG}'"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.tag }}

      - name: Check the version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="$(jq -r .version packages/jazz-tools/package.json)"
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::${TAG} has jazz-tools ${VERSION}: the Kotlin packages publish at jazz-tools' version."
            exit 1
          fi
          if [ ! -f dev/scripts/publish-kotlin.sh ]; then
            echo "::error::${TAG} has no dev/scripts/publish-kotlin.sh: it predates Maven Central publishing."
            exit 1
          fi

      - uses: ./.github/actions/setup-build
        with:
          setup-node: "false"
          rust-cache: "false"

      - name: Natives from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: bash dev/scripts/kotlin-release-natives.sh "${TAG}" natives

      - name: Build, sign, check, upload
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
          CENTRAL_RELEASE: ${{ inputs.release }}
        run: bash dev/scripts/publish-kotlin.sh natives central
