name: GitHub release

# Drafts the GitHub release for an alpha. Release notes are written while a
# candidate is under test, so this is dispatched by hand (or by an agent):
# `notes` creates the draft, or replaces the notes of an existing draft, for
# review on GitHub. release-publish.yml attaches every asset to the draft and
# publishes it as Latest, last (this workflow's former `publish: true` job and
# its `github-release` environment are retired).
# The dispatch form takes single-line strings; pass multi-line notes with
# `gh workflow run github-release.yml -f version=... -F notes=@notes.md`
# or through the REST API.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version, e.g. 2.0.0-alpha.59. The release uses tag v<version>."
        required: true
        type: string
      notes:
        description: "Draft only: release notes (Markdown) replacing the draft's notes."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  VERSION: ${{ inputs.version }}

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      NOTES: ${{ inputs.notes }}
    steps:
      - name: Validate inputs
        run: |
          if ! [[ "${VERSION}" =~ ^2\.0\.0-alpha\.[0-9]+$ ]]; then
            echo "::error::version must look like 2.0.0-alpha.N, got '${VERSION}'"
            exit 1
          fi
          if [ -z "${NOTES//[[:space:]]/}" ]; then
            echo "::error::notes are required to create or update a draft"
            exit 1
          fi
          echo "TAG=v${VERSION}" >> "$GITHUB_ENV"
          printf '%s\n' "${NOTES}" > "${RUNNER_TEMP}/notes.md"

      - name: Create or update the draft
        run: |
          # `gh release view` also finds drafts whose tag does not exist yet.
          if is_draft=$(gh release view "${TAG}" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "${is_draft}" != true ]; then
              echo "::error::${TAG} is already published; edit it on GitHub instead."
              exit 1
            fi
            gh release edit "${TAG}" --title "Jazz ${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md"
            echo "Updated the draft for ${TAG}."
          else
            # Target release, so publishing from the GitHub UI before the npm
            # publish pushes the tag cannot create it from main.
            gh release create "${TAG}" --draft --target release --title "Jazz ${VERSION}" \
              --notes-file "${RUNNER_TEMP}/notes.md"
            echo "Created a draft for ${TAG}."
          fi
          gh release view "${TAG}" --json url --jq '"Draft: " + .url'
