name: Publish Jazz crates alpha

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run or publish"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish

jobs:
  publish-crates:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # A real publish runs in the protected `publish` environment, which the
    # crates.io trusted publisher is bound to. A dry-run needs no credential,
    # so it runs outside it.
    environment: ${{ inputs.mode == 'publish' && 'publish' || '' }}
    permissions:
      contents: read
      # crates.io trusted publishing: the job's OIDC token is exchanged for
      # a short-lived publish token. There is no CARGO_REGISTRY_TOKEN secret.
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.93.1

      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Get a short-lived crates.io token
        if: ${{ inputs.mode == 'publish' }}
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          MODE: ${{ inputs.mode }}
        run: ./dev/scripts/publish-crates-alpha.sh "${MODE}"
