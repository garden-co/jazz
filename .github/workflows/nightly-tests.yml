name: Nightly tests

# The nightly tier (#1787): suites too long or too broad for every PR, run
# once a day against the default branch. Moving a suite here never removes it
# from a gate; each job names the suite it owns.
#
# - oracle-300: the canonical 300-seed maintained-vs-one-shot oracle
#   (canonical gate) at churn depths 10 and 1000, the depths the continuous
#   simulation soak already budgets. The 100000 depth stays manual until its
#   runtime is measured. PR CI runs one bounded seed.
# - browser-soak: the two JAZZ_BROWSER_SOAK worker-bridge tests, which no
#   other workflow enables.
# - benchmark-api: benchmark-smoke.sh --compile-ci, which checks every
#   maintained benchmark API (including `cargo check -p jazz-sim --benches`).
#   This is its only CI home since the realistic benchmark workflow was
#   retired on 2026-10-15.
# - commit-seq-older-core: this tree and a released older core (beta.0, what
#   Jazz Cloud runs) take turns on one store, and the commit seq row
#   (jazz#6367) must follow every commit of either. It builds the older tag
#   from source, so it is too slow for every PR.
#
# A scheduled failure opens (or reopens) one issue per job.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-tests
  cancel-in-progress: false

jobs:
  oracle-300:
    name: 300-seed maintained-vs-one-shot oracle
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 120
    container:
      image: ghcr.io/garden-co/jazz-ci-toolchain@sha256:876077e2099226423646748686e4a383e586d8b673df15e51d9cffffaee536c1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      RUST_MIN_STACK: "4194304"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-blacksmith
        with:
          sccache-s3: false
      - name: Run the 300-seed oracle
        env:
          JAZZ_DIFFERENTIAL_STEP_COUNT: "60"
          JAZZ_DIFFERENTIAL_CHURN_DEPTHS: "10,1000"
        run: JAZZ_SEED="$(seq -s, 1 300)" dev/t --test maintained_differential --exact maintained_one_shot_differential_oracle -- --ignored

  browser-soak:
    name: Worker-bridge browser soak
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    container:
      image: ghcr.io/garden-co/jazz-ci-toolchain@sha256:876077e2099226423646748686e4a383e586d8b673df15e51d9cffffaee536c1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-blacksmith
        with:
          sccache-s3: false
      - name: Build correctness artifacts
        run: node dev/gates/ensure-correctness-artifacts.mjs
      - name: Run the soak tests
        env:
          JAZZ_BROWSER_SOAK: "1"
          NO_COLOR: "1"
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir packages/jazz-tools test:browser:focused -- \
            tests/browser/worker-bridge.test.ts \
            -t "survives (repeated durable writes across fresh SharedWorker lifecycles|randomized concurrent writes and SharedWorker restarts)" \
            | tee "${RUNNER_TEMP}/browser-soak.log"
          # A filter that silently matches nothing, or a soak flag that stops
          # reaching the config, would otherwise pass with every test skipped.
          grep -E "Tests +2 passed" "${RUNNER_TEMP}/browser-soak.log"

  benchmark-api:
    name: Benchmark API compile
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 45
    container:
      image: ghcr.io/garden-co/jazz-ci-toolchain@sha256:876077e2099226423646748686e4a383e586d8b673df15e51d9cffffaee536c1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-blacksmith
        with:
          sccache-s3: false
      - name: Compile maintained benchmark APIs
        run: dev/gates/benchmark-smoke.sh --compile-ci

  # Merge groups run jazz-tools' Durable Object suite on a wasm-opt -O1 host
  # (same Rust, same fat LTO). This runs it on the -Oz host that ships, so an
  # -Oz-only break (a wasm-opt miscompile, or the glue or reinstantiation
  # interacting with optimised code) shows by the next morning, and
  # build-jazz-packages.yml runs it again before every release.
  durable-object-release-host:
    name: Durable Object suite on the release (-Oz) host
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 45
    container:
      image: ghcr.io/garden-co/jazz-ci-toolchain@sha256:876077e2099226423646748686e4a383e586d8b673df15e51d9cffffaee536c1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-blacksmith
        with:
          sccache-s3: false
      - name: Build correctness artifacts
        run: node dev/gates/ensure-correctness-artifacts.mjs
      - name: Build the release (-Oz) Durable Object host
        run: pnpm --filter jazz-wasm build:durable-object
      - name: Build the release (-Oz) backend build
        run: pnpm --filter jazz-wasm build:backend
      - name: Run jazz-tools' Durable Object suite on it
        run: node dev/gates/run-ts-consumers.mjs --shard durable-objects

  commit-seq-older-core:
    name: Commit seq row across an older core
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    container:
      image: ghcr.io/garden-co/jazz-ci-toolchain@sha256:876077e2099226423646748686e4a383e586d8b673df15e51d9cffffaee536c1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-blacksmith
        with:
          sccache-s3: false
      - name: Fetch the older core's tag
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 --no-tags origin "refs/tags/v2.0.0-beta.0:refs/tags/v2.0.0-beta.0"
      - name: Round trip with beta.0
        run: node dev/gates/commit-seq-older-core.mjs v2.0.0-beta.0

  report:
    name: Report nightly failures
    if: ${{ always() && github.event_name == 'schedule' }}
    needs:
      [oracle-300, browser-soak, benchmark-api, durable-object-release-host, commit-seq-older-core]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const results = JSON.parse(process.env.RESULTS);
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failed = Object.entries(results).filter(([, job]) => job.result !== "success");
            if (!failed.length) return;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: "all",
              per_page: 100,
            });
            for (const [job, { result }] of failed) {
              const marker = `<!-- nightly-tests:${job} -->`;
              const title = `Nightly tests failing: ${job}`;
              const body = `🤖 The nightly \`${job}\` job ended \`${result}\` on \`${context.sha}\`.\n${marker}\n\n[Run](${url})`;
              const existing = issues.find((issue) => issue.body?.includes(marker));
              if (existing) {
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number, title, body, state: "open" });
              } else {
                await github.rest.issues.create({ ...context.repo, title, body });
              }
            }
