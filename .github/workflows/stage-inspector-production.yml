name: Stage Inspector production

on:
  workflow_dispatch:
    inputs:
      artifact-run-id:
        description: "Successful package-build workflow run containing inspector-prebuilt"
        required: true
        type: string
      source-sha:
        description: "Exact deployment SHA (must have the same source tree as the artifact run)"
        required: true
        type: string
      source-branch:
        description: "Source branch used by the production promotion lookup"
        required: true
        default: release
        type: string
  workflow_call:
    inputs:
      artifact-run-id:
        description: "Admitted run containing inspector-prebuilt. Empty uses this run's own artifact, built from source-sha."
        required: false
        default: ""
        type: string
      source-sha:
        required: true
        type: string
      source-branch:
        required: false
        default: release
        type: string
    outputs:
      deployment-url:
        description: "URL of the staged (not yet promoted) production deployment"
        value: ${{ jobs.stage.outputs.deployment-url }}

jobs:
  stage:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment_url }}
    env:
      SOURCE_SHA: ${{ inputs.source-sha }}
      SOURCE_BRANCH: ${{ inputs.source-branch }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_INSPECTOR_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_INSPECTOR_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_INSPECTOR_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      # An empty run ID is only reachable from workflow_call: the publisher
      # built inspector-prebuilt earlier in this same run from source-sha, and
      # the receipt verification below still binds every file to that SHA.
      - name: Verify artifact run identity and deployment source tree
        id: artifact
        if: inputs.artifact-run-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node dev/scripts/inspector-provenance.mjs

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact-run-id || github.run_id }}
          name: inspector-prebuilt
          path: target/inspector-prebuilt

      - name: Verify complete output and stage without assigning domains
        id: deploy
        env:
          ARTIFACT_SHA: ${{ steps.artifact.outputs.source_sha || inputs.source-sha }}
        run: |
          set -o pipefail
          node dev/scripts/inspector-prebuilt.mjs verify target/inspector-prebuilt "${ARTIFACT_SHA}"
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing ${name}. Configure the matching Vercel Inspector GitHub secret."
              exit 1
            fi
          done
          # Vercel checks the invocation root and the configured project root.
          # Keep both copies identical; the project root is packages/inspector.
          mkdir -p target/inspector-prebuilt/packages/inspector/.vercel
          cp -R target/inspector-prebuilt/.vercel/output target/inspector-prebuilt/packages/inspector/.vercel/output
          cd target/inspector-prebuilt
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync(".vercel/project.json", JSON.stringify({orgId: process.env.VERCEL_ORG_ID, projectId: process.env.VERCEL_PROJECT_ID}));'
          # The CLI prints only the deployment URL on stdout; progress goes to stderr.
          DEPLOYMENT_URL=$(npx --yes vercel@latest deploy --prebuilt --prod --skip-domain --yes \
            --token="${VERCEL_TOKEN}" \
            --meta "githubCommitSha=${SOURCE_SHA}" --meta "githubCommitRef=${SOURCE_BRANCH}" \
            --meta "releaseSourceSha=${ARTIFACT_SHA}" | tail -n 1)
          if ! [[ "${DEPLOYMENT_URL}" =~ ^https://[a-z0-9.-]+\.vercel\.app$ ]]; then
            echo "::error::Vercel did not report a deployment URL for the staged Inspector."
            exit 1
          fi
          echo "Staged Inspector deployment: ${DEPLOYMENT_URL}"
          echo "deployment_url=${DEPLOYMENT_URL}" >> "${GITHUB_OUTPUT}"
