name: Stage Inspector production

on:
  workflow_dispatch:
    inputs:
      artifact-run-id:
        description: "Successful package-build workflow run containing inspector-prebuilt"
        required: true
        type: string
      source-sha:
        description: "Exact deployment SHA (must have the same source tree as the artifact run)"
        required: true
        type: string
      source-branch:
        description: "Source branch used by the production promotion lookup"
        required: true
        default: release
        type: string

jobs:
  stage:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_SHA: ${{ inputs.source-sha }}
      SOURCE_BRANCH: ${{ inputs.source-branch }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_INSPECTOR_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_INSPECTOR_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_INSPECTOR_TOKEN }}
    steps:
      - name: Read-only authentication and project diagnostics
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const token = process.env.VERCEL_TOKEN;
          const team = process.env.VERCEL_ORG_ID;
          const project = process.env.VERCEL_PROJECT_ID;
          console.log(JSON.stringify({tokenPresent: !!token, surroundingWhitespace: token !== token.trim(), teamIdShape: /^team_/.test(team), projectIdShape: /^prj_/.test(project)}));
          const checks = [
            ['user', '/v2/user'],
            ['team', `/v2/teams/${encodeURIComponent(team)}`],
            ['project', `/v9/projects/${encodeURIComponent(project)}?teamId=${encodeURIComponent(team)}`],
          ];
          for (const [check, path] of checks) {
            const response = await fetch(`https://api.vercel.com${path}`, {headers: {Authorization: `Bearer ${token}`}, signal: AbortSignal.timeout(30000)});
            const body = await response.json().catch(() => ({}));
            console.log(JSON.stringify({check, status: response.status, errorCode: body.error?.code, expectedProject: check === 'project' && response.ok ? body.name === 'jazz2-inspector' : undefined, expectedTeam: check === 'team' && response.ok ? body.slug === 'garden-co' : undefined}));
          }
          JS
