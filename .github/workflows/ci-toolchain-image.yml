name: CI toolchain image

# Builds dev/ci/toolchain/Dockerfile and publishes it as
# ghcr.io/garden-co/jazz-ci-toolchain, tagged by recipe hash. CI jobs pin the
# printed digest, so a published image is only used once a reviewed workflow
# change repins it. Pull requests build without publishing.
on:
  workflow_dispatch:
  push:
    paths:
      - dev/ci/toolchain/**
      - .github/workflows/ci-toolchain-image.yml
  pull_request:
    paths:
      - dev/ci/toolchain/**
      - .github/workflows/ci-toolchain-image.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build jazz-ci-toolchain
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/garden-co/jazz-ci-toolchain
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

      - name: Build and publish
        run: |
          set -euo pipefail
          recipe="$(sha256sum dev/ci/toolchain/Dockerfile | cut -c1-16)"
          output=type=docker
          if [[ "${PUBLISH}" == true ]]; then output=type=registry; fi
          docker buildx create --use --name toolchain >/dev/null
          docker buildx build --platform linux/amd64 \
            --tag "${IMAGE}:recipe-${recipe}" \
            --output "${output}" \
            --metadata-file "${RUNNER_TEMP}/metadata.json" \
            dev/ci/toolchain
          digest="$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/metadata.json")"
          {
            echo "### jazz-ci-toolchain"
            echo
            echo "- recipe: \`recipe-${recipe}\`"
            echo "- published: ${PUBLISH}"
            echo "- pin: \`${IMAGE}@${digest}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "pin: ${IMAGE}@${digest}"
