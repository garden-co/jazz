name: Swift mirror

# Publishes Jazz for Swift to garden-co/jazz-swift, the SwiftPM package
# (SwiftPM takes a package by URL only with Package.swift at a repository's
# root, and reads binary targets' checksums from the tagged manifest):
#   1. builds JazzFFI.xcframework (libjazz_ffi for macOS, iOS and the iOS
#      simulator) from a garden-co/jazz ref;
#   2. assembles the mirror tree: Package.swift with the XCFramework's URL
#      and checksum, and packages/jazz-swift's sources;
#   3. verifies it on macOS: a consumer package builds and runs against the
#      mirror, and builds for the iOS simulator.
# A dry run (pull requests touching Swift, or workflow_dispatch without
# `publish`) stops there and uploads the XCFramework and the mirror as
# artifacts. With `publish` (after the release `v<version>` exists), the
# `publish` environment's approval gates attaching the XCFramework to the
# release and pushing the mirror commit, tagged `<version>`, to jazz-swift.
# Publishing takes only `ref: v<version>`, resolved once to a commit SHA that
# every job builds and the mirror commit records.
#
# Recovery: the publish job refuses a version whose mirror tag or release
# asset exists. If it uploaded the asset but failed to push the mirror,
# check that garden-co/jazz-swift has no tag <version>, delete the asset
# (`gh release delete-asset v<version> JazzFFI.xcframework.zip`) and run it
# again. Never delete or move a pushed mirror tag: SwiftPM pins its checksum.
on:
  pull_request:
    paths:
      - "packages/jazz-swift/**"
      - "crates/jazz-ffi/**"
      - "dev/scripts/build-swift-xcframework.sh"
      - "dev/scripts/assemble-swift-mirror.sh"
      - ".github/workflows/swift-mirror.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "garden-co/jazz ref to build (the release tag, e.g. v2.0.0-alpha.66, or an rc)"
        required: true
      version:
        description: "Version to publish, without the v (e.g. 2.0.0-alpha.66)"
        required: true
      publish:
        description: "Attach the XCFramework to release v<version> and push + tag the mirror"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.version || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REF: ${{ github.event.inputs.ref || github.sha }}
  VERSION: ${{ github.event.inputs.version || format('0.0.0-dry-run.{0}', github.run_number) }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Validate the inputs and resolve the ref to a commit
        id: resolve
        env:
          PUBLISH: ${{ github.event.inputs.publish == 'true' }}
        run: |
          # Plain semver (SwiftPM reads only those tags).
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::version '$VERSION' isn't semver"; exit 1; }
          if [[ "$PUBLISH" == true ]]; then
            # A published version is built from its own release tag, and
            # nothing else: no other tag, branch or commit.
            [[ "$REF" == "v$VERSION" ]] || { echo "::error::publishing $VERSION builds v$VERSION, not '$REF'"; exit 1; }
          fi
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            sha=$REF
          elif [[ "$REF" =~ ^v[0-9][0-9A-Za-z.-]*$ ]]; then
            # The tag's commit in this repository (peeled, for annotated tags).
            refs=$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$REF" "refs/tags/$REF^{}")
            sha=$(awk '/\^\{\}$/ {print $1}' <<<"$refs")
            [[ -n "$sha" ]] || sha=$(awk '{print $1}' <<<"$refs" | head -1)
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no tag $REF in ${GITHUB_REPOSITORY}"; exit 1; }
          else
            echo "::error::ref '$REF' isn't a v-tag or a commit SHA"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "building $REF at $sha"

  xcframework:
    needs: resolve
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.93.1"
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      # No cache when publishing: a release's core builds from scratch.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: github.event.inputs.publish != 'true'
        with:
          key: swift-xcframework
      - name: Build JazzFFI.xcframework
        run: dev/scripts/build-swift-xcframework.sh "$RUNNER_TEMP/xcf"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: JazzFFI.xcframework
          path: |
            ${{ runner.temp }}/xcf/JazzFFI.xcframework.zip
            ${{ runner.temp }}/xcf/JazzFFI.xcframework.zip.checksum
          if-no-files-found: error

  mirror:
    needs: [resolve, xcframework]
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: JazzFFI.xcframework
          path: ${{ runner.temp }}/xcf
      - name: Assemble the mirror
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          checksum=$(cat "$RUNNER_TEMP/xcf/JazzFFI.xcframework.zip.checksum")
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/JazzFFI.xcframework.zip"
          dev/scripts/assemble-swift-mirror.sh "$VERSION" "$url" "$checksum" "$RUNNER_TEMP/jazz-swift" "$SHA"
      - name: Verify on macOS and the iOS simulator
        run: |
          # The release asset doesn't exist before publishing: verify against
          # the local zip, a copy of the mirror whose binary target is a path.
          verify="$RUNNER_TEMP/verify"
          cp -R "$RUNNER_TEMP/jazz-swift" "$verify"
          (cd "$verify" && unzip -q "$RUNNER_TEMP/xcf/JazzFFI.xcframework.zip" \
            && perl -0pi -e 's/\.binaryTarget\(\s*name: "jazz_ffiFFI", url: "[^"]*", checksum: "[^"]*"\)/.binaryTarget(name: "jazz_ffiFFI", path: "JazzFFI.xcframework")/' Package.swift \
            && grep -n binaryTarget Package.swift)
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer/Sources/Smoke"
          cat > "$consumer/Package.swift" <<SWIFT
          // swift-tools-version:6.0
          import PackageDescription
          let package = Package(
              name: "smoke",
              platforms: [.macOS(.v13), .iOS(.v16)],
              dependencies: [.package(path: "$verify")],
              targets: [.executableTarget(name: "Smoke", dependencies: [.product(name: "Jazz", package: "verify")])]
          )
          SWIFT
          cp packages/jazz-swift/mirror/Smoke.swift "$consumer/Sources/Smoke/Smoke.swift"
          (cd "$consumer" && swift run Smoke)
      - name: Test on macOS and the iOS simulator
        run: |
          # The package's own tests (packages/jazz-swift/Tests), run against
          # the release's XCFramework: the core on macOS and on an iOS
          # simulator, and JazzQuery, SwiftUI's live query, on both.
          verify="$RUNNER_TEMP/verify"
          cp -R packages/jazz-swift/Tests "$verify/Tests"
          perl -0pi -e 's/(\n        jazzFFI,\n    \])/\n        jazzFFI,\n        .testTarget(name: "JazzTests", dependencies: ["Jazz"], path: "Tests\/JazzTests"),\n    ]/' "$verify/Package.swift"
          grep -n testTarget "$verify/Package.swift"
          (cd "$verify" && swift test)
          # The newest available iPhone simulator.
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(devices[-1]["udid"])')
          echo "iOS simulator: $udid"
          (cd "$verify" && xcodebuild test -scheme jazz-swift -destination "platform=iOS Simulator,id=$udid" -quiet)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jazz-swift-mirror
          path: ${{ runner.temp }}/jazz-swift
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
    needs: [resolve, mirror]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: publish
    permissions:
      contents: write
    steps:
      # A token for garden-co/jazz-swift alone, minted per run by the
      # jazz-swift-mirror GitHub App (contents: write); revoked when the job
      # ends.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: mirror-token
        with:
          client-id: ${{ secrets.JAZZ_SWIFT_APP_CLIENT_ID }}
          private-key: ${{ secrets.JAZZ_SWIFT_APP_PRIVATE_KEY }}
          owner: garden-co
          repositories: jazz-swift
          permission-contents: write
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: JazzFFI.xcframework
          path: xcf
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: jazz-swift-mirror
          path: jazz-swift
      - name: Refuse a version that's already published, or a moved tag
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_TOKEN: ${{ steps.mirror-token.outputs.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          # The release tag still points where the build began.
          now=$(gh api "repos/${GITHUB_REPOSITORY}/commits/v$VERSION" -q .sha)
          [[ "$now" == "$SHA" ]] || { echo "::error::v$VERSION is at $now now, not $SHA, which was built"; exit 1; }
          # A published version's asset is pinned by checksum: never replace it.
          git config --global credential.helper '!f() { echo username=x-access-token; echo "password=$MIRROR_TOKEN"; }; f'
          if git ls-remote --exit-code --tags https://github.com/garden-co/jazz-swift.git "refs/tags/$VERSION" >/dev/null; then
            echo "::error::garden-co/jazz-swift already has tag $VERSION"; exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx JazzFFI.xcframework.zip; then
            echo "::error::release v$VERSION already has JazzFFI.xcframework.zip"; exit 1
          fi
      - name: Attach the XCFramework to release v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$VERSION" xcf/JazzFFI.xcframework.zip --repo "$GITHUB_REPOSITORY"
          # What consumers will download must match the checksum the mirror pins.
          curl -sSfL -o downloaded.zip "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/JazzFFI.xcframework.zip"
          echo "$(cat xcf/JazzFFI.xcframework.zip.checksum)  downloaded.zip" | sha256sum -c -
      - name: Push and tag the mirror
        env:
          MIRROR_TOKEN: ${{ steps.mirror-token.outputs.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          git config --global credential.helper '!f() { echo username=x-access-token; echo "password=$MIRROR_TOKEN"; }; f'
          git clone https://github.com/garden-co/jazz-swift.git mirror
          cd mirror
          git rm -rq --ignore-unmatch . && cp -R ../jazz-swift/. .
          git add -A
          git -c user.name="jazz-release-bot" -c user.email="jazz-release-bot@users.noreply.github.com" \
            commit -qm "Jazz for Swift $VERSION (garden-co/jazz@${SHA}, ${REF})"
          git tag "$VERSION"
          git push origin HEAD:main "refs/tags/$VERSION"
