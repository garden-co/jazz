name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, codex/jazz-core-engine-swap]
  push:
    branches: [main, codex/jazz-core-engine-swap]

concurrency:
  # For pushes, this lets concurrent runs happen, so each push gets a result.
  # But for other events (e.g. PRs), we can cancel the previous runs.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CACHE_SCOPE_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id || github.repository_id }}

jobs:
  # Does the integration branch still compile after a merge?
  #
  # PR-level checks cannot answer this. Each PR is built against the base as it
  # was, so two PRs that are individually green can merge cleanly and produce a
  # tree that does not build. That happened on 2026-07-29: one PR removed
  # `RecursionBound::iteration_cap`, another kept a call to it, neither
  # conflicted, and `codex/jazz-core-engine-swap` was left unable to compile —
  # unnoticed until it broke unrelated work hours later.
  #
  # Deliberately narrow. The full suites are not yet green, so gating on them
  # would force routine overrides and make "red" meaningless. This checks the
  # one property we can guarantee, and is fast and flake-free. Promote the other
  # jobs to gates individually as each goes green.
  build-integration:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-build
        with:
          rust-targets: wasm32-unknown-unknown
          sccache: "true"

      - run: cargo check --workspace --all-targets

  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-build
        with:
          rust-targets: wasm32-unknown-unknown
          rust-components: clippy,rustfmt
          sccache: "true"

      - run: pnpm format:check
      - run: pnpm lint

  test-rust:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-build
        with:
          rust-targets: wasm32-unknown-unknown
          rust-components: clippy,rustfmt
          sccache: "true"

      - name: Install bounded Rust test runner
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2
        with:
          # Download the release asset rather than compiling the runner in
          # every job. Keep this explicit so test selection is reproducible.
          tool: cargo-nextest@0.9.143
      - name: Workspace Rust tests (bounded, sharded, receipted)
        run: node dev/gates/run-rust-tests.mjs --timeout-seconds 780 -- --workspace --lib --bins --tests --features test
      - name: Verify Nextest partition coverage
        run: node --test dev/gates/test/nextest-partitions.test.mjs
      - name: Upload Rust test receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-test-receipt
          path: target/test-receipts/*.json
          if-no-files-found: error
      # The correctness story of the engine-swap PR, first-class in CI
      # (Anselm-approved 2026-07-19): mechanism canaries, differential
      # harnesses, and the maintained-vs-one-shot oracle at a CI-sized seed
      # count. Builds reuse the workspace test build above.
      - name: Differential gates
        run: |
          cargo test -p jazz --test incremental_delivery_canary
          cargo test -p jazz --test shared_coverage_differential
          cargo test -p jazz --test warm_reopen_differential
          JAZZ_SEED_COUNT=50 cargo test -p jazz m3_maintained_one_shot_differential_oracle

  test-ts:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    # JAZZ_NAPI_RELEASE=0 (debug builds) removed 2026-07-19: debug-profile
    # jazz-napi .node files fail dlopen on the Linux runners deterministically
    # (root cause TBD; see dev/CI_NOTES.md). Release builds load fine.

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-build
        with:
          rust-targets: wasm32-unknown-unknown
          rust-components: clippy,rustfmt
          sccache: "true"

      - name: Install WASM packager
        # Only this job builds jazz-wasm. Other Rust jobs receive their target
        # through setup-build but do not pay to install the packager.
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2
        with:
          tool: wasm-pack@0.13.1

      - name: Mount Turbo sticky disk
        uses: useblacksmith/stickydisk@13af8883542ca949a717e70fef89d15edbb29d88 # v1
        with:
          key: turbo-cache-${{ env.CACHE_SCOPE_REPOSITORY_ID }}-${{ runner.os }}-v1
          path: ${{ github.workspace }}/.turbo/cache

      - run: pnpm build:ci
      # Turbo cache hits have reproducibly restored jazz-napi without a loadable
      # .node binding (CI rounds 9/9-rerun, 2026-07-19); verify and force-rebuild
      # if needed. See dev/CI_NOTES.md.
      # Cached jazz-napi archives have restored .node files that fail dlopen
      # (likely sticky-disk corruption across concurrent runs); build the
      # binding fresh and verify it loads. Tests then run with --only so no
      # turbo build dependency can restore a cached artifact over it.
      - name: Rebuild and verify jazz-napi native binding
        run: |
          pnpm turbo run build --filter=jazz-napi --force
          node -e "require('./crates/jazz-napi')"
      - name: Mount Playwright sticky disk
        uses: useblacksmith/stickydisk@13af8883542ca949a717e70fef89d15edbb29d88 # v1
        with:
          key: playwright-browsers-${{ env.CACHE_SCOPE_REPOSITORY_ID }}-${{ runner.os }}-v1
          path: /home/runner/.cache/ms-playwright
      - run: pnpm exec playwright install chromium
      - name: Run Node and browser test suites
        run: |
          pnpm test --filter=!moon-lander-react --filter=!@jazz/rust --filter=!auth-simple-chat --filter=!auth-workos-chat --filter=!auth-betterauth-chat --filter=!chat-react --filter=!world-tour --filter=!jazz-rn --concurrency=2 || status=1
          pnpm --filter jazz-tools test:browser || status=1
          exit "${status:-0}"
