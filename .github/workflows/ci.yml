name: Focused E2EE coverage diagnostics
on:
  workflow_dispatch:
    inputs:
      trusted-cache:
        type: boolean
        default: false
      sccache-write:
        type: boolean
        default: false
permissions:
  contents: read
  packages: read
env:
  CACHE_SCOPE_REPOSITORY_ID: ${{ github.repository_id }}
jobs:
  focused-e2ee:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    # Allow complete artifact preparation and bounded consumer suites.
    # This outer cap does not change individual test deadlines or concurrency.
    timeout-minutes: 90
    # JAZZ_NAPI_RELEASE=0 (debug builds) removed 2026-07-19: debug-profile
    # jazz-napi .node files fail dlopen on the Linux runners deterministically
    # (root cause TBD; see dev/CI_NOTES.md). Release builds load fine.

    container:
      image: ghcr.io/garden-co/jazz-ci-toolchain@sha256:dcb4ec5e4f5507b258805617d58ee6976f7dcee2e9afe1b05ae3d41cc185ef35
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Authenticate trusted sccache writer
        if: inputs.trusted-cache && inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Authenticate trusted sccache reader
        if: inputs.trusted-cache && !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_PR_READER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Export trusted sccache configuration
        if: inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '')
        env:
          CACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          CACHE_REGION: ${{ vars.SCCACHE_REGION }}
        run: |
          echo "SCCACHE_BUCKET=${CACHE_BUCKET}" >> "${GITHUB_ENV}"
          echo "SCCACHE_REGION=${CACHE_REGION}" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_USE_SSL=true" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_KEY_PREFIX=jazz-ci/v1/production/blacksmith-v1" >> "${GITHUB_ENV}"
      - name: Export trusted Turbo cache signing key
        if: inputs.trusted-cache
        env:
          CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
        run: echo "TURBO_REMOTE_CACHE_SIGNATURE_KEY=${CACHE_SIGNATURE_KEY}" >> "${GITHUB_ENV}"
      - name: Set up signed Turbo Remote Cache
        if: inputs.trusted-cache
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: garden-co
          policy: pol_0b019736-e95d-4f60-a5dd-e9415148834c
          audience: https://github.com/garden-co
      - uses: ./.github/actions/setup-blacksmith
        with:
          sccache-s3: ${{ inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '') }}

      # Restore compiler state only; tsc still checks current source and native
      # declarations. Compatible prior revisions are invalidated by TypeScript.
      - name: Restore TypeScript test compiler state
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: packages/jazz-tools/node_modules/.cache/tsc
          key: test-ts-tsc-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'packages/jazz-tools/tsconfig*.json', '.github/workflows/ci-suite.yml') }}-${{ github.sha }}
          restore-keys: |
            test-ts-tsc-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'packages/jazz-tools/tsconfig*.json', '.github/workflows/ci-suite.yml') }}-

      # Builds provenance-checked test artifacts, then runs the parallel Node /
      # browser suites. The local CI-equivalent gate calls this exact partition.
      # The integration-branch workspace target-class check that used to run
      # first here now runs in the lint partition, off this job's critical path.
      - name: Run focused E2EE diagnostics with producer and consumer provenance
        run: |
          pnpm build:correctness-artifacts
          node dev/gates/diagnose-e2ee-coverage.mjs
      - name: Upload BandChat failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: band-chat-browser-failure-screenshots
          # This fixture renders synthetic users and rooms; do not broaden to
          # browser traces, storage profiles, or arbitrary application captures.
          path: examples/band-chat/apps/nextjs-betterauth/tests/browser/__screenshots__/band-chat.test.tsx/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Report sccache statistics
        if: always()
        run: sccache --show-stats

  # The ordinary TypeScript consumer suite intentionally excludes
  # tests/react-native. Keep this bridge-enabled producer and the RN tests in
  # their own named partition so a green web framework suite cannot stand in
  # for native bridge coverage.
