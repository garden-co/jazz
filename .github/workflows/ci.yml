name: CI

on:
  workflow_dispatch:
  # Deliberately unfiltered so every layer of a stacked PR receives CI even
  # when its base is another feature branch.
  pull_request:
  push:
    branches: [main, release]

concurrency:
  # For pushes, this lets concurrent runs happen, so each push gets a result.
  # But for other events (e.g. PRs), we can cancel the previous runs.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

# Security boundary: the repository's workflow maintainers and write-capable
# collaborators are trusted. A same-repository author who can modify this file
# could directly request OIDC or reference Actions secrets, which YAML in this
# same repository cannot prevent. For the unmodified base workflow enforced
# below, untrusted PRs (including forks and Dependabot) and workflow_dispatch
# receive no OIDC permission, inherited secrets, or credentialed cross-ref
# cache access. GitHub's native repository/ref-scoped cache remains available
# without any explicit cloud credential from this workflow.
jobs:
  untrusted:
    if: github.event_name != 'push' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    permissions:
      contents: read
      id-token: none
      packages: read
    uses: ./.github/workflows/ci-suite.yml
    with:
      trusted-cache: false
      sccache-write: false

  trusted:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release') || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    permissions:
      contents: read
      id-token: write
      packages: read
    uses: ./.github/workflows/ci-suite.yml
    with:
      # Release branch OIDC trust has not been enabled in the external cache roles.
      # Keep ordinary GitHub caches without attempting credentialed cross-ref reads.
      trusted-cache: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
      sccache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets: inherit

  # Preserve the branch-protection check name while the implementation jobs
  # live in the reusable suite. Exactly one invocation must have completed.
  test-rust:
    if: always()
    needs: [untrusted, trusted]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 2
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Require the selected CI suite
        env:
          UNTRUSTED_RESULT: ${{ needs.untrusted.result }}
          TRUSTED_RESULT: ${{ needs.trusted.result }}
        run: |
          test "${UNTRUSTED_RESULT}:${TRUSTED_RESULT}" = "success:skipped" || \
            test "${UNTRUSTED_RESULT}:${TRUSTED_RESULT}" = "skipped:success"

      # Check runs from workflow_dispatch are not associated with any pull
      # request, so they never satisfy the required `test-rust` check. The
      # release workflow dispatches CI on the bot-opened Version Packages PR,
      # whose own pull_request runs wait for manual approval (#3790). Mirror
      # this job's result as a commit status on the same SHA, which rulesets
      # match regardless of which event produced it.
      - name: Report test-rust as a commit status for dispatched runs
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${JOB_STATUS}" = success ]; then state=success; else state=failure; fi
          gh api --method POST "repos/${REPO}/statuses/${SHA}" \
            -f state="${state}" \
            -f context=test-rust \
            -f description="Dispatched CI ${state}" \
            -f target_url="${TARGET_URL}"
