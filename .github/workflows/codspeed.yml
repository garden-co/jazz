name: CodSpeed alpha.54 subscription fan-out historical backfill

# Intentionally dispatch-only: this branch preserves a released engine and must
# never merge. See dev/benchmarks/ALPHA54_FANOUT_BACKFILL.md.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: codspeed-alpha54-fanout-backfill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  w1-subscription-fanout:
    name: W1 subscription fan-out wall time (memory)
    runs-on: codspeed-macro
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Verify released engine and record backfill provenance
        run: python3 dev/benchmarks/verify-alpha54-fanout-backfill.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alpha54-provenance-${{ github.job }}
          path: target/alpha54-fanout-backfill-provenance.json
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: true
          shared-key: codspeed-alpha54-backfill-${{ github.job }}-${{ runner.arch }}-v1
          workspaces: . -> target
      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 5.0.1 --locked
      - name: Build W1 subscription fan-out benchmark
        run: cargo codspeed build --measurement-mode walltime --package jazz-example-benchmark-w1 --bench reads_memory_walltime --locked
      - name: Run W1 subscription fan-out benchmark
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: walltime
          run: cargo codspeed run --package jazz-example-benchmark-w1 --bench reads_memory_walltime

