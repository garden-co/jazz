name: CodSpeed Example Benchmarks

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  # Every main merge queues a baseline (bursts coalesce, see concurrency).
  # Without it CodSpeed compares PRs against the newest older main run and
  # attributes intervening merges to the PR (#3488).
  # No nightly schedule: it would only re-measure the last merge. Use a manual
  # dispatch on main if a push was made with the Actions token (which does not
  # trigger push workflows) or a main run failed.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# PR runs cancel superseded pushes. Main runs share one group and are never
# cancelled mid-run: GitHub keeps one running plus one pending, and each newer
# merge replaces the pending one. A burst of merges measures the commit already
# running and the latest one; a PR based on a skipped commit compares against
# the nearest earlier main run (footnoted by CodSpeed), at most one burst old.
concurrency:
  group: codspeed-example-benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  examples:
    # Scheduled/manual runs benchmark the default branch. PR runs are opt-in,
    # but keep refreshing on new commits while the label remains present.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'benchmark')
    name: Example benchmark smoke
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.93.1

      # Cache Cargo's root-workspace target directory and the cargo-codspeed
      # binary. Package selection below limits compilation to the smoke crate's
      # dependency graph, while Cargo still writes artifacts to the root target.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: true
          shared-key: codspeed-example-benches-v1
          workspaces: . -> target

      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 5.0.1 --locked

      - name: Build example benchmark suites
        run: cargo codspeed build --package jazz-example-benchmark-smoke --package jazz-example-benchmark-w1 --package jazz-example-big-label-benchmark --package jazz-example-band-chat-benchmark --package jazz-example-world-tour-benchmark --bench fixture --bench ahead_current --bench loads --bench queries --bench fast_resume

      - name: Run example benchmark suites
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: simulation
          run: cargo codspeed run --package jazz-example-benchmark-smoke --package jazz-example-benchmark-w1 --package jazz-example-big-label-benchmark --package jazz-example-band-chat-benchmark --package jazz-example-world-tour-benchmark

  native-workloads-build:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'benchmark')
    name: Build ${{ matrix.workload }} native benchmark
    # Match the measurement host's ABI, but do not spend macro-runner time on
    # compilation. One Cargo invocation per workload keeps each workload's
    # package, benches and features exactly as measured; feature unification
    # across workloads can never change a receipt. The workload table lives in
    # dev/benchmarks/codspeed-artifact.mjs.
    runs-on: blacksmith-16vcpu-ubuntu-2204-arm
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        workload:
          [
            todo,
            permissioned-resources,
            policy-scoped-documents,
            big-label-ingest,
            w1-reads,
            route-subscription,
            groove-ivm,
            selective-hydration,
          ]
    env:
      CARGO_BUILD_JOBS: 16
      RUST_MIN_STACK: 4194304
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: true
          cache-targets: false
          shared-key: codspeed-native-builder-${{ matrix.workload }}-${{ runner.arch }}-ubuntu2204-v5
          workspaces: . -> target
      - name: Restore native compiler outputs
        id: native-build-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/release
          # Compatibility includes toolchain, CodSpeed, workload (and so its
          # features), remap contract, lockfile and Cargo config. Only the save key includes source SHA.
          key: codspeed-native-v5-${{ matrix.workload }}-${{ runner.os }}-${{ runner.arch }}-ubuntu2204-rust1.93.1-codspeed5.0.1-per-workload-absolute-remap-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            codspeed-native-v5-${{ matrix.workload }}-${{ runner.os }}-${{ runner.arch }}-ubuntu2204-rust1.93.1-codspeed5.0.1-per-workload-absolute-remap-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-
      - name: Test benchmark artifact handoff
        run: node --test dev/benchmarks/codspeed-artifact.test.mjs
      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 5.0.1 --locked
      - name: Record build environment
        run: |
          uname -a
          cat /etc/os-release
          nproc
          free -h
          rustc -vV
          cc --version
          c++ --version
          getconf GNU_LIBC_VERSION
      - name: Build native workload
        run: |
          export JAZZ_REAL_CARGO="$(command -v cargo)"
          export PATH="$PWD/dev/benchmarks/timed-cargo:$PATH"
          # Match the measurement checkout's absolute root in embedded DWARF.
          # install rejects runner path drift; relative paths classify unknown.
          RUSTFLAGS="$(node dev/benchmarks/codspeed-artifact.mjs rustflags)"
          export RUSTFLAGS
          # Assign first so an unknown workload fails the step instead of
          # building every bench in the workspace.
          args="$(node dev/benchmarks/codspeed-artifact.mjs build-args ${{ matrix.workload }})"
          read -ra args <<<"$args"
          /usr/bin/time -v cargo codspeed build -m walltime "${args[@]}" --locked
      - name: Save native compiler outputs
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/release
          key: ${{ steps.native-build-cache.outputs.cache-primary-key }}
      - name: Seal benchmark executables
        run: node dev/benchmarks/codspeed-artifact.mjs seal ${{ matrix.workload }}
      - name: Upload benchmark executables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codspeed-native-${{ matrix.workload }}-${{ github.sha }}
          path: target/codspeed-artifact-${{ matrix.workload }}/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload compiler timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codspeed-build-timings-${{ matrix.workload }}-${{ github.run_attempt }}
          path: target/cargo-timings/
          retention-days: 7

  native-workloads-walltime:
    needs: native-workloads-build
    # A matrix `needs` waits for every build. Still measure the workloads that
    # built when another failed; a missing bundle fails only its own download.
    if: ${{ !cancelled() && needs.native-workloads-build.result != 'skipped' }}
    name: ${{ matrix.workload }} native wall time
    runs-on: codspeed-macro
    timeout-minutes: ${{ matrix.timeout || 20 }}
    strategy:
      fail-fast: false
      matrix:
        workload:
          [
            todo,
            permissioned-resources,
            policy-scoped-documents,
            big-label-ingest,
            w1-reads,
            route-subscription,
            groove-ivm,
            selective-hydration,
          ]
        # Only the native example workloads ran with a raised thread stack
        # before builds moved here; keep every other receipt's environment.
        include:
          - workload: todo
            min_stack: 4194304
          - workload: permissioned-resources
            min_stack: 4194304
          - workload: policy-scoped-documents
            min_stack: 4194304
          # These kept the limits their former build-and-run jobs had; the
          # build no longer counts against them.
          - workload: w1-reads
            timeout: 35
          - workload: route-subscription
            timeout: 25
          - workload: groove-ivm
            timeout: 40
          - workload: selective-hydration
            timeout: 35
    env:
      # Empty means unset to Rust std: the default thread stack.
      RUST_MIN_STACK: ${{ matrix.min_stack }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.93.1
      - name: Download this run's benchmark executables
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: codspeed-native-${{ matrix.workload }}-${{ github.sha }}
          path: target/codspeed-artifact-${{ matrix.workload }}/
      - name: Verify and install benchmark executables
        id: install
        run: |
          node dev/benchmarks/codspeed-artifact.mjs install ${{ matrix.workload }}
          args="$(node dev/benchmarks/codspeed-artifact.mjs run-args ${{ matrix.workload }})"
          echo "run-args=$args" >> "$GITHUB_OUTPUT"
      - name: Run native workload
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: walltime
          # Features were fixed at build time; cargo-codspeed rejects them on run.
          run: cargo codspeed run -m walltime ${{ steps.install.outputs.run-args }}
