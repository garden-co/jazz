name: CodSpeed Example Benchmarks

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  # Every main merge gets its own baseline. Without it CodSpeed compares PRs
  # against the newest older main run and attributes intervening merges to the
  # PR (#3488).
  # No nightly schedule: it would only re-measure the last merge. Use a manual
  # dispatch on main if a push was made with the Actions token (which does not
  # trigger push workflows) or a main run failed.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# PR runs cancel superseded pushes. Main runs are keyed by commit and never
# cancelled, so consecutive merges cannot leave a commit without a baseline.
concurrency:
  group: codspeed-example-benchmarks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  examples:
    # Scheduled/manual runs benchmark the default branch. PR runs are opt-in,
    # but keep refreshing on new commits while the label remains present.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'benchmark')
    name: Example benchmark smoke
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.93.1

      # Cache Cargo's root-workspace target directory and the cargo-codspeed
      # binary. Package selection below limits compilation to the smoke crate's
      # dependency graph, while Cargo still writes artifacts to the root target.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: true
          shared-key: codspeed-example-benches-v1
          workspaces: . -> target

      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 5.0.1 --locked

      - name: Build example benchmark suites
        run: cargo codspeed build --package jazz-example-benchmark-smoke --package jazz-example-benchmark-w1 --package jazz-example-big-label-benchmark --package jazz-example-band-chat-benchmark --package jazz-example-world-tour-benchmark --bench fixture --bench ahead_current --bench loads --bench queries --bench fast_resume

      - name: Run example benchmark suites
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: simulation
          run: cargo codspeed run --package jazz-example-benchmark-smoke --package jazz-example-benchmark-w1 --package jazz-example-big-label-benchmark --package jazz-example-band-chat-benchmark --package jazz-example-world-tour-benchmark

  ingest-walltime:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'benchmark')
    name: BigLabel ingest wall time
    runs-on: codspeed-macro
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.93.1

      # CodSpeed macro runners are ARM64, so never share their target artifacts
      # with the x86_64 simulation job.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: true
          shared-key: codspeed-big-label-walltime-${{ runner.arch }}-v1
          workspaces: . -> target

      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 5.0.1 --locked

      - name: Build BigLabel ingest wall-time benchmark
        run: cargo codspeed build --measurement-mode walltime --package jazz-example-big-label-benchmark --bench ingest_walltime

      - name: Run BigLabel ingest wall-time benchmark
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: walltime
          run: cargo codspeed run --package jazz-example-big-label-benchmark --bench ingest_walltime

  w1-read-walltime:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'benchmark')
    name: W1 read wall time (memory + RocksDB)
    runs-on: codspeed-macro
    # A cold ARM64 build plus both retained memory/RocksDB receipts can exceed
    # the normal macro-job limit; keep the complete pair rather than dropping
    # either backend from the regression signal.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.93.1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: true
          shared-key: codspeed-w1-read-walltime-${{ runner.arch }}-v1
          workspaces: . -> target

      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 5.0.1 --locked

      - name: Build W1 memory and RocksDB read benchmarks
        run: cargo codspeed build --measurement-mode walltime --package jazz-example-benchmark-w1 --bench reads_memory_walltime --bench reads_rocksdb_walltime

      - name: Run W1 memory and RocksDB read benchmarks
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: walltime
          run: cargo codspeed run --package jazz-example-benchmark-w1 --bench reads_memory_walltime --bench reads_rocksdb_walltime

  route-subscription-walltime:
    # #2129: this is the production-shaped same-query/many-binding receipt.
    # Keep the issue's 100 bindings: it is large enough to expose accidental
    # source-witness multiplication while remaining comfortably inside the
    # hosted macro-run budget.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'benchmark')
    name: Route subscription wall time
    runs-on: codspeed-macro
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.93.1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: true
          shared-key: codspeed-route-subscription-walltime-${{ runner.arch }}-v1
          workspaces: . -> target

      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 5.0.1 --locked

      - name: Build route subscription wall-time benchmark
        run: cargo codspeed build --measurement-mode walltime --package jazz --features testing --bench route_subscription_curve

      - name: Run route subscription wall-time benchmark
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: walltime
          # Features are selected at `cargo codspeed build` time. `run` only
          # executes that copied target; passing Cargo feature flags here is
          # rejected by cargo-codspeed and used to leave this job reporting no
          # walltime benchmarks.
          run: cargo codspeed run --package jazz --bench route_subscription_curve

  groove-pull-vs-snapshot-walltime:
    # IVM-replacement experiment: hand-written index-probe (pull) plans versus
    # Groove snapshot and prepared-bind one-shot reads, at two table sizes; and
    # steady-state IVM versus rerun-and-diff (SQLite, pull, Groove snapshot).
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'benchmark')
    name: Groove IVM experiment wall time
    runs-on: codspeed-macro
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.93.1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: true
          shared-key: codspeed-groove-pull-vs-snapshot-${{ runner.arch }}-v1
          workspaces: . -> target

      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 5.0.1 --locked

      - name: Build Groove IVM experiment benchmarks
        run: cargo codspeed build -m walltime --package groove --bench pull_vs_snapshot --bench steady_state

      - name: Run Groove IVM experiment benchmarks
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: walltime
          run: cargo codspeed run -m walltime --package groove --bench pull_vs_snapshot --bench steady_state

  maintained-selective-hydration-walltime:
    # This is the direct receipt for #2077: fixed owner/result cardinality
    # while the persisted current table grows. Keep the deep 1M rung as an
    # explicit local/nightly receipt; 10k and 100k fit the labelled PR job.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'benchmark')
    name: Maintained selective hydration wall time
    runs-on: codspeed-macro
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.93.1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: true
          shared-key: codspeed-maintained-selective-hydration-${{ runner.arch }}-v1
          workspaces: . -> target

      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 5.0.1 --locked

      - name: Build maintained selective-hydration benchmark
        run: cargo codspeed build -m walltime --package jazz --features testing --bench selective_global_hydration

      - name: Run maintained selective-hydration benchmark
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: walltime
          run: cargo codspeed run -m walltime --package jazz --bench selective_global_hydration

  native-workloads-build:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'benchmark')
    name: Build ${{ matrix.workload }} native benchmark
    # Match the measurement host's ABI, but do not spend macro-runner time on
    # compilation. Separate Cargo invocations preserve per-workload features.
    runs-on: blacksmith-16vcpu-ubuntu-2204-arm
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        workload: [todo, permissioned-resources, policy-scoped-documents]
    env:
      CARGO_BUILD_JOBS: 16
      RUST_MIN_STACK: 4194304
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: true
          cache-targets: false
          shared-key: codspeed-native-builder-${{ matrix.workload }}-${{ runner.arch }}-ubuntu2204-v4
          workspaces: . -> target
      - name: Restore native compiler outputs
        id: native-build-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/release
          # Compatibility includes toolchain, CodSpeed, allocator, remap contract,
          # lockfile and Cargo config. Only the save key includes source SHA.
          key: codspeed-native-v4-${{ matrix.workload }}-${{ runner.os }}-${{ runner.arch }}-ubuntu2204-rust1.93.1-codspeed5.0.1-mimalloc-absolute-remap-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            codspeed-native-v4-${{ matrix.workload }}-${{ runner.os }}-${{ runner.arch }}-ubuntu2204-rust1.93.1-codspeed5.0.1-mimalloc-absolute-remap-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-
      - name: Test benchmark artifact handoff
        run: node --test dev/benchmarks/codspeed-artifact.test.mjs
      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 5.0.1 --locked
      - name: Record build environment
        run: |
          uname -a
          cat /etc/os-release
          nproc
          free -h
          rustc -vV
          cc --version
          c++ --version
          getconf GNU_LIBC_VERSION
      - name: Build native workload
        run: |
          export JAZZ_REAL_CARGO="$(command -v cargo)"
          export PATH="$PWD/dev/benchmarks/timed-cargo:$PATH"
          # Match the measurement checkout's absolute root in embedded DWARF.
          # install rejects runner path drift; relative paths classify unknown.
          RUSTFLAGS="$(node dev/benchmarks/codspeed-artifact.mjs rustflags)"
          export RUSTFLAGS
          /usr/bin/time -v cargo codspeed build -m walltime --package jazz-example-${{ matrix.workload }}-benchmark --bench walltime --features jazz-benchmark-guard/mimalloc --locked
      - name: Save native compiler outputs
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/release
          key: ${{ steps.native-build-cache.outputs.cache-primary-key }}
      - name: Seal benchmark executables
        run: node dev/benchmarks/codspeed-artifact.mjs seal ${{ matrix.workload }}
      - name: Upload benchmark executables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codspeed-native-${{ matrix.workload }}-${{ github.sha }}
          path: target/codspeed-artifact-${{ matrix.workload }}/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload compiler timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codspeed-build-timings-${{ matrix.workload }}-${{ github.run_attempt }}
          path: target/cargo-timings/
          retention-days: 7

  native-workloads-walltime:
    needs: native-workloads-build
    name: ${{ matrix.workload }} native wall time
    runs-on: codspeed-macro
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workload: [todo, permissioned-resources, policy-scoped-documents]
    env:
      RUST_MIN_STACK: 4194304
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.93.1
      - name: Download this run's benchmark executables
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: codspeed-native-${{ matrix.workload }}-${{ github.sha }}
          path: target/codspeed-artifact-${{ matrix.workload }}/
      - name: Verify and install benchmark executables
        run: node dev/benchmarks/codspeed-artifact.mjs install ${{ matrix.workload }}
      - name: Run native workload
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: walltime
          run: cargo codspeed run -m walltime --package jazz-example-${{ matrix.workload }}-benchmark --bench walltime
