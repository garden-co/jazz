name: CodSpeed profiler backend diagnostic (not for merge)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profiles:
    runs-on: codspeed-macro
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 4
      RUST_MIN_STACK: 4194304
      CODSPEED_SKIP_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-bin: true
          shared-key: codspeed-native-permissioned-resources-${{ runner.arch }}-v1
          workspaces: . -> target
      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 5.0.1 --locked
      - name: Build once, preserve source and binary identity
        run: |
          cargo codspeed build -m walltime --package jazz-example-permissioned-resources-benchmark --bench walltime --features jazz-benchmark-guard/mimalloc
          mkdir -p diagnostic-receipts "$RUNNER_TEMP/profiler-samply" "$RUNNER_TEMP/profiler-perf"
          git rev-parse HEAD > diagnostic-receipts/source-sha.txt
          git diff 7947a28f19a75a2a423d8046a89eb446ed19ee2b -- . ':!.github/workflows/codspeed.yml' > diagnostic-receipts/runtime-diff.txt
          test ! -s diagnostic-receipts/runtime-diff.txt
          find target -type f -name 'walltime*' -executable -print0 | sort -z | xargs -0 -r sha256sum > diagnostic-receipts/binaries.sha256
          test -s diagnostic-receipts/binaries.sha256
          while read -r digest binary; do
            readelf -n "$binary"
          done < diagnostic-receipts/binaries.sha256 > diagnostic-receipts/build-ids.txt
      - name: Samply profile (no upload)
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8
        env:
          CODSPEED_WALLTIME_PROFILER: samply
          TMPDIR: ${{ runner.temp }}/profiler-samply
        with:
          mode: walltime
          run: cargo codspeed run -m walltime --package jazz-example-permissioned-resources-benchmark --bench walltime
      - name: Perf profile (same binary, no upload)
        if: ${{ !cancelled() }}
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8
        env:
          CODSPEED_WALLTIME_PROFILER: perf
          TMPDIR: ${{ runner.temp }}/profiler-perf
        with:
          mode: walltime
          run: cargo codspeed run -m walltime --package jazz-example-permissioned-resources-benchmark --bench walltime
      - name: Verify binary identity after both profiles
        if: ${{ !cancelled() }}
        run: sha256sum --check diagnostic-receipts/binaries.sha256
      - name: Retain raw profiles and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: profiler-backend-control
          retention-days: 7
          if-no-files-found: error
          path: |
            diagnostic-receipts/
            ${{ runner.temp }}/profiler-samply/profile.*.out/
            ${{ runner.temp }}/profiler-perf/profile.*.out/
