name: CodSpeed alpha.55 historical harness backfill

# Intentionally dispatch-only: this branch preserves a released engine.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: codspeed-alpha55-backfill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-workloads-walltime:
    name: ${{ matrix.workload }} native wall time
    runs-on: codspeed-macro
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        workload: [policy-scoped-documents]
    env:
      CARGO_BUILD_JOBS: 4
      RUST_MIN_STACK: 4194304
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Verify released engine and record backfill provenance
        run: python3 dev/benchmarks/verify-alpha55-backfill.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alpha55-provenance-${{ matrix.workload }}
          path: target/alpha55-backfill-provenance.json
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: true
          shared-key: codspeed-native-${{ matrix.workload }}-${{ runner.arch }}-v1
          workspaces: . -> target
      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 5.0.1 --locked
      - name: Build native workload
        run: cargo codspeed build -m walltime --package jazz-example-${{ matrix.workload }}-benchmark --bench walltime --features jazz-benchmark-guard/mimalloc
      - name: Run native workload
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: walltime
          run: cargo codspeed run -m walltime --package jazz-example-${{ matrix.workload }}-benchmark --bench walltime
