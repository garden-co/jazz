name: Build Jazz packages

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (branch, tag, or SHA) to check out for every build job. Empty means use the caller's default ref.
        required: false
        type: string
        default: ""
      napi_matrix:
        description: JSON matrix for NAPI platform packages. Release callers use every platform; preview callers may omit expensive optional platforms.
        required: false
        type: string
        default: '[{"os":"blacksmith-4vcpu-ubuntu-2404","target":"x86_64-unknown-linux-gnu","platform":"linux-x64-gnu","use_sccache":false},{"os":"blacksmith-4vcpu-ubuntu-2404-arm","target":"aarch64-unknown-linux-gnu","platform":"linux-arm64-gnu","use_sccache":false},{"os":"blacksmith-6vcpu-macos-15","target":"x86_64-apple-darwin","platform":"darwin-x64","use_sccache":false},{"os":"blacksmith-6vcpu-macos-15","target":"aarch64-apple-darwin","platform":"darwin-arm64","use_sccache":false},{"os":"blacksmith-16vcpu-windows-2025","target":"x86_64-pc-windows-msvc","platform":"win32-x64-msvc","use_sccache":false}]'
      include_rn:
        description: Build and stage jazz-rn's Android and iOS relay artifacts. Keep false for ordinary package previews; releases opt in explicitly.
        required: false
        type: boolean
        default: false
    outputs:
      tools_artifact:
        description: Artifact name for the assembled jazz-tools package.
        value: pkg-jazz-tools
      wasm_artifact:
        description: Artifact name for the assembled jazz-wasm package.
        value: pkg-jazz-wasm
      napi_artifact:
        description: Artifact name for the assembled jazz-napi package (loader + npm/ platform packages).
        value: pkg-jazz-napi
      create_jazz_artifact:
        description: Artifact name for the assembled create-jazz package.
        value: pkg-create-jazz
      jazz_rn_artifact:
        description: Artifact name for the assembled jazz-rn package with its Android and iOS relay artifacts, or empty when RN packaging is disabled.
        value: ${{ jobs.assemble-jazz-rn.outputs.artifact }}

env:
  CACHE_SCOPE_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id || github.repository_id }}
  JAZZ_RN_CARGO_NDK_VERSION: 4.1.2

jobs:
  # The server binary Jazz Cloud runs. npm's jazz-tools ships no native
  # binary: "Publish jazz-tools alpha" attaches these to the GitHub release
  # with SHA256SUMS, and Jazz Cloud's images (and its preview image, from
  # this artifact) take it from there. Keep the artifact names.
  build-linux:
    name: Build server Linux (${{ matrix.arch }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      CARGO_ZIGBUILD_CACHE_DIR: /tmp/cargo-zigbuild-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x64
            output: jazz-tools-linux-x64
          - target: aarch64-unknown-linux-musl
            arch: arm64
            output: jazz-tools-linux-arm64

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-build
        with:
          rust-targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
          setup-node: "false"

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.0
          cache-key: ${{ env.CACHE_SCOPE_REPOSITORY_ID }}-${{ matrix.target }}

      - uses: ./.github/actions/install-rust-tool
        with:
          tool: cargo-zigbuild@0.20.1

      - name: Build server binary
        run: cargo zigbuild -p jazz-tools --bin jazz-tools --features otel --profile release-server --target ${{ matrix.target }}

      - name: Stage artifact
        run: |
          mkdir -p dist debug-symbols
          # The release-server profile keeps line tables for Jazz's crates.
          # The stripped binary is checked below; the unstripped copy (same
          # GNU build ID) is kept as a separate artifact for offline
          # symbolization of heap and CPU profiles.
          cp target/${{ matrix.target }}/release-server/jazz-tools debug-symbols/${{ matrix.output }}
          zig objcopy --strip-debug debug-symbols/${{ matrix.output }} dist/${{ matrix.output }}
          ls -l debug-symbols/${{ matrix.output }} dist/${{ matrix.output }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-symbols-${{ matrix.output }}
          path: debug-symbols/${{ matrix.output }}
          if-no-files-found: error

  check-linux-heap-profile:
    name: Check heap profiling in the Linux server (${{ matrix.arch }})
    needs: build-linux
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: blacksmith-4vcpu-ubuntu-2404
            artifact: jazz-tools-linux-x64
          # Jazz Cloud runs the arm64 build.
          - arch: arm64
            os: blacksmith-4vcpu-ubuntu-2404-arm
            artifact: jazz-tools-linux-arm64
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Check heap profiling in the server binary
        run: |
          set -euo pipefail
          chmod +x ./dist/${{ matrix.artifact }}
          # Sample every allocation so startup allocations are always present.
          JAZZ_HEAP_PROFILE_SAMPLE_BYTES=1 ./dist/${{ matrix.artifact }} server 00000000-0000-0000-0000-000000000001 \
            --in-memory --port 1625 --admin-secret heap-check \
            --diagnostics-listen 127.0.0.1:6060 --diagnostics-token heap-scrape \
            > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat server.log' EXIT
          for _ in $(seq 1 50); do
            curl --silent --fail http://127.0.0.1:1625/health > /dev/null && break
            sleep 0.2
          done
          curl --silent --show-error --fail --output public.pb.gz \
            --header 'X-Jazz-Admin-Secret: heap-check' \
            http://127.0.0.1:1625/debug/pprof/heap
          curl --silent --show-error --fail --output diagnostics.pb.gz \
            --header 'Authorization: Bearer heap-scrape' \
            http://127.0.0.1:6060/debug/pprof/heap
          for profile in public.pb.gz diagnostics.pb.gz; do
            # Function names come from the stripped binary's symbol table,
            # and frame-pointer stacks reach the threads' entry points.
            gzip --decompress --stdout "$profile" > profile.pb
            grep --quiet --text 'jazz_server' profile.pb
            grep --quiet --text '__rust_begin_short_backtrace' profile.pb
          done

  build-wasm:
    name: Build jazz-wasm
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-build
        with:
          rust-targets: wasm32-unknown-unknown
          sccache: "true"
          sccache-key: release-wasm-sccache-${{ github.event.pull_request.head.repo.id || github.repository_id }}-v1

      - uses: ./.github/actions/install-rust-tool
        with:
          tool: wasm-pack@0.13.1

      - name: Build jazz-wasm npm package
        run: pnpm --filter jazz-wasm build

      - name: Verify built jazz-wasm publish artifacts
        run: |
          test -f crates/jazz-wasm/pkg/jazz_wasm_bg.wasm
          test -f crates/jazz-wasm/pkg/jazz_wasm.js
          test -f crates/jazz-wasm/pkg/jazz_wasm.d.ts

      # `jazz-wasm/durable-object`: the core a Cloudflare Durable Object
      # hosts. The whole script, not bare wasm-pack: it also patches the glue
      # (reinstantiable.mjs) and deletes wasm-pack's `.gitignore` of `*`,
      # which would keep the build out of the tarball.
      - name: Build jazz-wasm Durable Object entry
        run: pnpm --filter jazz-wasm build:durable-object

      - name: Verify built jazz-wasm Durable Object artifacts
        run: |
          test -f crates/jazz-wasm/durable-object/pkg/jazz_wasm_do_bg.wasm
          test -f crates/jazz-wasm/durable-object/pkg/jazz_wasm_do.js
          test -d crates/jazz-wasm/durable-object/pkg/snippets
          test ! -e crates/jazz-wasm/durable-object/pkg/.gitignore
          grep --quiet __jazzReinstantiate crates/jazz-wasm/durable-object/pkg/jazz_wasm_do.js

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jazz-wasm-durable-object-pkg
          path: crates/jazz-wasm/durable-object/pkg
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jazz-wasm-pkg
          path: crates/jazz-wasm/pkg
          # The sealed provenance receipt is intentionally dot-prefixed. The
          # upload action excludes hidden files unless this is explicit.
          include-hidden-files: true
          if-no-files-found: error

      # Merge groups run jazz-tools' Durable Object suite on a wasm-opt -O1
      # host; this runs the full suite on the -Oz host built (and uploaded)
      # above, so an -Oz-only break (a wasm-opt miscompile, or the glue or
      # reinstantiation interacting with optimised code) fails the release
      # build. Last, after both uploads: the correctness producer republishes
      # crates/jazz-wasm/pkg as its fast build.
      - name: Build correctness artifacts for the Durable Object suite
        run: node dev/gates/ensure-correctness-artifacts.mjs
      - name: Run jazz-tools' Durable Object suite on the release host
        run: node dev/gates/run-ts-consumers.mjs --shard durable-objects

  build-napi:
    name: Build jazz-napi (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.napi_matrix) }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-build
        if: ${{ !startsWith(matrix.platform, 'linux-') }}
        with:
          rust-targets: ${{ matrix.target }}
          sccache: ${{ matrix.use_sccache && 'true' || 'false' }}
          sccache-key: release-napi-sccache-${{ github.event.pull_request.head.repo.id || github.repository_id }}-${{ matrix.platform }}-v1

      - name: Cache baseline-specific Linux Cargo products
        if: startsWith(matrix.platform, 'linux-')
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/linux-napi-*
          key: linux-napi-${{ matrix.platform }}-${{ hashFiles('dev/artifacts/linux-napi/Dockerfile') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            linux-napi-${{ matrix.platform }}-${{ hashFiles('dev/artifacts/linux-napi/Dockerfile') }}-${{ hashFiles('Cargo.lock') }}-

      - name: Build Linux NAPI on pinned Bullseye userspace
        if: startsWith(matrix.platform, 'linux-')
        run: dev/artifacts/linux-napi/build.sh ${{ matrix.platform }}

      - name: Build jazz-napi binding
        if: ${{ !startsWith(matrix.platform, 'linux-') }}
        run: |
          node dev/artifacts/build.mjs napi release --target ${{ matrix.target }}
          node dev/artifacts/provenance.mjs verify napi release --target ${{ matrix.target }}
          node dev/artifacts/stage-napi-loader.mjs ${{ matrix.platform }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jazz-napi-binding-${{ matrix.platform }}
          path: |
            crates/jazz-napi/jazz-napi.${{ matrix.platform }}.node
            crates/jazz-napi/jazz-napi.${{ matrix.platform }}.manifest.json
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform == 'linux-x64-gnu'
        with:
          name: jazz-napi-loader
          path: |
            crates/jazz-napi/index.js
            crates/jazz-napi/index.d.ts
            crates/jazz-napi/native-loader.cjs
            crates/jazz-napi/native-artifact-fingerprint.cjs
            crates/jazz-napi/native-loader.provenance.json
          if-no-files-found: error

  # One job per ABI (each is a fat-LTO staticlib, ~2 min on 16 vCPU), sealed
  # into one manifest by seal-jazz-rn-android.
  build-jazz-rn-android:
    name: Build jazz-rn Android relay (${{ matrix.abi }})
    if: inputs.include_rn
    runs-on: blacksmith-16vcpu-ubuntu-2404
    strategy:
      matrix:
        include:
          - { abi: arm64-v8a, target: aarch64-linux-android }
          - { abi: armeabi-v7a, target: armv7-linux-androideabi }
          - { abi: x86_64, target: x86_64-linux-android }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      # No sccache: rust-cache restores the dependencies and the rest is the
      # LTO link, so it never hit, and installing it cost ~2 minutes.
      - uses: ./.github/actions/setup-build
        with:
          rust-targets: ${{ matrix.target }}
          rust-cache-key: jazz-rn-android-${{ matrix.abi }}
          setup-node: "false"

      # Upstream's release binary, pinned by hash: no `cargo install`.
      - name: Install cargo-ndk
        run: |
          archive="${RUNNER_TEMP}/cargo-ndk.tgz"
          curl --fail --location --retry 3 --output "${archive}" \
            "https://github.com/bbqsrc/cargo-ndk/releases/download/v${JAZZ_RN_CARGO_NDK_VERSION}/cargo-ndk-x86_64-unknown-linux-gnu-v${JAZZ_RN_CARGO_NDK_VERSION}.tgz"
          echo "9451622c4567e8abb2c8005001855e32901c0b716ccdd3a173a4375fd03426e1  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/cargo-ndk"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/cargo-ndk" --strip-components=1
          echo "${RUNNER_TEMP}/cargo-ndk" >> "${GITHUB_PATH}"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action already installs cmdline-tools; its default also asks for retired SDK "tools".
          packages: platform-tools
      # sdkmanager has no retry of its own.
      - name: Install pinned Android NDK
        run: |
          for attempt in 1 2 3; do
            sdkmanager --install "ndk;27.1.12297006" && exit 0
            echo "::warning::NDK install attempt ${attempt} failed"
            sleep $((attempt * 10))
          done
          exit 1
      - name: Build the Android relay archive slice
        run: |
          JAZZ_NATIVE_RELAY_SOURCE_REVISION="$(git rev-parse HEAD)" \
            JAZZ_NATIVE_RELAY_CARGO_NDK_VERSION="${JAZZ_RN_CARGO_NDK_VERSION}" \
            ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/27.1.12297006" \
            bash crates/jazz-rn/scripts/build-relay-artifacts.sh android-slice '${{ matrix.abi }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jazz-rn-relay-android-${{ matrix.abi }}
          path: crates/jazz-rn/android/src/main/jniLibs/${{ matrix.abi }}
          if-no-files-found: error

  seal-jazz-rn-android:
    name: Seal jazz-rn Android relay artifacts
    needs: build-jazz-rn-android
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: jazz-rn-relay-android-*
          path: ${{ runner.temp }}/slices
      - name: Seal and verify the Android relay archive slices
        run: |
          stage=crates/jazz-rn/android/src/main/jniLibs
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "${stage}/${abi}"
            cp "${RUNNER_TEMP}/slices/jazz-rn-relay-android-${abi}/libjazz_native_relay.a" "${stage}/${abi}/"
          done
          export JAZZ_NATIVE_RELAY_SOURCE_REVISION="$(git rev-parse HEAD)"
          export JAZZ_NATIVE_RELAY_CARGO_NDK_VERSION="${JAZZ_RN_CARGO_NDK_VERSION}"
          bash crates/jazz-rn/scripts/build-relay-artifacts.sh android-manifest
          node dev/artifacts/rn-packages.mjs stage android
          node crates/jazz-rn/scripts/verify-relay-artifacts.mjs android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jazz-rn-relay-android
          path: |
            crates/jazz-rn/android/src/main/jniLibs
            crates/jazz-rn/android/jazz-native-relay.manifest.json
            crates/jazz-rn/native/include
          if-no-files-found: error

  build-jazz-rn-ios:
    name: Build jazz-rn iOS relay XCFramework
    if: inputs.include_rn
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-build
        with:
          rust-targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
          sccache: "true"
          sccache-key: release-jazz-rn-ios-${{ github.event.pull_request.head.repo.id || github.repository_id }}-v1

      - name: Build and verify iOS relay XCFramework
        run: |
          JAZZ_NATIVE_RELAY_SOURCE_REVISION="$(git rev-parse HEAD)" \
            pnpm --filter jazz-rn build:relay:ios
          JAZZ_NATIVE_RELAY_SOURCE_REVISION="$(git rev-parse HEAD)" \
            node crates/jazz-rn/scripts/verify-relay-artifacts.mjs ios
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jazz-rn-relay-ios
          path: |
            crates/jazz-rn/JazzNativeRelay.xcframework
            crates/jazz-rn/ios/jazz-native-relay.manifest.json
            crates/jazz-rn/native/include
          if-no-files-found: error

  assemble-packages:
    name: Assemble npm packages
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs:
      - build-linux
      - check-linux-heap-profile
      - build-wasm
      - build-napi

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-build
        with:
          rust-toolchain: ""

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: jazz-wasm-pkg
          path: crates/jazz-wasm/pkg

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: jazz-wasm-durable-object-pkg
          path: crates/jazz-wasm/durable-object/pkg

      # Fails unless `npm pack` puts durable-object/pkg/jazz_wasm_do_bg.wasm
      # (and the rest of the Durable Object entry) in the jazz-wasm tarball.
      - name: Verify the jazz-wasm tarball carries the Durable Object entry
        run: pnpm --filter jazz-wasm check:durable-object-pack

      # The release build (wasm-opt, the patched glue) starts in workerd and
      # admits its backend, before anything is published.
      - name: Smoke-test the release jazz-wasm Durable Object entry
        run: pnpm --filter jazz-wasm test:durable-object-release

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: jazz-napi-loader
          path: crates/jazz-napi

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: jazz-napi-binding-*
          path: crates/jazz-napi/artifacts
          merge-multiple: true

      - name: Stage jazz-napi platform package artifacts
        run: |
          cd crates/jazz-napi
          pnpm exec napi create-npm-dirs
          pnpm exec napi artifacts -d artifacts --npm-dir npm

      - name: Remove Windows package omitted by this build
        if: ${{ !contains(inputs.napi_matrix, 'win32-x64-msvc') }}
        run: |
          node -e 'require("node:fs").rmSync("crates/jazz-napi/npm/win32-x64-msvc", { recursive: true, force: true })'

      - name: Verify staged jazz-napi platform artifacts
        run: |
          test -f crates/jazz-napi/npm/linux-x64-gnu/jazz-napi.linux-x64-gnu.node
          test -f crates/jazz-napi/npm/linux-arm64-gnu/jazz-napi.linux-arm64-gnu.node
          test -f crates/jazz-napi/npm/darwin-x64/jazz-napi.darwin-x64.node
          test -f crates/jazz-napi/npm/darwin-arm64/jazz-napi.darwin-arm64.node
          if [[ '${{ inputs.napi_matrix }}' == *'win32-x64-msvc'* ]]; then
            test -f crates/jazz-napi/npm/win32-x64-msvc/jazz-napi.win32-x64-msvc.node
          fi

      - name: Sync jazz-napi platform package versions and optional deps
        run: |
          cd crates/jazz-napi
          pnpm exec napi version --npm-dir npm
          node -e 'const fs=require("fs");const rootPath="package.json";const pkg=JSON.parse(fs.readFileSync(rootPath,"utf8"));const deps=[];for(const entry of fs.readdirSync("npm",{withFileTypes:true})){if(!entry.isDirectory())continue;const child=JSON.parse(fs.readFileSync(`npm/${entry.name}/package.json`,"utf8"));deps.push([child.name,pkg.version]);}deps.sort((a,b)=>a[0].localeCompare(b[0]));pkg.optionalDependencies=Object.fromEntries(deps);fs.writeFileSync(rootPath,`${JSON.stringify(pkg,null,2)}\n`);'

      - name: Stage and verify jazz-napi provenance manifests
        run: |
          if [[ '${{ inputs.napi_matrix }}' == *'win32-x64-msvc'* ]]; then
            node dev/artifacts/stage-napi-manifests.mjs
          else
            node dev/artifacts/stage-napi-manifests.mjs linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64
          fi

      - name: Derive Jazz artifact expectations from sealed manifests
        run: node dev/artifacts/stage-native-fingerprints.mjs

      - name: Build jazz-tools TypeScript package
        run: pnpm --filter jazz-tools build

      - name: Build and seal standalone Inspector from verified SDK artifacts
        run: |
          pnpm --filter inspector run build:web
          node dev/scripts/inspector-prebuilt.mjs seal packages/inspector/dist target/inspector-prebuilt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inspector-prebuilt
          path: target/inspector-prebuilt
          include-hidden-files: true
          if-no-files-found: error

      - name: Build create-jazz TypeScript package
        run: pnpm --filter create-jazz build

      - name: Verify jazz-tools publish artifacts
        run: |
          test -f packages/jazz-tools/dist/index.js
          test -f packages/jazz-tools/dist/index.d.ts
          test -f packages/jazz-tools/dist/backend/index.js
          test -f packages/jazz-tools/dist/react/index.js
          test -f packages/jazz-tools/dist/permissions/index.js

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-jazz-tools
          path: |
            packages/jazz-tools
            !packages/jazz-tools/node_modules
          include-hidden-files: true
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-jazz-wasm
          path: |
            crates/jazz-wasm
            !crates/jazz-wasm/node_modules
            !crates/jazz-wasm/target
          include-hidden-files: true
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-jazz-napi
          path: |
            crates/jazz-napi
            !crates/jazz-napi/node_modules
            !crates/jazz-napi/target
            !crates/jazz-napi/artifacts
            !crates/jazz-napi/*.manifest.json
          include-hidden-files: true
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-create-jazz
          path: |
            packages/create-jazz
            !packages/create-jazz/node_modules
          include-hidden-files: true
          if-no-files-found: error

  verify-linux-napi-consumer:
    name: Verify packed Linux NAPI (${{ matrix.platform }})
    needs: assemble-packages
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-4vcpu-ubuntu-2404
            platform: linux-x64-gnu
          - os: blacksmith-4vcpu-ubuntu-2404-arm
            platform: linux-arm64-gnu
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-build
        with:
          rust-toolchain: ""
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: pkg-jazz-tools
          path: packages/jazz-tools
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: pkg-jazz-wasm
          path: crates/jazz-wasm
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: pkg-jazz-napi
          path: crates/jazz-napi
      - name: Execute packed memory and persistence receipts on Bullseye, AL2023 and Lambda
        run: dev/artifacts/linux-napi/run-packed-smoke.sh ${{ matrix.platform }} "${RUNNER_TEMP}/packed-linux-napi"

  assemble-jazz-rn:
    name: Assemble jazz-rn npm package
    needs:
      - seal-jazz-rn-android
      - build-jazz-rn-ios
    # A skipped optional platform build must not make the normal package
    # assembly skip. Conversely, require both relay receipts whenever RN was
    # explicitly requested.
    if: >-
      ${{
        always() &&
        inputs.include_rn &&
        needs.seal-jazz-rn-android.result == 'success' &&
        needs.build-jazz-rn-ios.result == 'success'
      }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-build
        with:
          rust-toolchain: ""

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: jazz-rn-relay-android
          path: crates/jazz-rn

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: jazz-rn-relay-ios
          path: crates/jazz-rn

      - name: Verify staged jazz-rn relay artifacts
        run: |
          JAZZ_NATIVE_RELAY_SOURCE_REVISION="$(git rev-parse HEAD)" \
            node crates/jazz-rn/scripts/verify-relay-artifacts.mjs android ios

      - name: Build jazz-rn TypeScript package
        run: pnpm --filter jazz-rn build

      - name: Verify packed jazz-rn relay payload
        run: |
          export JAZZ_NATIVE_RELAY_SOURCE_REVISION="$(git rev-parse HEAD)"
          export JAZZ_NATIVE_RELAY_CARGO_NDK_VERSION="${JAZZ_RN_CARGO_NDK_VERSION}"
          node dev/artifacts/rn-packages.mjs stage
          node dev/artifacts/rn-packages.mjs pack "$GITHUB_WORKSPACE/dist"

      - name: Verify jazz-rn publish artifacts
        run: |
          test -f crates/jazz-rn/lib/module/index.js
          test -f crates/jazz-rn/lib/typescript/src/index.d.ts

      - id: artifact
        run: echo "name=pkg-jazz-rn" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-jazz-rn
          path: |
            crates/jazz-rn
            !crates/jazz-rn/node_modules
          include-hidden-files: true
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-jazz-rn-tarball
          path: |
            dist/jazz-rn-*.tgz
            dist/rn-packages.json
          if-no-files-found: error

  verify-jazz-rn-android-consumer:
    name: Verify packaged jazz-rn Android consumer
    needs: assemble-jazz-rn
    if: inputs.include_rn && needs.assemble-jazz-rn.result == 'success'
    # 16 vCPUs: the C++ build for every ABI is most of this job.
    runs-on: blacksmith-16vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-build
        with:
          rust-toolchain: ""

      # Gradle's distribution, dependencies and build cache on a sticky disk
      # of this job's own (the device acceptance one is shared with PRs).
      - name: Point Gradle at its sticky disk
        run: echo "GRADLE_USER_HOME=${RUNNER_TEMP}/gradle-home" >> "${GITHUB_ENV}"
      # Committed only by release-artifacts' pushes to main and release, never
      # by a PR's run, which still mounts it.
      - uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: rn-consumer-android-gradle-${{ github.repository_id }}-v2
          commit: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release') && 'true' || 'false' }}
          path: ${{ runner.temp }}/gradle-home

      # Gradle would otherwise fetch these itself, once per run and without
      # retry. sdkmanager has no retry of its own.
      - name: Install the NDK and CMake the Android build uses
        run: |
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            "${sdkmanager}" --install "ndk;27.1.12297006" "cmake;3.22.1" && exit 0
            echo "::warning::NDK/CMake install attempt ${attempt} failed"
            sleep $((attempt * 10))
          done
          exit 1

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: pkg-jazz-rn-tarball
          path: dist

      - name: Install the packed relay into an isolated Expo fixture
        run: |
          FIXTURE=$(mktemp -d)
          TARBALL=$(find "$GITHUB_WORKSPACE/dist" -name 'jazz-rn-2*.tgz' -type f -print -quit)
          test -n "${TARBALL}"
          node dev/scripts/prepare-jazz-rn-consumer-fixture.mjs \
            examples/todo-client-localfirst-expo \
            "${FIXTURE}/app" \
            "${TARBALL}"
          pnpm --dir "${FIXTURE}/app" install --no-frozen-lockfile
          FIXTURE="${FIXTURE}" node -e '
            const fs = require("fs");
            const path = require("path");
            const installed = fs.realpathSync(require.resolve("jazz-rn/package.json", { paths: [path.join(process.env.FIXTURE, "app")] }));
            const modules = fs.realpathSync(path.join(process.env.FIXTURE, "app", "node_modules"));
            if (!installed.startsWith(modules + path.sep)) throw new Error(`jazz-rn resolved outside the fixture: ${installed}`);
          '
          echo "JAZZ_RN_CONSUMER_FIXTURE=${FIXTURE}/app" >> "$GITHUB_ENV"

      - name: Generate Android host from the packed package
        run: pnpm --dir "$JAZZ_RN_CONSUMER_FIXTURE" exec expo prebuild --platform android --clean --no-install

      - name: Link the packed relay through an Android application
        run: ./gradlew :app:assembleDebug --no-daemon --build-cache
        working-directory: ${{ env.JAZZ_RN_CONSUMER_FIXTURE }}/android

      # The sticky disk unmounts after this: nothing may still run from it.
      - name: Stop Gradle and Kotlin
        if: always()
        run: |
          pkill -f GradleDaemon || true
          pkill -f KotlinCompileDaemon || true
          sleep 2
          # -m targets the whole filesystem: only ever a mounted sticky disk.
          if mountpoint -q "${GRADLE_USER_HOME}"; then fuser -km "${GRADLE_USER_HOME}" 2>/dev/null || true; fi

  verify-jazz-rn-ios-consumer:
    name: Verify packaged jazz-rn iOS consumer
    needs: assemble-jazz-rn
    if: inputs.include_rn && needs.assemble-jazz-rn.result == 'success'
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-build
        with:
          rust-toolchain: ""

      # pod install's downloads: React Native's prebuilt tarballs (which
      # pod-install-retrying.sh copies in and out) and CocoaPods' own caches.
      # Its version is pinned by the lockfile; an older entry is harmless,
      # since the tarballs are named by version.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
            ${{ runner.temp }}/rn-pod-artifacts
          key: rn-ios-pods-macos-15-v3-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: rn-ios-pods-macos-15-v3-
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: pkg-jazz-rn-tarball
          path: dist

      - name: Install the packed relay into an isolated Expo fixture
        run: |
          FIXTURE=$(mktemp -d)
          TARBALL=$(find "$GITHUB_WORKSPACE/dist" -name 'jazz-rn-2*.tgz' -type f -print -quit)
          test -n "${TARBALL}"
          node dev/scripts/prepare-jazz-rn-consumer-fixture.mjs \
            examples/todo-client-localfirst-expo \
            "${FIXTURE}/app" \
            "${TARBALL}"
          pnpm --dir "${FIXTURE}/app" install --no-frozen-lockfile
          FIXTURE="${FIXTURE}" node -e '
            const fs = require("fs");
            const path = require("path");
            const installed = fs.realpathSync(require.resolve("jazz-rn/package.json", { paths: [path.join(process.env.FIXTURE, "app")] }));
            const modules = fs.realpathSync(path.join(process.env.FIXTURE, "app", "node_modules"));
            if (!installed.startsWith(modules + path.sep)) throw new Error(`jazz-rn resolved outside the fixture: ${installed}`);
          '
          echo "JAZZ_RN_CONSUMER_FIXTURE=${FIXTURE}/app" >> "$GITHUB_ENV"

      - name: Generate iOS host from the packed package
        run: pnpm --dir "$JAZZ_RN_CONSUMER_FIXTURE" exec expo prebuild --platform ios --clean --no-install

      - name: Evaluate JazzRn.podspec against each React Native architecture signal
        run: node --test --test-name-pattern='JazzRn.podspec accepts' dev/gates/test/jazz-rn-packaging.test.mjs
        env:
          JAZZ_RN_REQUIRE_RUBY: "1"

      - name: Install the packed native pod
        run: '"${GITHUB_WORKSPACE}/dev/scripts/pod-install-retrying.sh" "${RUNNER_TEMP}/rn-pod-artifacts"'
        working-directory: ${{ env.JAZZ_RN_CONSUMER_FIXTURE }}/ios

      - name: Link the packed relay through an iOS simulator application
        run: |
          xcodebuild \
            -workspace todoclientlocalfirstexpo.xcworkspace \
            -scheme todoclientlocalfirstexpo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build
        working-directory: ${{ env.JAZZ_RN_CONSUMER_FIXTURE }}/ios
