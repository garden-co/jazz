name: Build Jazz packages

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (branch, tag, or SHA) to check out for every build job. Empty means use the caller's default ref.
        required: false
        type: string
        default: ""
      napi_matrix:
        description: JSON matrix for NAPI platform packages. Release callers use every platform; preview callers may omit expensive optional platforms.
        required: false
        type: string
        default: '[{"os":"blacksmith-4vcpu-ubuntu-2404","target":"x86_64-unknown-linux-gnu","platform":"linux-x64-gnu","use_sccache":true},{"os":"blacksmith-6vcpu-macos-15","target":"x86_64-apple-darwin","platform":"darwin-x64","use_sccache":false},{"os":"blacksmith-6vcpu-macos-15","target":"aarch64-apple-darwin","platform":"darwin-arm64","use_sccache":false},{"os":"blacksmith-2vcpu-windows-2025","target":"x86_64-pc-windows-msvc","platform":"win32-x64-msvc","use_sccache":false}]'
    outputs:
      tools_artifact:
        description: Artifact name for the assembled jazz-tools package.
        value: pkg-jazz-tools
      wasm_artifact:
        description: Artifact name for the assembled jazz-wasm package.
        value: pkg-jazz-wasm
      napi_artifact:
        description: Artifact name for the assembled jazz-napi package (loader + npm/ platform packages).
        value: pkg-jazz-napi
      create_jazz_artifact:
        description: Artifact name for the assembled create-jazz package.
        value: pkg-create-jazz
      jazz_rn_artifact:
        description: Artifact name for the assembled jazz-rn package with its Android and iOS relay artifacts.
        value: pkg-jazz-rn

env:
  CACHE_SCOPE_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id || github.repository_id }}

jobs:
  build-linux:
    name: Build CLI Linux (${{ matrix.arch }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      CARGO_ZIGBUILD_CACHE_DIR: /tmp/cargo-zigbuild-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x64
            output: jazz-tools-linux-x64
          - target: aarch64-unknown-linux-musl
            arch: arm64
            output: jazz-tools-linux-arm64

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-build
        with:
          rust-targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
          setup-node: "false"

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.0
          cache-key: ${{ env.CACHE_SCOPE_REPOSITORY_ID }}-${{ matrix.target }}

      - uses: ./.github/actions/install-rust-tool
        with:
          tool: cargo-zigbuild

      - name: Build CLI binary
        run: cargo zigbuild -p jazz-cli --bin jazz-tools --features otel --release --target ${{ matrix.target }}

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/jazz-tools dist/${{ matrix.output }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error

  build-macos:
    name: Build CLI macOS (${{ matrix.arch }})
    runs-on: blacksmith-6vcpu-macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
            output: jazz-tools-darwin-arm64
          - target: x86_64-apple-darwin
            arch: x64
            output: jazz-tools-darwin-x64

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-build
        with:
          rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          setup-node: "false"

      - name: Build CLI binary
        run: cargo build -p jazz-cli --bin jazz-tools --features otel --release --target ${{ matrix.target }}

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/jazz-tools dist/${{ matrix.output }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error

  build-wasm:
    name: Build jazz-wasm
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-build
        with:
          rust-targets: wasm32-unknown-unknown
          sccache: "true"
          sccache-key: release-wasm-sccache-${{ github.event.pull_request.head.repo.id || github.repository_id }}-v1

      - uses: ./.github/actions/install-rust-tool
        with:
          tool: wasm-pack@0.13.1

      - name: Build jazz-wasm npm package
        run: pnpm --filter jazz-wasm build

      - name: Verify built jazz-wasm publish artifacts
        run: |
          test -f crates/jazz-wasm/pkg/jazz_wasm_bg.wasm
          test -f crates/jazz-wasm/pkg/jazz_wasm.js
          test -f crates/jazz-wasm/pkg/jazz_wasm.d.ts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jazz-wasm-pkg
          path: crates/jazz-wasm/pkg
          # The sealed provenance receipt is intentionally dot-prefixed. The
          # upload action excludes hidden files unless this is explicit.
          include-hidden-files: true
          if-no-files-found: error

  build-napi:
    name: Build jazz-napi (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.napi_matrix) }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-build
        with:
          rust-targets: ${{ matrix.target }}
          sccache: ${{ matrix.use_sccache && 'true' || 'false' }}
          sccache-key: release-napi-sccache-${{ github.event.pull_request.head.repo.id || github.repository_id }}-${{ matrix.platform }}-v1

      # The Windows runner image supplies the MSVC toolchain but not libclang.
      # RocksDB's zstd-sys build uses bindgen, which must be pointed at the DLL
      # before napi invokes Cargo.
      - name: Install libclang for Windows bindgen
        if: matrix.platform == 'win32-x64-msvc'
        shell: pwsh
        run: |
          choco install llvm --version=21.1.8 --yes --no-progress --limit-output
          $libclangPath = Join-Path $env:ProgramFiles "LLVM\bin"
          if (-not (Test-Path (Join-Path $libclangPath "libclang.dll"))) {
            throw "LLVM installation did not provide libclang.dll at $libclangPath"
          }
          "LIBCLANG_PATH=$libclangPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $libclangPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build jazz-napi binding
        run: |
          node dev/artifacts/build.mjs napi release --target ${{ matrix.target }}
          node dev/artifacts/provenance.mjs verify napi release --target ${{ matrix.target }}
          node dev/artifacts/stage-napi-loader.mjs ${{ matrix.platform }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jazz-napi-binding-${{ matrix.platform }}
          path: |
            crates/jazz-napi/jazz-napi.${{ matrix.platform }}.node
            crates/jazz-napi/jazz-napi.${{ matrix.platform }}.manifest.json
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform == 'linux-x64-gnu'
        with:
          name: jazz-napi-loader
          path: |
            crates/jazz-napi/index.js
            crates/jazz-napi/index.d.ts
            crates/jazz-napi/native-loader.cjs
            crates/jazz-napi/native-artifact-fingerprint.cjs
          if-no-files-found: error

  build-jazz-rn-android:
    name: Build jazz-rn Android relay artifacts
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-build
        with:
          rust-targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          sccache: "true"
          sccache-key: release-jazz-rn-android-${{ github.event.pull_request.head.repo.id || github.repository_id }}-v1

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install pinned Android NDK
        run: sdkmanager --install "ndk;27.1.12297006"
      - name: Build and verify Android relay archive slices
        run: |
          JAZZ_NATIVE_RELAY_SOURCE_REVISION="$(git rev-parse HEAD)" \
            ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/27.1.12297006" \
            pnpm --filter jazz-rn build:relay:android
          JAZZ_NATIVE_RELAY_SOURCE_REVISION="$(git rev-parse HEAD)" \
            node crates/jazz-rn/scripts/verify-relay-artifacts.mjs android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jazz-rn-relay-android
          path: |
            crates/jazz-rn/android/src/main/jniLibs
            crates/jazz-rn/android/jazz-native-relay.manifest.json
            crates/jazz-rn/native/include
          if-no-files-found: error

  build-jazz-rn-ios:
    name: Build jazz-rn iOS relay XCFramework
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-build
        with:
          rust-targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
          sccache: "true"
          sccache-key: release-jazz-rn-ios-${{ github.event.pull_request.head.repo.id || github.repository_id }}-v1

      - name: Build and verify iOS relay XCFramework
        run: |
          JAZZ_NATIVE_RELAY_SOURCE_REVISION="$(git rev-parse HEAD)" \
            pnpm --filter jazz-rn build:relay:ios
          JAZZ_NATIVE_RELAY_SOURCE_REVISION="$(git rev-parse HEAD)" \
            node crates/jazz-rn/scripts/verify-relay-artifacts.mjs ios
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jazz-rn-relay-ios
          path: |
            crates/jazz-rn/JazzNativeRelay.xcframework
            crates/jazz-rn/ios/jazz-native-relay.manifest.json
            crates/jazz-rn/native/include
          if-no-files-found: error

  assemble-packages:
    name: Assemble npm packages
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs:
      - build-linux
      - build-macos
      - build-wasm
      - build-napi
      - build-jazz-rn-android
      - build-jazz-rn-ios

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-build
        with:
          rust-toolchain: ""

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: jazz-tools-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: jazz-wasm-pkg
          path: crates/jazz-wasm/pkg

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: jazz-napi-loader
          path: crates/jazz-napi

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: jazz-napi-binding-*
          path: crates/jazz-napi/artifacts
          merge-multiple: true

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: jazz-rn-relay-android
          path: crates/jazz-rn

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: jazz-rn-relay-ios
          path: crates/jazz-rn

      - name: Verify staged jazz-rn relay artifacts
        run: |
          JAZZ_NATIVE_RELAY_SOURCE_REVISION="$(git rev-parse HEAD)" \
            node crates/jazz-rn/scripts/verify-relay-artifacts.mjs android ios

      - name: Stage jazz-napi platform package artifacts
        run: |
          cd crates/jazz-napi
          pnpm exec napi create-npm-dirs
          pnpm exec napi artifacts -d artifacts --npm-dir npm

      - name: Remove Windows package omitted by this build
        if: ${{ !contains(inputs.napi_matrix, 'win32-x64-msvc') }}
        run: |
          node -e 'require("node:fs").rmSync("crates/jazz-napi/npm/win32-x64-msvc", { recursive: true, force: true })'

      - name: Verify staged jazz-napi platform artifacts
        run: |
          test -f crates/jazz-napi/npm/linux-x64-gnu/jazz-napi.linux-x64-gnu.node
          test -f crates/jazz-napi/npm/darwin-x64/jazz-napi.darwin-x64.node
          test -f crates/jazz-napi/npm/darwin-arm64/jazz-napi.darwin-arm64.node
          if [[ '${{ inputs.napi_matrix }}' == *'win32-x64-msvc'* ]]; then
            test -f crates/jazz-napi/npm/win32-x64-msvc/jazz-napi.win32-x64-msvc.node
          fi

      - name: Sync jazz-napi platform package versions and optional deps
        run: |
          cd crates/jazz-napi
          pnpm exec napi version --npm-dir npm
          node -e 'const fs=require("fs");const rootPath="package.json";const pkg=JSON.parse(fs.readFileSync(rootPath,"utf8"));const deps=[];for(const entry of fs.readdirSync("npm",{withFileTypes:true})){if(!entry.isDirectory())continue;const child=JSON.parse(fs.readFileSync(`npm/${entry.name}/package.json`,"utf8"));deps.push([child.name,pkg.version]);}deps.sort((a,b)=>a[0].localeCompare(b[0]));pkg.optionalDependencies=Object.fromEntries(deps);fs.writeFileSync(rootPath,`${JSON.stringify(pkg,null,2)}\n`);'

      - name: Stage and verify jazz-napi provenance manifests
        run: |
          if [[ '${{ inputs.napi_matrix }}' == *'win32-x64-msvc'* ]]; then
            node dev/artifacts/stage-napi-manifests.mjs
          else
            node dev/artifacts/stage-napi-manifests.mjs linux-x64-gnu darwin-x64 darwin-arm64
          fi

      - name: Derive Jazz artifact expectations from sealed manifests
        run: node dev/artifacts/stage-native-fingerprints.mjs

      - name: Build jazz-tools TypeScript package
        run: pnpm --filter jazz-tools build

      - name: Build create-jazz TypeScript package
        run: pnpm --filter create-jazz build

      - name: Build jazz-rn TypeScript package
        run: pnpm --filter jazz-rn build

      - name: Verify jazz-tools publish artifacts
        run: |
          test -f packages/jazz-tools/dist/index.js
          test -f packages/jazz-tools/dist/index.d.ts
          test -f packages/jazz-tools/dist/backend/index.js
          test -f packages/jazz-tools/dist/react/index.js
          test -f packages/jazz-tools/dist/permissions/index.js

      - name: Verify jazz-rn publish artifacts
        run: |
          test -f crates/jazz-rn/lib/module/index.js
          test -f crates/jazz-rn/lib/typescript/src/index.d.ts

      - name: Stage CLI binaries into jazz-tools npm package
        run: |
          mkdir -p packages/jazz-tools/bin/native
          for bin in \
            jazz-tools-darwin-arm64 \
            jazz-tools-darwin-x64 \
            jazz-tools-linux-arm64 \
            jazz-tools-linux-x64; do
            SOURCE="dist/${bin}"
            test -f "${SOURCE}" || { echo "Missing release native binary ${bin}"; exit 1; }
            cp "${SOURCE}" packages/jazz-tools/bin/native/
          done
          chmod 755 \
            packages/jazz-tools/bin/native/jazz-tools-darwin-arm64 \
            packages/jazz-tools/bin/native/jazz-tools-darwin-x64 \
            packages/jazz-tools/bin/native/jazz-tools-linux-arm64 \
            packages/jazz-tools/bin/native/jazz-tools-linux-x64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-jazz-tools
          path: |
            packages/jazz-tools
            !packages/jazz-tools/node_modules
          include-hidden-files: true
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-jazz-wasm
          path: |
            crates/jazz-wasm
            !crates/jazz-wasm/node_modules
            !crates/jazz-wasm/target
          include-hidden-files: true
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-jazz-napi
          path: |
            crates/jazz-napi
            !crates/jazz-napi/node_modules
            !crates/jazz-napi/target
            !crates/jazz-napi/artifacts
            !crates/jazz-napi/*.manifest.json
          include-hidden-files: true
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-create-jazz
          path: |
            packages/create-jazz
            !packages/create-jazz/node_modules
          include-hidden-files: true
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-jazz-rn
          path: |
            crates/jazz-rn
            !crates/jazz-rn/node_modules
          include-hidden-files: true
          if-no-files-found: error
