name: CI suite

on:
  workflow_call:
    inputs:
      trusted-cache:
        description: Allow OIDC-backed cache access from trusted runs.
        required: true
        type: boolean
      sccache-write:
        description: Use the sccache writer role (main and merge-group/** pushes) instead of the trusted PR reader role.
        required: true
        type: boolean
      scope:
        # full: every partition (main, release and merge-group/** pushes,
        # dispatches and release PRs). fast: lint and
        # typecheck only (ready PRs). none: nothing (draft PRs).
        description: Which partitions to run, full, fast or none.
        required: false
        type: string
        default: full

env:
  CACHE_SCOPE_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id || github.repository_id }}
  # The entry workflow grants this suite OIDC only for trusted invocations.
  # In the unmodified base workflow, PR and manual callers set id-token: none,
  # do not inherit secrets, and disable every credentialed cross-ref cache below.
  # GitHub's native repository/ref-scoped cache actions remain available to all
  # callers without receiving an explicit cloud credential here.

jobs:
  lint:
    if: inputs.scope != 'none'
    # Full workspace compilation and checks exceed the four-core job budget.
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 15
    container:
      image: ghcr.io/garden-co/jazz-ci-toolchain@sha256:457972f436c36e4d00c31d89fe13506e43afff95fe933e831c0efb4b6f492dba
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Authenticate trusted sccache writer
        if: inputs.trusted-cache && inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Authenticate trusted sccache reader
        if: inputs.trusted-cache && !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_PR_READER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Export trusted sccache configuration
        if: inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '')
        env:
          CACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          CACHE_REGION: ${{ vars.SCCACHE_REGION }}
        run: |
          echo "SCCACHE_BUCKET=${CACHE_BUCKET}" >> "${GITHUB_ENV}"
          echo "SCCACHE_REGION=${CACHE_REGION}" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_USE_SSL=true" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_KEY_PREFIX=jazz-ci/v1/production/blacksmith-v1" >> "${GITHUB_ENV}"
      - uses: ./.github/actions/setup-blacksmith
        with:
          sccache-s3: ${{ inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '') }}

      # This named partition is also the local source of truth. Do not copy
      # individual commands here: local `--ci-equivalent` must execute the
      # same complete partition rather than a drifting approximation.
      # PR-level checks cannot catch two independently green PRs whose merged
      # tree no longer compiles, so this partition also runs the exhaustive
      # workspace target-class check on every push to the integration branch.
      - name: Run CI-equivalent lint, metadata and workspace check partition
        run: node dev/gates/local-ci-equivalent.mjs --ci-partition lint
      - name: Report sccache statistics
        if: always()
        run: sccache --show-stats

  test-rust-workspace:
    if: inputs.scope == 'full'
    # Full workspace compilation and checks exceed the four-core job budget.
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 15
    container:
      image: ghcr.io/garden-co/jazz-ci-toolchain@sha256:457972f436c36e4d00c31d89fe13506e43afff95fe933e831c0efb4b6f492dba
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Authenticate trusted sccache writer
        if: inputs.trusted-cache && inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Authenticate trusted sccache reader
        if: inputs.trusted-cache && !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_PR_READER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Export trusted sccache configuration
        if: inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '')
        env:
          CACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          CACHE_REGION: ${{ vars.SCCACHE_REGION }}
        run: |
          echo "SCCACHE_BUCKET=${CACHE_BUCKET}" >> "${GITHUB_ENV}"
          echo "SCCACHE_REGION=${CACHE_REGION}" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_USE_SSL=true" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_KEY_PREFIX=jazz-ci/v1/production/blacksmith-v1" >> "${GITHUB_ENV}"
      - uses: ./.github/actions/setup-blacksmith
        with:
          sccache-s3: ${{ inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '') }}
      - name: Run CI-equivalent workspace Rust partition
        run: node dev/gates/local-ci-equivalent.mjs --ci-partition rust-workspace
      # Generated by dev/gates/jazz-ffi.sh in the partition above, for the
      # Swift and Kotlin packages.
      - name: Upload jazz-ffi Swift and Kotlin bindings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jazz-ffi-bindings
          path: target/jazz-ffi-bindings
          if-no-files-found: error
      - name: Upload Rust test receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-test-receipt
          path: target/test-receipts/*.json
          if-no-files-found: error
      - name: Report sccache statistics
        if: always()
        run: sccache --show-stats

  # This is deliberately an exact, named storage partition rather than an
  # incidental member of the broad nextest shard. A green Rust suite must mean
  # current code opened the pinned SQLite corpus and refused older stores. The
  # pinned real-browser corpus is the same kind of exact receipt in test-ts,
  # which already seals the NAPI/WASM pair it needs.
  test-storage-compat:
    if: inputs.scope == 'full'
    # The corpus tests take seconds; the job is compile-bound, so it gets the same
    # 16-vCPU runner and trusted shared compile cache as the other compile
    # jobs. On four cores without the S3 tier it was the CI long pole.
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    container:
      image: ghcr.io/garden-co/jazz-ci-toolchain@sha256:457972f436c36e4d00c31d89fe13506e43afff95fe933e831c0efb4b6f492dba
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Authenticate trusted sccache writer
        if: inputs.trusted-cache && inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Authenticate trusted sccache reader
        if: inputs.trusted-cache && !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_PR_READER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Export trusted sccache configuration
        if: inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '')
        env:
          CACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          CACHE_REGION: ${{ vars.SCCACHE_REGION }}
        run: |
          echo "SCCACHE_BUCKET=${CACHE_BUCKET}" >> "${GITHUB_ENV}"
          echo "SCCACHE_REGION=${CACHE_REGION}" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_USE_SSL=true" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_KEY_PREFIX=jazz-ci/v1/production/blacksmith-v1" >> "${GITHUB_ENV}"
      - uses: ./.github/actions/setup-blacksmith
        with:
          sccache-s3: ${{ inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '') }}
      - name: Run CI-equivalent native storage compatibility partition
        run: node dev/gates/local-ci-equivalent.mjs --ci-partition storage-compat
      # The bounded maintained-vs-one-shot oracle (canonical seed 11) shares
      # this job because it links the exact `jazz` build the native corpus
      # just made, so it costs one run instead of a second cold compile on its
      # own runner. The Rust test remains #[ignore]: its full randomized matrix
      # is the nightly/manual soak. It still runs when the corpus step fails so
      # both results are always reported.
      - name: Run CI-equivalent differential oracle partition
        if: ${{ !cancelled() }}
        run: node dev/gates/local-ci-equivalent.mjs --ci-partition rust-differential
      # jazz-db's SQL must also run on Durable Object SQLite; this runs the
      # suite under its limits. Like the oracle, it reports even when an
      # earlier step fails.
      - name: Run CI-equivalent Durable Object SQLite limits partition
        if: ${{ !cancelled() }}
        run: node dev/gates/local-ci-equivalent.mjs --ci-partition durable-object-limits
      - name: Report sccache statistics
        if: always()
        run: sccache --show-stats

  # jazz-ffi's generated Kotlin and Swift must compile and load the library:
  # runs on the runner image (JDK, kotlinc, swiftc), not the Rust container.
  test-jazz-ffi-bindings:
    if: inputs.scope == 'full'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Generate, compile and run jazz-ffi's Kotlin and Swift bindings, the Jazz Swift package and its example
        run: node dev/gates/local-ci-equivalent.mjs --ci-partition jazz-ffi-bindings

  # Branch protection requires this stable check name. It aggregates the Rust
  # correctness jobs and stays red whenever any dependency fails or is cancelled.
  # test-storage-compat also runs the bounded differential oracle partition.
  test-rust:
    if: always() && inputs.scope == 'full'
    needs: [test-rust-workspace, test-storage-compat, test-jazz-ffi-bindings]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Require all Rust partitions
        env:
          WORKSPACE_RESULT: ${{ needs.test-rust-workspace.result }}
          STORAGE_COMPAT_RESULT: ${{ needs.test-storage-compat.result }}
          JAZZ_FFI_BINDINGS_RESULT: ${{ needs.test-jazz-ffi-bindings.result }}
        run: |
          test "${WORKSPACE_RESULT}" = success
          test "${STORAGE_COMPAT_RESULT}" = success
          test "${JAZZ_FFI_BINDINGS_RESULT}" = success

  # The Go bindings (packages/jazz-go over crates/jazz-ffi's C ABI) and
  # the StagePlan Go example: their bindings are current, and their tests
  # (which open the app as a backend on a memory store) pass on Linux.
  test-go:
    if: inputs.scope == 'full'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/garden-co/jazz-ci-toolchain@sha256:457972f436c36e4d00c31d89fe13506e43afff95fe933e831c0efb4b6f492dba
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GO_VERSION: "1.23.4"
      GO_SHA256: 6924efde5de86fe277676e929dc9917d466efa02fb934197bc2eba35d5680971
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      # The toolchain image has Rust; this job needs no pnpm install.
      - name: Trust the checkout
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: Install Go
        run: |
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tgz
          echo "${GO_SHA256}  /tmp/go.tgz" | sha256sum -c -
          tar -C /usr/local -xzf /tmp/go.tgz
          echo /usr/local/go/bin >> "${GITHUB_PATH}"
      - name: Build jazz-ffi and jazz-tools
        run: |
          cargo build -p jazz-ffi
          cargo build -p jazz-cli --bin jazz-tools
      - name: StagePlan Go bindings are current
        working-directory: examples/stage-plan/apps/go-cli
        run: ../../../../target/debug/jazz-tools generate --check
      - name: gofmt and go vet
        run: |
          test -z "$(gofmt -l packages/jazz-go examples/stage-plan/apps/go-cli)"
          (cd packages/jazz-go && go vet ./...)
          (cd examples/stage-plan/apps/go-cli && go vet ./...)
      - name: go vet the jazz-codegen Go goldens
        run: |
          # Each committed golden, as the jazzapp package of a module of its own.
          for dir in crates/jazz-codegen/tests/apps/*/jazzapp crates/jazz-codegen/tests/go-apps/*/jazzapp; do
            [ -d "${dir}" ] || continue
            module="$(mktemp -d)"
            mkdir "${module}/jazzapp"
            cp "${dir}/jazz_app.go" "${module}/jazzapp/"
            printf 'module example.com/golden\n\ngo 1.22\n\nrequire github.com/garden-co/jazz/packages/jazz-go v0.0.0\n\nreplace github.com/garden-co/jazz/packages/jazz-go => %s/packages/jazz-go\n' "${GITHUB_WORKSPACE}" > "${module}/go.mod"
            (cd "${module}" && go vet ./... && test -z "$(gofmt -l .)") || { echo "::error::${dir} fails go vet or gofmt"; exit 1; }
          done
      - name: Test the Go runtime and the StagePlan Go example
        run: |
          (cd packages/jazz-go && go test ./...)
          (cd examples/stage-plan/apps/go-cli && go test -v ./...)

  test-ts:
    if: inputs.scope == 'full'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 20
    # JAZZ_NAPI_RELEASE=0 (debug builds) removed 2026-07-19: debug-profile
    # jazz-napi .node files fail dlopen on the Linux runners deterministically
    # (root cause TBD; see dev/CI_NOTES.md). Release builds load fine.

    container:
      image: ghcr.io/garden-co/jazz-ci-toolchain@sha256:457972f436c36e4d00c31d89fe13506e43afff95fe933e831c0efb4b6f492dba
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Authenticate trusted sccache writer
        if: inputs.trusted-cache && inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Authenticate trusted sccache reader
        if: inputs.trusted-cache && !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_PR_READER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Export trusted sccache configuration
        if: inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '')
        env:
          CACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          CACHE_REGION: ${{ vars.SCCACHE_REGION }}
        run: |
          echo "SCCACHE_BUCKET=${CACHE_BUCKET}" >> "${GITHUB_ENV}"
          echo "SCCACHE_REGION=${CACHE_REGION}" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_USE_SSL=true" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_KEY_PREFIX=jazz-ci/v1/production/blacksmith-v1" >> "${GITHUB_ENV}"
      - name: Export trusted Turbo cache signing key
        if: inputs.trusted-cache
        env:
          CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
        run: echo "TURBO_REMOTE_CACHE_SIGNATURE_KEY=${CACHE_SIGNATURE_KEY}" >> "${GITHUB_ENV}"
      - name: Set up signed Turbo Remote Cache
        if: inputs.trusted-cache
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: garden-co
          policy: pol_0b019736-e95d-4f60-a5dd-e9415148834c
          audience: https://github.com/garden-co
      - uses: ./.github/actions/setup-blacksmith
        with:
          sccache-s3: ${{ inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '') }}

      # Restore compiler state only; tsc still checks current source and native
      # declarations. Compatible prior revisions are invalidated by TypeScript.
      - name: Restore TypeScript test compiler state
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: packages/jazz-tools/node_modules/.cache/tsc
          key: test-ts-tsc-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'packages/jazz-tools/tsconfig*.json', '.github/workflows/ci-suite.yml') }}-${{ github.sha }}
          restore-keys: |
            test-ts-tsc-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'packages/jazz-tools/tsconfig*.json', '.github/workflows/ci-suite.yml') }}-

      # Builds provenance-checked test artifacts, then runs the parallel Node /
      # browser suites. The local CI-equivalent gate calls this exact partition.
      # The integration-branch workspace target-class check that used to run
      # first here now runs in the lint partition, off this job's critical path.
      - name: Run CI-equivalent TypeScript partition
        run: node dev/gates/local-ci-equivalent.mjs --ci-partition typescript
      - name: Upload BandChat failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: band-chat-browser-failure-screenshots
          # This fixture renders synthetic users and rooms; do not broaden to
          # browser traces, storage profiles, or arbitrary application captures.
          path: examples/band-chat/apps/nextjs-betterauth/tests/browser/__screenshots__/band-chat.test.tsx/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Report sccache statistics
        if: always()
        run: sccache --show-stats

  # The Next.js trace test (B65-1) on ready PRs that touch how a backend
  # reaches jazz-napi (dev/gates/next-trace.mjs decides from the PR's diff and
  # otherwise stops at once); the full scope runs it in test-ts. It builds the
  # sealed native pair, packs jazz-tools/jazz-napi/jazz-wasm into a pnpm Next
  # app and serves the route from its traced files only.
  test-next-trace:
    if: inputs.scope == 'fast'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    container:
      image: ghcr.io/garden-co/jazz-ci-toolchain@sha256:457972f436c36e4d00c31d89fe13506e43afff95fe933e831c0efb4b6f492dba
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # The PR's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      # Before any setup: a PR that touches nothing the trace guards stops here.
      - name: Decide whether this PR runs the Next.js trace
        id: decide
        run: node dev/gates/local-ci-equivalent.mjs --ci-partition next-trace-decide
      - name: Authenticate trusted sccache writer
        if: steps.decide.outputs.run == 'true' && inputs.trusted-cache && inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Authenticate trusted sccache reader
        if: steps.decide.outputs.run == 'true' && inputs.trusted-cache && !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_PR_READER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Export trusted sccache configuration
        if: inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '')
        env:
          CACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          CACHE_REGION: ${{ vars.SCCACHE_REGION }}
        run: |
          echo "SCCACHE_BUCKET=${CACHE_BUCKET}" >> "${GITHUB_ENV}"
          echo "SCCACHE_REGION=${CACHE_REGION}" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_USE_SSL=true" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_KEY_PREFIX=jazz-ci/v1/production/blacksmith-v1" >> "${GITHUB_ENV}"
      - name: Export trusted Turbo cache signing key
        if: inputs.trusted-cache
        env:
          CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
        run: echo "TURBO_REMOTE_CACHE_SIGNATURE_KEY=${CACHE_SIGNATURE_KEY}" >> "${GITHUB_ENV}"
      - name: Set up signed Turbo Remote Cache
        if: steps.decide.outputs.run == 'true' && inputs.trusted-cache
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: garden-co
          policy: pol_0b019736-e95d-4f60-a5dd-e9415148834c
          audience: https://github.com/garden-co
      - uses: ./.github/actions/setup-blacksmith
        if: steps.decide.outputs.run == 'true'
        with:
          sccache-s3: ${{ inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '') }}

      - name: Run Next.js trace partition
        if: steps.decide.outputs.run == 'true'
        run: node dev/gates/local-ci-equivalent.mjs --ci-partition next-trace
      - name: Report sccache statistics
        if: always()
        run: sccache --show-stats

  # The ordinary TypeScript consumer suite intentionally excludes
  # tests/react-native. Keep this bridge-enabled producer and the RN tests in
  # their own named partition so a green web framework suite cannot stand in
  # for native bridge coverage.
  test-react-native:
    if: inputs.scope == 'full'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 20
    container:
      image: ghcr.io/garden-co/jazz-ci-toolchain@sha256:457972f436c36e4d00c31d89fe13506e43afff95fe933e831c0efb4b6f492dba
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Authenticate trusted sccache writer
        if: inputs.trusted-cache && inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Authenticate trusted sccache reader
        if: inputs.trusted-cache && !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_PR_READER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Export trusted sccache configuration
        if: inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '')
        env:
          CACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          CACHE_REGION: ${{ vars.SCCACHE_REGION }}
        run: |
          echo "SCCACHE_BUCKET=${CACHE_BUCKET}" >> "${GITHUB_ENV}"
          echo "SCCACHE_REGION=${CACHE_REGION}" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_USE_SSL=true" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_KEY_PREFIX=jazz-ci/v1/production/blacksmith-v1" >> "${GITHUB_ENV}"
      - name: Export trusted Turbo cache signing key
        if: inputs.trusted-cache
        env:
          CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
        run: echo "TURBO_REMOTE_CACHE_SIGNATURE_KEY=${CACHE_SIGNATURE_KEY}" >> "${GITHUB_ENV}"
      - name: Set up signed Turbo Remote Cache
        if: inputs.trusted-cache
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: garden-co
          policy: pol_0b019736-e95d-4f60-a5dd-e9415148834c
          audience: https://github.com/garden-co
      - uses: ./.github/actions/setup-blacksmith
        with:
          sccache-s3: ${{ inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '') }}
      - name: Run CI-equivalent React Native bridge partition
        run: node dev/gates/local-ci-equivalent.mjs --ci-partition react-native
      - name: Report sccache statistics
        if: always()
        run: sccache --show-stats
