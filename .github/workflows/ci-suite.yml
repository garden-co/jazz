name: CI suite

on:
  workflow_call:
    inputs:
      trusted-cache:
        description: Allow OIDC-backed cache access from trusted runs.
        required: true
        type: boolean
      sccache-write:
        description: Use the main-only sccache writer role instead of the trusted PR reader role.
        required: true
        type: boolean

env:
  CACHE_SCOPE_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id || github.repository_id }}
  # The entry workflow grants this suite OIDC only for trusted invocations.
  # In the unmodified base workflow, PR and manual callers set id-token: none,
  # do not inherit secrets, and disable every credentialed cross-ref cache below.
  # GitHub's native repository/ref-scoped cache actions remain available to all
  # callers without receiving an explicit cloud credential here.

jobs:
  lint:
    # Full workspace compilation and checks exceed the four-core job budget.
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 15
    container:
      image: ghcr.io/garden-co/jazz-ci-toolchain@sha256:dcb4ec5e4f5507b258805617d58ee6976f7dcee2e9afe1b05ae3d41cc185ef35
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Authenticate trusted sccache writer
        if: inputs.trusted-cache && inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Authenticate trusted sccache reader
        if: inputs.trusted-cache && !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_PR_READER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Export trusted sccache configuration
        if: inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '')
        env:
          CACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          CACHE_REGION: ${{ vars.SCCACHE_REGION }}
        run: |
          echo "SCCACHE_BUCKET=${CACHE_BUCKET}" >> "${GITHUB_ENV}"
          echo "SCCACHE_REGION=${CACHE_REGION}" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_USE_SSL=true" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_KEY_PREFIX=jazz-ci/v1/production/blacksmith-v1" >> "${GITHUB_ENV}"
      - uses: ./.github/actions/setup-blacksmith
        with:
          sccache-s3: ${{ inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '') }}

      # This named partition is also the local source of truth. Do not copy
      # individual commands here: local `--ci-equivalent` must execute the
      # same complete partition rather than a drifting approximation.
      # PR-level checks cannot catch two independently green PRs whose merged
      # tree no longer compiles, so this partition also runs the exhaustive
      # workspace target-class check on every push to the integration branch.
      - name: Run CI-equivalent lint, metadata and workspace check partition
        run: node dev/gates/local-ci-equivalent.mjs --ci-partition lint
      - name: Report sccache statistics
        if: always()
        run: sccache --show-stats

  test-rust-workspace:
    # Full workspace compilation and checks exceed the four-core job budget.
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 15
    container:
      image: ghcr.io/garden-co/jazz-ci-toolchain@sha256:dcb4ec5e4f5507b258805617d58ee6976f7dcee2e9afe1b05ae3d41cc185ef35
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Authenticate trusted sccache writer
        if: inputs.trusted-cache && inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Authenticate trusted sccache reader
        if: inputs.trusted-cache && !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_PR_READER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Export trusted sccache configuration
        if: inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '')
        env:
          CACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          CACHE_REGION: ${{ vars.SCCACHE_REGION }}
        run: |
          echo "SCCACHE_BUCKET=${CACHE_BUCKET}" >> "${GITHUB_ENV}"
          echo "SCCACHE_REGION=${CACHE_REGION}" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_USE_SSL=true" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_KEY_PREFIX=jazz-ci/v1/production/blacksmith-v1" >> "${GITHUB_ENV}"
      - uses: ./.github/actions/setup-blacksmith
        with:
          sccache-s3: ${{ inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '') }}
      - name: Run CI-equivalent workspace Rust partition
        run: node dev/gates/local-ci-equivalent.mjs --ci-partition rust-workspace
      - name: Upload Rust test receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-test-receipt
          path: target/test-receipts/*.json
          if-no-files-found: error
      - name: Report sccache statistics
        if: always()
        run: sccache --show-stats

  # This is deliberately an exact, named historical-storage partition rather
  # than an incidental member of the broad nextest shard. A green Rust suite
  # must mean current code opened the pinned native corpus. The pinned
  # real-browser corpus is the same kind of exact receipt in test-ts, which
  # already seals the NAPI/WASM pair it needs.
  test-storage-compat:
    # The corpus tests take seconds; the job is compile-bound, so it gets the same
    # 16-vCPU runner and trusted shared compile cache as the other compile
    # jobs. On four cores without the S3 tier it was the CI long pole.
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    container:
      image: ghcr.io/garden-co/jazz-ci-toolchain@sha256:dcb4ec5e4f5507b258805617d58ee6976f7dcee2e9afe1b05ae3d41cc185ef35
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Authenticate trusted sccache writer
        if: inputs.trusted-cache && inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Authenticate trusted sccache reader
        if: inputs.trusted-cache && !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_PR_READER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Export trusted sccache configuration
        if: inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '')
        env:
          CACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          CACHE_REGION: ${{ vars.SCCACHE_REGION }}
        run: |
          echo "SCCACHE_BUCKET=${CACHE_BUCKET}" >> "${GITHUB_ENV}"
          echo "SCCACHE_REGION=${CACHE_REGION}" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_USE_SSL=true" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_KEY_PREFIX=jazz-ci/v1/production/blacksmith-v1" >> "${GITHUB_ENV}"
      - uses: ./.github/actions/setup-blacksmith
        with:
          sccache-s3: ${{ inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '') }}
      - name: Run CI-equivalent native storage compatibility partition
        run: node dev/gates/local-ci-equivalent.mjs --ci-partition storage-compat
      # The bounded real M3 oracle smoke (canonical seed 11) shares this job
      # because its libtest is the exact `jazz` lib-test unit the native corpus
      # just built, so it costs one run instead of a second cold compile on its
      # own runner. The Rust test remains #[ignore]: its full randomized matrix
      # is the nightly/manual soak. It still runs when the corpus step fails so
      # both results are always reported.
      - name: Run CI-equivalent M3 differential partition
        if: ${{ !cancelled() }}
        run: node dev/gates/local-ci-equivalent.mjs --ci-partition rust-differential
      - name: Report sccache statistics
        if: always()
        run: sccache --show-stats

  # Branch protection requires this stable check name. It aggregates the Rust
  # correctness jobs and stays red whenever any dependency fails or is cancelled.
  # test-storage-compat also runs the bounded M3 differential partition.
  test-rust:
    if: always()
    needs: [test-rust-workspace, test-storage-compat]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Require all Rust partitions
        env:
          WORKSPACE_RESULT: ${{ needs.test-rust-workspace.result }}
          STORAGE_COMPAT_RESULT: ${{ needs.test-storage-compat.result }}
        run: |
          test "${WORKSPACE_RESULT}" = success
          test "${STORAGE_COMPAT_RESULT}" = success

  test-ts:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 20
    # JAZZ_NAPI_RELEASE=0 (debug builds) removed 2026-07-19: debug-profile
    # jazz-napi .node files fail dlopen on the Linux runners deterministically
    # (root cause TBD; see dev/CI_NOTES.md). Release builds load fine.

    container:
      image: ghcr.io/garden-co/jazz-ci-toolchain@sha256:dcb4ec5e4f5507b258805617d58ee6976f7dcee2e9afe1b05ae3d41cc185ef35
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Authenticate trusted sccache writer
        if: inputs.trusted-cache && inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Authenticate trusted sccache reader
        if: inputs.trusted-cache && !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_PR_READER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Export trusted sccache configuration
        if: inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '')
        env:
          CACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          CACHE_REGION: ${{ vars.SCCACHE_REGION }}
        run: |
          echo "SCCACHE_BUCKET=${CACHE_BUCKET}" >> "${GITHUB_ENV}"
          echo "SCCACHE_REGION=${CACHE_REGION}" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_USE_SSL=true" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_KEY_PREFIX=jazz-ci/v1/production/blacksmith-v1" >> "${GITHUB_ENV}"
      - name: Export trusted Turbo cache signing key
        if: inputs.trusted-cache
        env:
          CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
        run: echo "TURBO_REMOTE_CACHE_SIGNATURE_KEY=${CACHE_SIGNATURE_KEY}" >> "${GITHUB_ENV}"
      - name: Set up signed Turbo Remote Cache
        if: inputs.trusted-cache
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: garden-co
          policy: pol_0b019736-e95d-4f60-a5dd-e9415148834c
          audience: https://github.com/garden-co
      - uses: ./.github/actions/setup-blacksmith
        with:
          sccache-s3: ${{ inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '') }}

      # Builds provenance-checked test artifacts, then runs the parallel Node /
      # browser suites. The local CI-equivalent gate calls this exact partition.
      # The integration-branch workspace target-class check that used to run
      # first here now runs in the lint partition, off this job's critical path.
      - name: Run CI-equivalent TypeScript partition
        run: node dev/gates/local-ci-equivalent.mjs --ci-partition typescript
      - name: Upload BandChat failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: band-chat-browser-failure-screenshots
          # This fixture renders synthetic users and rooms; do not broaden to
          # browser traces, storage profiles, or arbitrary application captures.
          path: examples/band-chat/apps/nextjs-betterauth/tests/browser/__screenshots__/band-chat.test.tsx/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Report sccache statistics
        if: always()
        run: sccache --show-stats

  # The ordinary TypeScript consumer suite intentionally excludes
  # tests/react-native. Keep this bridge-enabled producer and the RN tests in
  # their own named partition so a green web framework suite cannot stand in
  # for native bridge coverage.
  test-react-native:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 20
    container:
      image: ghcr.io/garden-co/jazz-ci-toolchain@sha256:dcb4ec5e4f5507b258805617d58ee6976f7dcee2e9afe1b05ae3d41cc185ef35
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Authenticate trusted sccache writer
        if: inputs.trusted-cache && inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Authenticate trusted sccache reader
        if: inputs.trusted-cache && !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_PR_READER_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Export trusted sccache configuration
        if: inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '')
        env:
          CACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          CACHE_REGION: ${{ vars.SCCACHE_REGION }}
        run: |
          echo "SCCACHE_BUCKET=${CACHE_BUCKET}" >> "${GITHUB_ENV}"
          echo "SCCACHE_REGION=${CACHE_REGION}" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_USE_SSL=true" >> "${GITHUB_ENV}"
          echo "SCCACHE_S3_KEY_PREFIX=jazz-ci/v1/production/blacksmith-v1" >> "${GITHUB_ENV}"
      - name: Export trusted Turbo cache signing key
        if: inputs.trusted-cache
        env:
          CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
        run: echo "TURBO_REMOTE_CACHE_SIGNATURE_KEY=${CACHE_SIGNATURE_KEY}" >> "${GITHUB_ENV}"
      - name: Set up signed Turbo Remote Cache
        if: inputs.trusted-cache
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: garden-co
          policy: pol_0b019736-e95d-4f60-a5dd-e9415148834c
          audience: https://github.com/garden-co
      - uses: ./.github/actions/setup-blacksmith
        with:
          sccache-s3: ${{ inputs.trusted-cache && (inputs.sccache-write && vars.SCCACHE_TRUSTED_WRITER_AWS_ROLE_ARN != '' || !inputs.sccache-write && vars.SCCACHE_PR_READER_AWS_ROLE_ARN != '') }}
      - name: Run CI-equivalent React Native bridge partition
        run: node dev/gates/local-ci-equivalent.mjs --ci-partition react-native
      - name: Report sccache statistics
        if: always()
        run: sccache --show-stats
