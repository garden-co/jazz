name: React Native device acceptance

on:
  workflow_dispatch:
    inputs:
      artifacts_run_id:
        description: Run of this commit whose relay, NAPI and WASM artifacts to test instead of building them here.
        required: false
        type: string
        default: ""
  # The release candidate gate (release-candidate.yml) runs the device
  # receipts as one of its parallel gates.
  workflow_call:
    inputs:
      artifacts_run_id:
        description: Run of this commit whose relay, NAPI and WASM artifacts to test instead of building them here.
        required: false
        type: string
        default: ""
      manifest_checked_by_caller:
        description: The caller already requires the artifacts run's release-manifest to name this commit (release-candidate.yml's artifacts-complete), so the device jobs skip that wait.
        required: false
        type: boolean
        default: false
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    paths:
      - "dev/rn-device-acceptance/**"
      - "dev/gates/test/jazz-rn-kotlin-contract.test.mjs"
      - "crates/jazz-rn/**"
      - "crates/jazz-native-relay/**"
      - "crates/jazz/**"
      - "crates/jazz-compression/**"
      - "crates/jazz-native-transport/**"
      - "crates/jazz-napi/**"
      - "crates/jazz-wasm/**"
      - "dev/artifacts/**"
      - "packages/jazz-tools/src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/rn-device-acceptance.yml"

permissions:
  contents: read
  actions: read # download artifacts_run_id's artifacts

concurrency:
  # Called, github.workflow is the caller's: one group per calling run, so a
  # gate never cancels (or is cancelled by) a direct dispatch on the same ref.
  group: rn-device-acceptance-${{ github.event.pull_request.number || github.ref }}${{ github.workflow != 'React Native device acceptance' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  android-source-scaffold:
    name: Android source scaffold verification (not device acceptance)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.14.0 }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter rn-device-acceptance verify
      # TODO(#1974): the `rn-preview-release` label gates device work
      # will stage relay libraries, use Gradle/Cargo caches, assemble/install,
      # launch, and run the receipt driver. Do not call that job acceptance
      # until all of those steps exist.

  ios-source-scaffold:
    name: iOS source scaffold verification (not device acceptance)
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.14.0 }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter rn-device-acceptance verify
      # The label-gated iOS simulator job below is the device acceptance gate;
      # this quick source job remains deliberately non-acceptance coverage.

  ios-simulator:
    name: iOS simulator device acceptance
    if: >-
      ${{
        github.event_name == 'workflow_dispatch'
        || inputs.artifacts_run_id != ''
        || (
          contains(github.event.pull_request.labels.*.name, 'rn-preview-release')
          && github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 45
    env:
      COCOAPODS_DISABLE_STATS: "true"
      ARTIFACTS_RUN_ID: ${{ inputs.artifacts_run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Select task-local build paths
        # Compiled modules retain toolchain header mtimes across runner images.
        # Give every attempt fresh DerivedData instead of restoring those modules.
        # Assign separately so a mktemp failure fails the step under `set -e`.
        run: |
          set -euo pipefail
          derived_data="$(mktemp -d "${RUNNER_TEMP}/jazz-rn-device-derived-data.XXXXXX")"
          echo "JAZZ_DEVICE_DERIVED_DATA=${derived_data}" >> "${GITHUB_ENV}"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.14.0 }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.93.1
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
          prefix-key: rn-device-ios-macos-15
          key: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/jazz-native-relay/**', 'crates/jazz-rn/**', 'crates/jazz/**', 'crates/jazz-compression/**', 'crates/jazz-native-transport/**', 'crates/jazz-napi/**', 'crates/jazz-wasm/**', 'dev/artifacts/**') }}
      # pod install's downloads: React Native's prebuilt tarballs (which
      # pod-install-retrying.sh copies in and out) and CocoaPods' own caches.
      # Its version is pinned by the lockfile; an older entry is harmless,
      # since the tarballs are named by version.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
            ${{ runner.temp }}/rn-pod-artifacts
          key: rn-ios-pods-macos-15-v3-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: rn-ios-pods-macos-15-v3-
      - run: pnpm install --frozen-lockfile
      - name: Verify synthetic scope authorization and generated native fixture
        run: cargo test -p jazz-native-relay --example rn_server_session_harness --no-fail-fast
      # Apple's clang and ar cannot build or archive the WASM build's SQLite
      # objects. The build finds Homebrew's llvm-ar on its own; point cc-rs at
      # Homebrew's clang for the wasm32 target.
      - name: Install LLVM for the WASM build's SQLite
        if: inputs.artifacts_run_id == ''
        run: |
          set -euo pipefail
          if ! brew list llvm >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              brew install llvm && break
              [[ "${attempt}" == 3 ]] && exit 1
              echo "::warning::brew install llvm attempt ${attempt} failed"
              sleep $((attempt * 10))
            done
          fi
          echo "CC_wasm32_unknown_unknown=$(brew --prefix llvm)/bin/clang" >> "${GITHUB_ENV}"
      - name: Download the prebuilt artifacts
        if: inputs.artifacts_run_id != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          run-id: ${{ inputs.artifacts_run_id }}
          github-token: ${{ github.token }}
          pattern: "{jazz-rn-relay-ios,jazz-napi-loader,jazz-napi-binding-linux-x64-gnu,jazz-napi-binding-darwin-arm64,jazz-wasm-pkg}"
          path: ${{ runner.temp }}/prebuilt
      # The relay manifest seals the source revision the receipts check, so the
      # producer run must have built exactly this commit.
      - name: Stage the prebuilt artifacts of this commit
        if: inputs.artifacts_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A network read: retried when the API answers empty or fails (RC 45316950784 got "unexpected end of
          # JSON input" once). The comparison below isn't.
          producer_sha=
          for attempt in 1 2 3 4; do
            producer_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACTS_RUN_ID}" --jq .head_sha 2>/dev/null || true)"
            [[ "$producer_sha" =~ ^[0-9a-f]{40}$ ]] && break
            [[ $attempt -lt 4 ]] && { echo "::warning::reading run ${ARTIFACTS_RUN_ID}'s head_sha failed (attempt ${attempt}); retrying"; sleep $((attempt * 5)); }
          done
          [[ "$producer_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::couldn't read run ${ARTIFACTS_RUN_ID}'s head_sha from the GitHub API (4 attempts)"; exit 1; }
          [[ "$producer_sha" == "$GITHUB_SHA" ]] || { echo "::error::run ${ARTIFACTS_RUN_ID} built ${producer_sha}, not ${GITHUB_SHA}"; exit 1; }
          prebuilt="${RUNNER_TEMP}/prebuilt"
          cp -R "$prebuilt/jazz-rn-relay-ios/." crates/jazz-rn/
          cp -R "$prebuilt/jazz-napi-loader/." "$prebuilt/jazz-napi-binding-darwin-arm64/." crates/jazz-napi/
          mkdir -p crates/jazz-napi/provenance crates/jazz-wasm/pkg
          cp "$prebuilt/jazz-napi-binding-linux-x64-gnu/jazz-napi.linux-x64-gnu.manifest.json" crates/jazz-napi/provenance/
          cp -R "$prebuilt/jazz-wasm-pkg/." crates/jazz-wasm/pkg/
      # The backend loads jazz-tools on Node, whose runtime checks the native
      # fingerprints staged from release NAPI and fast (or prebuilt release) WASM builds.
      - uses: ./.github/actions/install-rust-tool
        if: inputs.artifacts_run_id == ''
        with:
          tool: wasm-pack@0.13.1
      - name: Build the Node runtime of the device app's backend
        run: |
          if [[ -n "${ARTIFACTS_RUN_ID}" ]]; then
            node dev/artifacts/stage-native-fingerprints.mjs
            pnpm --filter jazz-tools build:react-native
          else
            pnpm --filter rn-device-acceptance build:device-backend
          fi
      # build:device-backend already builds jazz-tools' React Native entry after
      # staging the fingerprints, so only jazz-rn is left to build here.
      - name: Build the React Native JavaScript workspace entrypoints
        run: pnpm --filter jazz-rn build
      - name: Build and stage the relay XCFramework
        run: |
          if [[ -n "${ARTIFACTS_RUN_ID}" ]]; then
            JAZZ_NATIVE_RELAY_SOURCE_REVISION="$(git rev-parse HEAD)" node dev/artifacts/rn-packages.mjs stage ios
          else
            pnpm --filter jazz-rn build:relay:ios
          fi
          JAZZ_NATIVE_RELAY_SOURCE_REVISION="$(git rev-parse HEAD)" node crates/jazz-rn/scripts/verify-relay-artifacts.mjs ios
      - name: Generate the Expo development host
        run: pnpm --filter rn-device-acceptance exec expo prebuild --platform ios --clean --no-install --non-interactive
      - name: Register the trusted test fixture
        working-directory: dev/rn-device-acceptance/ios
        run: |
          ruby <<'RUBY'
          require "xcodeproj"
          project = Xcodeproj::Project.open("JazzRNdeviceacceptance.xcodeproj")
          target = project.targets.find { |item| item.name == "JazzRNdeviceacceptance" } or abort("acceptance target missing")
          file = project.files.find { |item| item.path == "JazzDeviceFixture.mm" } || project.main_group.new_file("JazzDeviceFixture.mm")
          target.add_file_references([file]) unless target.source_build_phase.files_references.include?(file)
          project.save
          RUBY
      - name: Install CocoaPods for the staged native package
        run: ../../../dev/scripts/pod-install-retrying.sh "${RUNNER_TEMP}/rn-pod-artifacts"
        working-directory: dev/rn-device-acceptance/ios
      - name: Select and boot an available iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          udid="$(node -e '
            const { execFileSync } = require("node:child_process");
            const devices = JSON.parse(execFileSync("xcrun", ["simctl", "list", "devices", "available", "-j"], { encoding: "utf8" })).devices;
            const device = Object.values(devices).flat().find((item) => item.isAvailable && item.name.startsWith("iPhone"));
            if (!device) process.exit(1);
            process.stdout.write(device.udid);
          ')"
          echo "IOS_SIMULATOR_UDID=${udid}" >> "${GITHUB_ENV}"
          xcrun simctl boot "${udid}" 2>/dev/null || true
          xcrun simctl bootstatus "${udid}" -b
      - name: Build the staged app with its JavaScript embedded
        run: |
          xcodebuild -workspace JazzRNdeviceacceptance.xcworkspace -scheme JazzRNdeviceacceptance -configuration Release -sdk iphonesimulator -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_UDID}" -derivedDataPath "${JAZZ_DEVICE_DERIVED_DATA}" build
        working-directory: dev/rn-device-acceptance/ios
      - name: Install, launch, and require run-bound device receipts
        env:
          JAZZ_DEVICE_APP: ${{ env.JAZZ_DEVICE_DERIVED_DATA }}/Build/Products/Release-iphonesimulator/JazzRNdeviceacceptance.app
        run: pnpm --filter rn-device-acceptance device:ios
      # release-artifacts uploads its manifest last, about when this job starts,
      # so require it at the end rather than wait for it up front.
      - name: Require the artifacts run's release manifest to name this commit
        if: inputs.artifacts_run_id != '' && !inputs.manifest_checked_by_caller
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/release-manifest"
          until gh run download "${ARTIFACTS_RUN_ID}" -R "${GITHUB_REPOSITORY}" -n release-manifest -D "${manifest}" 2>/dev/null; do
            if [[ "$(gh run view "${ARTIFACTS_RUN_ID}" -R "${GITHUB_REPOSITORY}" --json status --jq .status)" == completed ]]; then
              gh run download "${ARTIFACTS_RUN_ID}" -R "${GITHUB_REPOSITORY}" -n release-manifest -D "${manifest}" && break
              echo "::error::run ${ARTIFACTS_RUN_ID} finished without a release-manifest"
              exit 1
            fi
            sleep 15
          done
          sha="$(node -p 'require(process.argv[1]).sha' "${manifest}/manifest.json")"
          [[ "$sha" == "$GITHUB_SHA" ]] || { echo "::error::run ${ARTIFACTS_RUN_ID}'s release manifest is for ${sha}, not ${GITHUB_SHA}"; exit 1; }

  android-device-acceptance:
    # Keep the expensive installed-device receipt opt-in, but make its label
    # contract identical to iOS. Forks never receive native artifacts/caches.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch'
        || inputs.artifacts_run_id != ''
        || (
          contains(github.event.pull_request.labels.*.name, 'rn-preview-release')
          && github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    name: Android device acceptance
    # Keep Android and iOS installed-app receipts on the dedicated Blacksmith
    # fleet. They are deliberately label/manual only, never an ordinary PR
    # gate; the runner is selected for x86_64 Android emulation support, and
    # 16 vCPUs halve the Gradle assemble (CMake for three ABIs).
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      ARTIFACTS_RUN_ID: ${{ inputs.artifacts_run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.14.0 }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
          prefix-key: rn-device-android-ubuntu-2404
          key: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/jazz-native-relay/**', 'crates/jazz-rn/**', 'crates/jazz/**', 'crates/jazz-compression/**', 'crates/jazz-native-transport/**', 'crates/jazz-napi/**', 'crates/jazz-wasm/**', 'dev/artifacts/**') }}
      # Sticky disks, not actions/cache: those are per branch, and this job
      # never runs on main, so every RC on a fresh branch started cold and
      # then spent ~50 s saving. A sticky disk is shared by every branch and
      # commits a snapshot instead of uploading a tarball.
      # Every run mounts them, but only a run of reviewed code on main or
      # release commits them (this job never runs on push, so dispatches,
      # including the RC's, count): a PR can never write state, such as a
      # Gradle init script, that a later gate mounts.
      # The pinned toolchain; bootstrap-android.sh re-verifies what it reuses.
      # The AVD lives in RUNNER_TEMP, not here.
      - uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: rn-device-android-toolchain-${{ github.repository_id }}-v2
          commit: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release') && 'true' || 'false' }}
          path: ${{ github.workspace }}/.cache/android-device-acceptance
      # Gradle's distribution, dependencies and local build cache.
      - name: Point Gradle at its sticky disk
        run: echo "GRADLE_USER_HOME=${RUNNER_TEMP}/gradle-home" >> "${GITHUB_ENV}"
      - uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: rn-device-android-gradle-${{ github.repository_id }}-v2
          commit: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release') && 'true' || 'false' }}
          path: ${{ runner.temp }}/gradle-home
      - run: pnpm install --frozen-lockfile
      - name: Verify synthetic scope authorization and generated native fixture
        run: cargo test -p jazz-native-relay --example rn_server_session_harness --no-fail-fast
      - name: Download the prebuilt artifacts
        if: inputs.artifacts_run_id != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          run-id: ${{ inputs.artifacts_run_id }}
          github-token: ${{ github.token }}
          pattern: "{jazz-rn-relay-android,jazz-napi-loader,jazz-napi-binding-linux-x64-gnu,jazz-wasm-pkg}"
          path: ${{ runner.temp }}/prebuilt
      # The relay manifest seals the source revision the receipts check, so the
      # producer run must have built exactly this commit.
      - name: Stage the prebuilt artifacts of this commit
        if: inputs.artifacts_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A network read: retried when the API answers empty or fails (RC 45316950784 got "unexpected end of
          # JSON input" once). The comparison below isn't.
          producer_sha=
          for attempt in 1 2 3 4; do
            producer_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACTS_RUN_ID}" --jq .head_sha 2>/dev/null || true)"
            [[ "$producer_sha" =~ ^[0-9a-f]{40}$ ]] && break
            [[ $attempt -lt 4 ]] && { echo "::warning::reading run ${ARTIFACTS_RUN_ID}'s head_sha failed (attempt ${attempt}); retrying"; sleep $((attempt * 5)); }
          done
          [[ "$producer_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::couldn't read run ${ARTIFACTS_RUN_ID}'s head_sha from the GitHub API (4 attempts)"; exit 1; }
          [[ "$producer_sha" == "$GITHUB_SHA" ]] || { echo "::error::run ${ARTIFACTS_RUN_ID} built ${producer_sha}, not ${GITHUB_SHA}"; exit 1; }
          prebuilt="${RUNNER_TEMP}/prebuilt"
          cp -R "$prebuilt/jazz-rn-relay-android/." crates/jazz-rn/
          cp -R "$prebuilt/jazz-napi-loader/." "$prebuilt/jazz-napi-binding-linux-x64-gnu/." crates/jazz-napi/
          mkdir -p crates/jazz-napi/provenance crates/jazz-wasm/pkg
          cp "$prebuilt/jazz-napi-binding-linux-x64-gnu/jazz-napi.linux-x64-gnu.manifest.json" crates/jazz-napi/provenance/
          cp -R "$prebuilt/jazz-wasm-pkg/." crates/jazz-wasm/pkg/
      # The backend loads jazz-tools on Node, whose runtime checks the native
      # fingerprints staged from release NAPI and fast (or prebuilt release) WASM builds.
      - uses: ./.github/actions/install-rust-tool
        if: inputs.artifacts_run_id == ''
        with:
          tool: wasm-pack@0.13.1
      - name: Build the Node runtime of the device app's backend
        run: |
          if [[ -n "${ARTIFACTS_RUN_ID}" ]]; then
            node dev/artifacts/stage-native-fingerprints.mjs
            pnpm --filter jazz-tools build:react-native
          else
            pnpm --filter rn-device-acceptance build:device-backend
          fi
      # build:device-backend already builds jazz-tools' React Native entry after
      # staging the fingerprints, so only jazz-rn is left to build here.
      - name: Build the React Native JavaScript workspace entrypoints
        run: pnpm --filter jazz-rn build
      - name: Bootstrap pinned lane-local Android toolchain
        run: dev/rn-device-acceptance/scripts/bootstrap-android.sh --emulator
      - name: Stage and verify all relay ABI artifacts
        shell: bash
        run: |
          cache="$GITHUB_WORKSPACE/.cache/android-device-acceptance"
          export JAVA_HOME="$cache/jdk" ANDROID_SDK_ROOT="$cache/sdk"
          export PATH="$cache/cargo/bin:$PATH"
          export JAZZ_NATIVE_RELAY_SOURCE_REVISION="$GITHUB_SHA"
          export JAZZ_NATIVE_RELAY_CARGO_NDK_VERSION=4.1.2
          if [[ -n "${ARTIFACTS_RUN_ID}" ]]; then
            node dev/artifacts/rn-packages.mjs stage android
          else
            rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
            pnpm --filter jazz-rn build:relay:android
          fi
          node crates/jazz-rn/scripts/verify-relay-artifacts.mjs android
      - name: Grant the runner user access to KVM
        shell: bash
        run: |
          [[ -c /dev/kvm ]] || { echo "Android acceptance requires a KVM-capable runner" >&2; exit 1; }
          sudo setfacl -m "u:${USER}:rw" /dev/kvm
          [[ -r /dev/kvm && -w /dev/kvm ]] || { echo "Android acceptance could not grant the runner user KVM access" >&2; exit 1; }
      - name: Assemble, launch, and require the run-bound receipt
        shell: bash
        run: |
          cache="$GITHUB_WORKSPACE/.cache/android-device-acceptance"
          export JAVA_HOME="$cache/jdk" ANDROID_SDK_ROOT="$cache/sdk" ANDROID_HOME="$cache/sdk"
          export PATH="$cache/cargo/bin:$cache/sdk/cmdline-tools/latest/bin:$cache/sdk/platform-tools:$cache/sdk/emulator:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/jazz-android-avd"
          # The acceptance receipt's production cleanup contract is a real
          # Linux session, never the portable test double used by macOS tests.
          export JAZZ_ANDROID_SESSION_LAUNCHER=setsid
          export JAZZ_ANDROID_SESSION_PROCESS_GROUP=1
          relay_abis=armeabi-v7a,arm64-v8a,x86_64
          [[ -r /dev/kvm && -w /dev/kvm ]] || { echo "Android acceptance requires readable/writable /dev/kvm after the KVM access step" >&2; exit 1; }
          dev/rn-device-acceptance/scripts/create-android-avd.sh \
            jazz-device-acceptance-api35 \
            'system-images;android-35;google_apis;x86_64'
          # Boot while Gradle builds; the receipt waits for both.
          dev/rn-device-acceptance/scripts/boot-android-emulator.sh \
            jazz-device-acceptance-api35 \
            "$RUNNER_TEMP/jazz-android-emulator.log" \
            "$ANDROID_AVD_HOME/jazz-device-acceptance-api35.avd/config.ini" &
          boot_pid=$!
          (
            cd dev/rn-device-acceptance/android
            grep -Fx "reactNativeArchitectures=${relay_abis}" gradle.properties
            ./gradlew -q -PreactNativeArchitectures="${relay_abis}" :app:properties | grep -Fx "reactNativeArchitectures: ${relay_abis}"
            NODE_ENV=production ./gradlew -PreactNativeArchitectures="${relay_abis}" :app:assembleRelease --console=plain --build-cache
          )
          wait "$boot_pid"
          # The Android build has already provisioned Gradle's Kotlin compiler;
          # make the packed JVM admission receipt mandatory on this JDK lane.
          export PATH="$JAVA_HOME/bin:$PATH"
          JAZZ_REQUIRE_RN_JVM_CONTRACT=1 \
            node --test --test-name-pattern='a freshly installed Expo app prebuilds the packed jazz-rn relay host' dev/gates/test/jazz-rn-packaging.test.mjs
          node --test dev/gates/test/jazz-rn-kotlin-contract.test.mjs
          export JAZZ_DEVICE_APK="$GITHUB_WORKSPACE/dev/rn-device-acceptance/android/app/build/outputs/apk/release/app-release.apk"
          export JAZZ_DEVICE_RELAY_SOURCE_REVISION="$GITHUB_SHA"
          pnpm --filter rn-device-acceptance device:android
      # release-artifacts uploads its manifest last, about when this job starts,
      # so require it at the end rather than wait for it up front.
      - name: Require the artifacts run's release manifest to name this commit
        if: inputs.artifacts_run_id != '' && !inputs.manifest_checked_by_caller
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/release-manifest"
          until gh run download "${ARTIFACTS_RUN_ID}" -R "${GITHUB_REPOSITORY}" -n release-manifest -D "${manifest}" 2>/dev/null; do
            if [[ "$(gh run view "${ARTIFACTS_RUN_ID}" -R "${GITHUB_REPOSITORY}" --json status --jq .status)" == completed ]]; then
              gh run download "${ARTIFACTS_RUN_ID}" -R "${GITHUB_REPOSITORY}" -n release-manifest -D "${manifest}" && break
              echo "::error::run ${ARTIFACTS_RUN_ID} finished without a release-manifest"
              exit 1
            fi
            sleep 15
          done
          sha="$(node -p 'require(process.argv[1]).sha' "${manifest}/manifest.json")"
          [[ "$sha" == "$GITHUB_SHA" ]] || { echo "::error::run ${ARTIFACTS_RUN_ID}'s release manifest is for ${sha}, not ${GITHUB_SHA}"; exit 1; }
      - name: Retain matching Android crash-symbol artifacts
        if: failure()
        env:
          JAZZ_ANDROID_FAILURE_ARTIFACT: ${{ runner.temp }}/jazz-rn-android-failure-artifact
        run: node dev/rn-device-acceptance/scripts/stage-android-failure-artifact.mjs
      - name: Upload synthetic Android failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rn-device-android-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jazz-rn-android-failure-artifact
          if-no-files-found: ignore
      # The sticky disks unmount after this: nothing may still run from them.
      - name: Stop Gradle, the emulator and adb
        if: always()
        run: |
          pkill -f GradleDaemon || true
          pkill -f KotlinCompileDaemon || true
          pkill -x adb || true
          sleep 2
          for disk in "${GITHUB_WORKSPACE}/.cache/android-device-acceptance" "${GRADLE_USER_HOME}"; do
            # -m targets the whole filesystem: only ever a mounted sticky disk.
            if mountpoint -q "${disk}"; then fuser -km "${disk}" 2>/dev/null || true; fi
          done
