name: W1 resume credit diagnostic

# Temporary release-blocker diagnosis, isolated from the full benchmark suite.
on:
  push:
    branches: [fix/alpha56-w1-channel-credit]
  workflow_dispatch:
    inputs:
      run_full_benchmark:
        description: Also rebuild and run the instrumented W1 benchmark
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: w1-resume-credit-diagnostic-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  class-selection-probe:
    runs-on: codspeed-macro
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.93.1
      - name: Compile original class selection with walltime optimization flags
        run: |
          rustc --version --verbose
          uname -m
          mkdir -p "$RUNNER_TEMP/w1-credit-probe"
          rustc --edition 2024 -C opt-level=3 -C debuginfo=2 -C strip=none -C codegen-units=16 --emit asm,link --out-dir "$RUNNER_TEMP/w1-credit-probe" dev/gates/probes/w1_credit_class_probe.rs
      - name: Check every physical and decoded class selection
        run: '"$RUNNER_TEMP/w1-credit-probe/w1_credit_class_probe"'
      - name: Compile and run isolated serde postcard roundtrip
        run: |
          RUSTFLAGS="-C debuginfo=2 -C strip=none" cargo rustc --locked --manifest-path dev/gates/probes/w1-credit-codec/Cargo.toml --release --target-dir "$RUNNER_TEMP/w1-credit-codec" -- --emit asm,link
          "$RUNNER_TEMP/w1-credit-codec/release/w1-credit-codec-probe"
          cp "$RUNNER_TEMP/w1-credit-codec/release/w1-credit-codec-probe" "$RUNNER_TEMP/w1-credit-probe/"
          cp "$RUNNER_TEMP"/w1-credit-codec/release/deps/w1_credit_codec_probe-*.s "$RUNNER_TEMP/w1-credit-probe/"
      - name: Preserve optimized probe assembly and binary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w1-credit-class-probe-${{ runner.arch }}
          path: ${{ runner.temp }}/w1-credit-probe

  # Original ChannelCredits impl preserved in 2bd0c671; test the current candidate.
  # The diagnostic self-check stays outside the original implementation.
  production-credit-probe:
    runs-on: codspeed-macro
    timeout-minutes: 15
    env:
      JAZZ_WIRE_CREDIT_TRACE: "1"
      RUST_MIN_STACK: "4194304"
      RUSTFLAGS: "-C debuginfo=2 -C strip=none"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.93.1
      - name: Run actual optimized credit path without W1 or RocksDB
        run: |
          ulimit -n 16384
          cargo run --locked --manifest-path dev/gates/probes/w1-credit-core/Cargo.toml --release --target-dir "$RUNNER_TEMP/w1-credit-core"
      - name: Preserve production probe binary and disassembly
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/w1-credit-core-artifacts"
          probe="$RUNNER_TEMP/w1-credit-core/release/w1-credit-core-probe"
          if test -f "$probe"; then
            cp "$probe" "$RUNNER_TEMP/w1-credit-core-artifacts/"
            objdump -Cd "$probe" > "$RUNNER_TEMP/w1-credit-core-artifacts/disassembly.txt"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: w1-credit-core-probe-${{ runner.arch }}
          path: ${{ runner.temp }}/w1-credit-core-artifacts

  resume-credit:
    if: github.event_name == 'workflow_dispatch' && inputs.run_full_benchmark
    runs-on: codspeed-macro
    timeout-minutes: 35
    env:
      JAZZ_W1_TRACE: "1"
      JAZZ_WIRE_CREDIT_TRACE: "1"
      RUST_BACKTRACE: "1"
      RUST_MIN_STACK: "4194304"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.93.1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: true
          # Runtime failures must not discard a successful cold dependency build.
          cache-on-failure: true
          shared-key: codspeed-w1-read-walltime-${{ runner.arch }}-v1
          workspaces: . -> target

      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 5.0.1 --locked

      - name: Build only W1 memory benchmark
        run: cargo codspeed build --measurement-mode walltime --package jazz-example-benchmark-w1 --bench reads_memory_walltime

      # This is a correctness diagnostic, not a published performance receipt.
      # Use the same walltime build and driver without an upload action or token.
      - name: Repeat only the two W1 resume sizes
        id: codspeed
        continue-on-error: true
        run: |
          ulimit -n 16384
          cargo codspeed run --measurement-mode walltime --package jazz-example-benchmark-w1 --bench reads_memory_walltime resume_one_task_update_scaling_memory -- --sample-count 10

      - name: Run the same compiled artifact directly
        id: direct
        if: always() && steps.codspeed.outcome != 'skipped'
        continue-on-error: true
        working-directory: examples/benchmarks/w1
        env:
          CODSPEED_CARGO_WORKSPACE_ROOT: ${{ github.workspace }}
        run: |
          ulimit -n 16384
          "$GITHUB_WORKSPACE/target/codspeed/walltime/jazz-example-benchmark-w1/reads_memory_walltime" --bench resume_one_task_update_scaling_memory --sample-count 10

      - name: Preserve exact benchmark binary and disassembly
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/w1-benchmark-artifacts"
          benchmark=target/codspeed/walltime/jazz-example-benchmark-w1/reads_memory_walltime
          if test -f "$benchmark"; then
            cp "$benchmark" "$RUNNER_TEMP/w1-benchmark-artifacts/"
            objdump -Cd "$benchmark" > "$RUNNER_TEMP/w1-benchmark-artifacts/disassembly.txt"
          fi

      - name: Upload synthetic benchmark diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w1-credit-benchmark-${{ runner.arch }}
          path: ${{ runner.temp }}/w1-benchmark-artifacts

      - name: Require both execution paths to pass
        if: always()
        env:
          CODSPEED_OUTCOME: ${{ steps.codspeed.outcome }}
          DIRECT_OUTCOME: ${{ steps.direct.outcome }}
        run: |
          echo "CodSpeed execution outcome: $CODSPEED_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "Direct execution outcome: $DIRECT_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          test "$CODSPEED_OUTCOME" = success && test "$DIRECT_OUTCOME" = success
