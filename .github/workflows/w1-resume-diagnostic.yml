name: W1 resume credit diagnostic

# Temporary release-blocker diagnosis, isolated from the full benchmark suite.
on:
  push:
    branches: [fix/alpha56-w1-channel-credit]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w1-resume-credit-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resume-credit:
    runs-on: codspeed-macro
    timeout-minutes: 35
    env:
      JAZZ_W1_TRACE: "1"
      JAZZ_WIRE_CREDIT_TRACE: "1"
      RUST_BACKTRACE: "1"
      RUST_MIN_STACK: "4194304"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.93.1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: true
          shared-key: codspeed-w1-read-walltime-${{ runner.arch }}-v1
          workspaces: . -> target

      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 5.0.1 --locked

      - name: Build only W1 memory benchmark
        run: cargo codspeed build --measurement-mode walltime --package jazz-example-benchmark-w1 --bench reads_memory_walltime

      # This is a correctness diagnostic, not a published performance receipt.
      # Use the same walltime build and driver without an upload action or token.
      - name: Repeat only the two W1 resume sizes
        run: |
          ulimit -n 16384
          cargo codspeed run --measurement-mode walltime --package jazz-example-benchmark-w1 --bench reads_memory_walltime resume_one_task_update_scaling_memory -- --sample-count 10
