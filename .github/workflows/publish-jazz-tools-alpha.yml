name: Verify jazz-tools release packages (dry run)

on:
  # Retired as a publisher (2026-11-21): release-publish.yml publishes every
  # registry. What stays is the dry run, the release candidate gate's preview
  # leg (preview-jazz-tools-alpha-release.yml calls it): build or reuse the
  # packages and verify exactly what would be published.
  workflow_call:
    inputs:
      mode:
        description: "dry-run only (build + verify): publishing moved to release-publish.yml."
        required: false
        type: string
        default: dry-run
      artifacts_run_id:
        description: "Verify the packages of this release-artifacts.yml run (or the calling run) instead of building them."
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run only: publishing moved to release-publish.yml."
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run

env:
  JAZZ_RN_CARGO_NDK_VERSION: 4.1.2
  CACHE_SCOPE_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id || github.repository_id }}

jobs:
  release-push-gate:
    name: Gate (dry run only)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      reason: ${{ steps.gate.outputs.reason }}
      release_pr_number: ${{ steps.gate.outputs.release_pr_number }}
      release_pr_head_ref: ${{ steps.gate.outputs.release_pr_head_ref }}
      release_pr_head_sha: ${{ steps.gate.outputs.release_pr_head_sha }}
    steps:
      # Publishing moved to release-publish.yml: only a dry run proceeds.
      - id: gate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_MODE: ${{ inputs.mode || github.event.inputs.mode || 'dry-run' }}
        with:
          script: |
            let shouldRun = "false";
            let reason = "";
            if (process.env.RELEASE_MODE === "dry-run") {
              shouldRun = "true";
              reason = "dry-run invocation";
            } else {
              reason = "publishing moved to release-publish.yml";
              core.setFailed(`This workflow only dry-runs now (mode=${process.env.RELEASE_MODE}): publish with release-publish.yml`);
            }
            core.setOutput("should_run", shouldRun);
            core.setOutput("reason", reason);
            core.setOutput("release_pr_number", "");
            core.setOutput("release_pr_head_ref", "");
            core.setOutput("release_pr_head_sha", "");

      - name: Show gate decision
        run: |
          echo "should_run=${{ steps.gate.outputs.should_run }}"
          echo "reason=${{ steps.gate.outputs.reason }}"
          echo "release_pr_number=${{ steps.gate.outputs.release_pr_number }}"
          echo "release_pr_head_ref=${{ steps.gate.outputs.release_pr_head_ref }}"
          echo "release_pr_head_sha=${{ steps.gate.outputs.release_pr_head_sha }}"

  resolve-preview-artifacts:
    name: Resolve preview artifact source
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [release-push-gate]
    if: needs.release-push-gate.outputs.should_run == 'true'
    permissions:
      actions: read
      contents: read
    outputs:
      use_preview_artifacts: ${{ steps.resolve.outputs.use_preview_artifacts }}
      preview_run_id: ${{ steps.resolve.outputs.preview_run_id }}
      reason: ${{ steps.resolve.outputs.reason }}
    steps:
      - id: resolve
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RELEASE_MODE: ${{ inputs.mode || github.event.inputs.mode || 'dry-run' }}
          RELEASE_PR_NUMBER: ${{ needs.release-push-gate.outputs.release_pr_number }}
          RELEASE_PR_HEAD_REF: ${{ needs.release-push-gate.outputs.release_pr_head_ref }}
          RELEASE_PR_HEAD_SHA: ${{ needs.release-push-gate.outputs.release_pr_head_sha }}
          ARTIFACTS_RUN_ID: ${{ inputs.artifacts_run_id }}
        with:
          script: |
            const eventName = process.env.EVENT_NAME;
            const ref = process.env.REF;
            const sha = process.env.SHA;
            const releaseMode = process.env.RELEASE_MODE;
            const releasePrNumber = process.env.RELEASE_PR_NUMBER;
            const releasePrHeadRef = process.env.RELEASE_PR_HEAD_REF;
            const releasePrHeadSha = process.env.RELEASE_PR_HEAD_SHA;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let usePreviewArtifacts = "false";
            let previewRunId = "";
            let reason = "";

            async function getToolsVersion(refish) {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path: "packages/jazz-tools/package.json",
                ref: refish,
              });

              if (Array.isArray(response.data) || response.data.type !== "file") {
                throw new Error(`packages/jazz-tools/package.json is not a file at ${refish}`);
              }

              return JSON.parse(
                Buffer.from(response.data.content, response.data.encoding).toString("utf8"),
              ).version;
            }

            const artifactsRunId = process.env.ARTIFACTS_RUN_ID;
            if (artifactsRunId && releaseMode === "dry-run") {
              // The release candidate gate passes the release-artifacts run it
              // verified for this commit (the caller checked commit and status).
              if (!/^[0-9]+$/.test(artifactsRunId)) throw new Error(`artifacts_run_id must be a run ID, got ${artifactsRunId}`);
              // Supply-chain rule: that run must have built this very commit.
              const { data: artifactsRun } = await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: Number(artifactsRunId),
              });
              const producer = (artifactsRun.path || "").split("@")[0].split("/").pop();
              if (!["release-artifacts.yml", "release-candidate.yml"].includes(producer))
                throw new Error(`artifacts_run_id ${artifactsRunId} is a ${producer} run, not release-artifacts or release-candidate`);
              if (String(artifactsRun.event || "").startsWith("pull_request"))
                throw new Error(`artifacts_run_id ${artifactsRunId} is a ${artifactsRun.event} run`);
              if (artifactsRun.head_repository?.full_name !== `${owner}/${repo}`)
                throw new Error(`artifacts_run_id ${artifactsRunId} built ${artifactsRun.head_repository?.full_name}, not ${owner}/${repo}`);
              if (artifactsRun.head_sha !== sha)
                throw new Error(`artifacts_run_id ${artifactsRunId} built ${artifactsRun.head_sha}, not this commit ${sha}`);
              usePreviewArtifacts = "true";
              previewRunId = artifactsRunId;
              reason = `verifying release-artifacts run ${artifactsRunId}`;
            } else if (artifactsRunId) {
              reason = "artifacts_run_id is honoured in dry-run only";
            } else if (releaseMode !== "publish") {
              reason = `preview artifact reuse disabled for mode=${releaseMode}`;
            } else if (ref !== "refs/heads/release") {
              reason = `preview artifact reuse disabled for ${eventName} on ${ref}`;
            } else if (!releasePrNumber || !releasePrHeadRef || !releasePrHeadSha) {
              reason = "release PR metadata unavailable for artifact reuse";
            } else {
              const [currentCommit, previewCommit, currentVersion, previewVersion] = await Promise.all([
                github.rest.git.getCommit({
                  owner,
                  repo,
                  commit_sha: sha,
                }),
                github.rest.git.getCommit({
                  owner,
                  repo,
                  commit_sha: releasePrHeadSha,
                }),
                getToolsVersion(sha),
                getToolsVersion(releasePrHeadSha),
              ]);

              const currentTree = currentCommit.data.tree.sha;
              const previewTree = previewCommit.data.tree.sha;

              let treeReuseSafe = currentTree === previewTree;

              if (!treeReuseSafe) {
                reason = `release tree ${currentTree} differs from release PR head tree ${previewTree}`;
              }

              if (treeReuseSafe && currentVersion !== previewVersion) {
                reason = `release version ${currentVersion} differs from release PR head version ${previewVersion}`;
                treeReuseSafe = false;
              }

              if (treeReuseSafe) {
                // No reuse: the Version Packages head's runs (release-artifacts.yml
                // or the preview) are on changeset-release/*, which restores an
                // actions/cache scope any write collaborator can seed
                // (#supply-chain, 2026-11-19). This run builds until
                // release-artifacts.yml restores no cache on untrusted refs.
                reason = "reuse of changeset-release/* runs is disabled (cache scope); building";
              }
            }

            core.setOutput("use_preview_artifacts", usePreviewArtifacts);
            core.setOutput("preview_run_id", previewRunId);
            core.setOutput("reason", reason);

      - name: Show artifact reuse decision
        run: |
          echo "use_preview_artifacts=${{ steps.resolve.outputs.use_preview_artifacts }}"
          echo "preview_run_id=${{ steps.resolve.outputs.preview_run_id }}"
          echo "reason=${{ steps.resolve.outputs.reason }}"

  build:
    name: Build Jazz packages
    needs: [release-push-gate, resolve-preview-artifacts]
    if: needs.release-push-gate.outputs.should_run == 'true' && needs.resolve-preview-artifacts.outputs.use_preview_artifacts != 'true'
    uses: ./.github/workflows/build-jazz-packages.yml
    secrets: inherit
    with:
      # Alpha releases publish jazz-rn, unlike an ordinary pkg.pr.new preview.
      include_rn: true
      # What ships is also built without cache, and must match.
      reproduce_ios_relay: true

  publish-npm:
    # The job id stays for existing references; it publishes nothing now.
    name: Verify npm packages (dry run)
    runs-on: ubuntu-24.04
    needs:
      - release-push-gate
      - resolve-preview-artifacts
      - build
    if: >-
      always() &&
      needs.release-push-gate.outputs.should_run == 'true' &&
      (
        needs.resolve-preview-artifacts.outputs.use_preview_artifacts == 'true' ||
        needs.build.result == 'success'
      )
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_MODE: ${{ inputs.mode || github.event.inputs.mode || 'dry-run' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.14.0
          run_install: false

      - name: Write cache scope
        run: echo "${{ env.CACHE_SCOPE_REPOSITORY_ID }}" > .github-cache-scope

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .github-cache-scope

      - run: pnpm install --frozen-lockfile

      - name: Show artifact source
        run: |
          if [ "${{ needs.resolve-preview-artifacts.outputs.use_preview_artifacts }}" = "true" ]; then
            echo "Artifact source: preview run ${{ needs.resolve-preview-artifacts.outputs.preview_run_id }}"
          else
            echo "Artifact source: current workflow run"
          fi
          echo "Artifact decision reason: ${{ needs.resolve-preview-artifacts.outputs.reason }}"

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: needs.resolve-preview-artifacts.outputs.use_preview_artifacts != 'true'
        with:
          name: pkg-jazz-tools
          path: packages/jazz-tools

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: needs.resolve-preview-artifacts.outputs.use_preview_artifacts != 'true'
        with:
          name: pkg-jazz-wasm
          path: crates/jazz-wasm

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: needs.resolve-preview-artifacts.outputs.use_preview_artifacts != 'true'
        with:
          name: pkg-jazz-napi
          path: crates/jazz-napi

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: needs.resolve-preview-artifacts.outputs.use_preview_artifacts != 'true'
        with:
          name: pkg-jazz-rn
          path: crates/jazz-rn

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: needs.resolve-preview-artifacts.outputs.use_preview_artifacts != 'true'
        with:
          name: pkg-create-jazz
          path: packages/create-jazz

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: needs.resolve-preview-artifacts.outputs.use_preview_artifacts == 'true'
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-preview-artifacts.outputs.preview_run_id }}
          name: pkg-jazz-tools
          path: packages/jazz-tools

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: needs.resolve-preview-artifacts.outputs.use_preview_artifacts == 'true'
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-preview-artifacts.outputs.preview_run_id }}
          name: pkg-jazz-wasm
          path: crates/jazz-wasm

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: needs.resolve-preview-artifacts.outputs.use_preview_artifacts == 'true'
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-preview-artifacts.outputs.preview_run_id }}
          name: pkg-jazz-napi
          path: crates/jazz-napi

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: needs.resolve-preview-artifacts.outputs.use_preview_artifacts == 'true'
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-preview-artifacts.outputs.preview_run_id }}
          name: pkg-jazz-rn
          path: crates/jazz-rn

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: needs.resolve-preview-artifacts.outputs.use_preview_artifacts == 'true'
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-preview-artifacts.outputs.preview_run_id }}
          name: pkg-create-jazz
          path: packages/create-jazz

      - name: Show release mode
        run: |
          case "${RELEASE_MODE}" in
            publish|dry-run) ;;
            *)
              echo "Unsupported RELEASE_MODE='${RELEASE_MODE}'"
              exit 1
              ;;
          esac
          echo "Release mode: ${RELEASE_MODE}"

      - name: Verify jazz-wasm publish artifacts
        run: |
          test -f crates/jazz-wasm/pkg/jazz_wasm_bg.wasm
          test -f crates/jazz-wasm/pkg/jazz_wasm.js
          test -f crates/jazz-wasm/pkg/jazz_wasm.d.ts

      - name: Verify staged jazz-napi platform artifacts
        run: |
          test -f crates/jazz-napi/npm/linux-x64-gnu/jazz-napi.linux-x64-gnu.node
          test -f crates/jazz-napi/npm/linux-arm64-gnu/jazz-napi.linux-arm64-gnu.node
          test -f crates/jazz-napi/npm/darwin-x64/jazz-napi.darwin-x64.node
          test -f crates/jazz-napi/npm/darwin-arm64/jazz-napi.darwin-arm64.node
          test -f crates/jazz-napi/npm/win32-x64-msvc/jazz-napi.win32-x64-msvc.node

      - name: Verify jazz-tools publish artifacts
        run: |
          test -f packages/jazz-tools/dist/index.js
          test -f packages/jazz-tools/dist/index.d.ts
          test -f packages/jazz-tools/dist/backend/index.js
          test -f packages/jazz-tools/dist/react/index.js

      - name: Verify staged jazz-rn relay artifacts
        env: &release-artifact-source-revision-env
          # `resolve-preview-artifacts` only permits reuse after proving the
          # release source and preview source have equivalent trees. Preserve
          # the latter's commit SHA here: it is the value sealed into its
          # relay-artifact manifests, whereas release's merge commit has a
          # different SHA despite the same source tree.
          # A release-artifacts run (artifacts_run_id) was built at this very
          # commit: it sealed GITHUB_SHA, like a build in this run.
          JAZZ_REUSE_PREVIEW_ARTIFACTS: ${{ needs.resolve-preview-artifacts.outputs.use_preview_artifacts == 'true' && inputs.artifacts_run_id == '' }}
          JAZZ_RELEASE_PR_HEAD_SHA: ${{ needs.release-push-gate.outputs.release_pr_head_sha }}
        run: |
          JAZZ_NATIVE_RELAY_SOURCE_REVISION="$(node dev/artifacts/release-artifact-source-revision.mjs)" \
            node dev/artifacts/rn-packages.mjs verify

      - name: Resolve lock-stepped npm package versions
        run: |
          VERSION=$(git show "${GITHUB_SHA}:packages/jazz-tools/package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>console.log(JSON.parse(s).version))')
          EXPECTED_VERSION=""
          if [ -n "${EXPECTED_VERSION}" ] && [ "${EXPECTED_VERSION}" != "${VERSION}" ]; then
            echo "Manual version ${EXPECTED_VERSION} does not match checked-out source version ${VERSION}."
            echo "Publish a committed release snapshot first; release workflows never rewrite versions in place."
            exit 1
          fi

          echo "Resolved publish version: ${VERSION}"

      - name: Sync jazz-napi platform package versions and optional deps
        run: |
          cd crates/jazz-napi
          pnpm exec napi version --npm-dir npm
          node -e 'const fs=require("fs");const rootPath="package.json";const pkg=JSON.parse(fs.readFileSync(rootPath,"utf8"));const deps=[];for(const entry of fs.readdirSync("npm",{withFileTypes:true})){if(!entry.isDirectory())continue;const child=JSON.parse(fs.readFileSync(`npm/${entry.name}/package.json`,"utf8"));deps.push([child.name,pkg.version]);}deps.sort((a,b)=>a[0].localeCompare(b[0]));pkg.optionalDependencies=Object.fromEntries(deps);fs.writeFileSync(rootPath,`${JSON.stringify(pkg,null,2)}\n`);'

      # The inspector overlay isn't a published package — its embedded build is
      # bundled into jazz-tools' own dist so jazz-tools is self-contained. Build
      # it (against the downloaded jazz-tools/jazz-wasm) and stage it next to the
      # overlay server module before jazz-tools is packed.
      - name: Stage inspector overlay assets into jazz-tools
        run: |
          pnpm --filter inspector run build:embedded
          pnpm --filter jazz-tools run stage:inspector-overlay

      - name: Guard alpha-only lock-stepped publish versions
        run: |
          EXPECTED_VERSION="" node -e 'const fs=require("fs");const path=require("path");const expected=process.env.EXPECTED_VERSION;const alphaVersion=/^2\.0\.0-(alpha|beta)\.[0-9A-Za-z.-]+$/;const tools=JSON.parse(fs.readFileSync("packages/jazz-tools/package.json","utf8"));const wasm=JSON.parse(fs.readFileSync("crates/jazz-wasm/package.json","utf8"));const napi=JSON.parse(fs.readFileSync("crates/jazz-napi/package.json","utf8"));const rn=JSON.parse(fs.readFileSync("crates/jazz-rn/package.json","utf8"));const createJazz=JSON.parse(fs.readFileSync("packages/create-jazz/package.json","utf8"));if(expected){if(!alphaVersion.test(expected)){throw new Error(`Version override must match 2.0.0-alpha.* or 2.0.0-beta.*, got ${expected}`);}if(tools.version!==expected){throw new Error(`Version override mismatch: expected ${expected}, got ${tools.version}`);}}for(const pkg of [tools,wasm,napi,rn,createJazz]){if(!alphaVersion.test(pkg.version)){throw new Error(`${pkg.name} version must match 2.0.0-alpha.* or 2.0.0-beta.*, got ${pkg.version}`);}const tag=pkg.publishConfig&&pkg.publishConfig.tag;if(tag&&tag!=="latest"){throw new Error(`${pkg.name} publishConfig.tag must be latest, got ${tag}`);}}if(!(tools.version===wasm.version&&tools.version===napi.version&&tools.version===rn.version&&napi.version===createJazz.version)){throw new Error(`Versions diverged: tools=${tools.version} wasm=${wasm.version} napi=${napi.version} rn=${rn.version} create-jazz=${createJazz.version}`);}for(const [name,version] of Object.entries(napi.optionalDependencies||{})){if(version!==napi.version){throw new Error(`napi optional dep ${name} is ${version}, expected ${napi.version}`);}}for(const entry of fs.readdirSync("crates/jazz-napi/npm",{withFileTypes:true})){if(!entry.isDirectory())continue;const pkgPath=path.join("crates/jazz-napi/npm",entry.name,"package.json");const pkg=JSON.parse(fs.readFileSync(pkgPath,"utf8"));if(!alphaVersion.test(pkg.version)){throw new Error(`${pkg.name} version must match 2.0.0-alpha.* or 2.0.0-beta.*, got ${pkg.version}`);}if(pkg.version!==napi.version){throw new Error(`${pkg.name} version ${pkg.version} must match jazz-napi ${napi.version}`);}}console.log(`Lock-step version guard passed at ${tools.version}`);'

      - name: Verify immutable release source snapshot
        run: |
          PUBLISHED_VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("packages/create-jazz/package.json","utf8")).version')
          for package_json in \
            packages/create-jazz/package.json \
            packages/jazz-tools/package.json \
            crates/jazz-wasm/package.json \
            crates/jazz-napi/package.json \
            crates/jazz-rn/package.json \
            crates/jazz-rn/npm/android/package.json \
            crates/jazz-rn/npm/ios/package.json; do
            SOURCE_VERSION=$(git show "${GITHUB_SHA}:${package_json}" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>console.log(JSON.parse(s).version))')
            if [ "${SOURCE_VERSION}" != "${PUBLISHED_VERSION}" ]; then
              echo "${package_json} is ${SOURCE_VERSION} at ${GITHUB_SHA}, but this workflow would publish ${PUBLISHED_VERSION}."
              echo "Publish a committed release snapshot first; source tags must exactly match the published packages."
              exit 1
            fi
          done
          echo "Source snapshot ${GITHUB_SHA} exactly matches ${PUBLISHED_VERSION}."

      - name: Verify packed jazz-wasm payload
        run: |
          TMP_DIR=$(mktemp -d)
          pnpm --filter jazz-wasm pack --pack-destination "${TMP_DIR}"
          TARBALL=$(ls "${TMP_DIR}"/jazz-wasm-*.tgz | head -n 1)
          tar -tf "${TARBALL}" | grep -q "package/pkg/jazz_wasm_bg.wasm"
          tar -tf "${TARBALL}" | grep -q "package/pkg/jazz_wasm.js"
          tar -tf "${TARBALL}" | grep -q "package/pkg/jazz_wasm.d.ts"
          # `jazz-wasm/durable-object`: the core a Durable Object hosts.
          echo "durable-object files: $(tar -tf "${TARBALL}" | grep -c "package/durable-object/")"
          tar -tf "${TARBALL}" | grep -q "package/durable-object/pkg/jazz_wasm_do_bg.wasm"
          tar -tf "${TARBALL}" | grep -q "package/durable-object/pkg/jazz_wasm_do.js"
          tar -tf "${TARBALL}" | grep -q "package/durable-object/index.js"
          tar -tf "${TARBALL}" | grep -q "package/durable-object/host.js"
          # `jazz-wasm/backend`: what a backend's `createJazz` runs on in a Worker.
          echo "backend files: $(tar -tf "${TARBALL}" | grep -c "package/backend/")"
          tar -tf "${TARBALL}" | grep -q "package/backend/pkg/jazz_wasm_backend_bg.wasm"
          tar -tf "${TARBALL}" | grep -q "package/backend/pkg/jazz_wasm_backend.js"
          tar -tf "${TARBALL}" | grep -q "package/backend/index.js"

      - name: Verify packed jazz-napi payload
        run: |
          TMP_DIR=$(mktemp -d)
          pnpm --filter jazz-napi pack --pack-destination "${TMP_DIR}"
          TARBALL=$(ls "${TMP_DIR}"/jazz-napi-*.tgz | head -n 1)
          node dev/artifacts/verify-packed-napi.mjs "${TARBALL}"

      - name: Verify packed jazz-rn relay payload
        env: *release-artifact-source-revision-env
        run: |
          export JAZZ_NATIVE_RELAY_SOURCE_REVISION="$(node dev/artifacts/release-artifact-source-revision.mjs)"
          export JAZZ_NATIVE_RELAY_CARGO_NDK_VERSION="${JAZZ_RN_CARGO_NDK_VERSION}"
          node dev/artifacts/rn-packages.mjs pack "$(mktemp -d)"

      - name: Verify packed jazz-tools manifest
        run: |
          TMP_DIR=$(mktemp -d)
          pnpm --filter jazz-tools pack --pack-destination "${TMP_DIR}"
          TARBALL=$(ls "${TMP_DIR}"/jazz-tools-*.tgz | head -n 1)
          tar -xOf "${TARBALL}" package/package.json | node -e 'let s="";process.stdin.on("data",(d)=>s+=d);process.stdin.on("end",()=>{const p=JSON.parse(s);for(const field of ["dependencies","optionalDependencies","peerDependencies"]){for(const [name,version] of Object.entries(p[field]||{})){if(typeof version==="string"&&version.startsWith("workspace:")){throw new Error(`${field}.${name} uses workspace protocol (${version}) in packed manifest`);}}}console.log(`Packed manifest OK for ${p.name}@${p.version}`);});'
          # The inspector overlay's embedded build must be bundled into jazz-tools.
          tar -tf "${TARBALL}" | grep -q "package/dist/dev/inspector-overlay/embedded/embedded.html"
          # So must the Inspector that createJazz serves at <basePath>/inspect/.
          tar -tf "${TARBALL}" | grep -q "package/dist/dev/inspector-overlay/embedded/backend.html"
          # It serves it from this module, which ships wherever the code does.
          tar -xOf "${TARBALL}" package/dist/backend/inspector-ui-files.js > "${TMP_DIR}/inspector-ui-files.js"
          grep -Fq '"backend.html":' "${TMP_DIR}/inspector-ui-files.js"

      - name: Verify packed create-jazz manifest
        run: |
          TMP_DIR=$(mktemp -d)
          pnpm --filter create-jazz pack --pack-destination "${TMP_DIR}"
          TARBALL=$(ls "${TMP_DIR}"/create-jazz-*.tgz | head -n 1)
          tar -xOf "${TARBALL}" package/package.json | node -e 'let s="";process.stdin.on("data",(d)=>s+=d);process.stdin.on("end",()=>{const p=JSON.parse(s);for(const field of ["dependencies","optionalDependencies","peerDependencies"]){for(const [name,version] of Object.entries(p[field]||{})){if(typeof version==="string"&&version.startsWith("workspace:")){throw new Error(`${field}.${name} uses workspace protocol (${version}) in packed manifest`);}}}console.log(`Packed manifest OK for ${p.name}@${p.version}`);});'
          tar -tf "${TARBALL}" | grep -q "package/bin/create-jazz.js"
          tar -tf "${TARBALL}" | grep -q "package/dist/index.js"

  # Read-only check that the Inspector Vercel token can see its project. It runs
  # in candidate dry-runs too, so a broken token shows up before anything
  # publishes. It deliberately does not gate npm publication.
  inspector-preflight:
    name: Check Inspector Vercel access
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [release-push-gate]
    if: needs.release-push-gate.outputs.should_run == 'true'
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_INSPECTOR_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_INSPECTOR_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_INSPECTOR_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - run: node dev/scripts/promote-inspector-deployment.mjs preflight
