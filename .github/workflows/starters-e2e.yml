name: Starters E2E

# Runs the create-jazz-e2e harness against every starter, blocking the
# changesets release PR if any starter fails to scaffold, install, build, or
# pass its Playwright suite against the production build.
#
# Trigger: a changesets-managed release pull request targeting `release` (in
# practice changesets-release-pr dispatches this workflow on
# `changeset-release/release`, because the bot's PR events stop at
# action_required), plus manual dispatch for ad-hoc runs. Ordinary pull
# requests are skipped. The nightly does not run it.
#
# Shape: the `prepare` job produces the three package tarballs (jazz-tools,
# jazz-napi, jazz-wasm) plus the runtime artifacts the harness needs
# (jazz-tools/dist, jazz-napi loader + linux-x64 .node). The `e2e` matrix then
# downloads those and runs the harness per starter.
#
# Where the packages come from:
# - Release runs (the Version Packages head) do not build. They wait for the
#   release preview run on the same commit and download its assembled
#   packages: the exact bytes publish-jazz-tools-alpha.yml later publishes
#   (it reuses the same preview artifacts), including the Linux NAPI binary
#   built on the pinned AL2023 image. Starters therefore finish a few minutes
#   after the preview instead of duplicating its Rust build.
# - Manual dispatches build release WASM and NAPI from their own tree on 16
#   vCPUs (`build:starters-e2e`, i.e. build:core without the debug CLI binary
#   no starter uses). A dispatch can instead test a given preview run's
#   packages with `preview_run_id`.
#
on:
  pull_request:
    branches: [release]
  workflow_dispatch:
    inputs:
      starter:
        description: "Single starter to run (omit for all of them)"
        required: false
        type: string
      preview_run_id:
        description: "Test this release preview run's packages instead of building (optional)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # The scaffolded starter pins its own pnpm via `packageManager`; without
  # this, Corepack prompts on first download and the non-TTY CI run aborts.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  prepare:
    # On PR events, only fire on the changesets release PR. Manual dispatch is
    # always allowed (handy for testing a starter in isolation).
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'changeset-release/release' }}
    # Reusing the preview only waits and downloads, so it needs no build runner;
    # its timeout covers waiting for a preview that has just been dispatched.
    runs-on: ${{ (github.ref == 'refs/heads/changeset-release/release' || github.head_ref == 'changeset-release/release' || (github.event_name == 'workflow_dispatch' && inputs.preview_run_id != '')) && 'blacksmith-4vcpu-ubuntu-2404' || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: ${{ (github.ref == 'refs/heads/changeset-release/release' || github.head_ref == 'changeset-release/release' || (github.event_name == 'workflow_dispatch' && inputs.preview_run_id != '')) && 70 || 30 }}
    permissions:
      actions: read
      contents: read
    env:
      REUSE_PREVIEW: ${{ github.ref == 'refs/heads/changeset-release/release' || github.head_ref == 'changeset-release/release' || (github.event_name == 'workflow_dispatch' && inputs.preview_run_id != '') }}
    steps:
      - name: Validate workflow_dispatch starter
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          STARTER_FILTER: ${{ github.event.inputs.starter }}
        run: |
          case "$STARTER_FILTER" in
            ""|next-betterauth|next-localfirst|next-hybrid|sveltekit-betterauth|sveltekit-localfirst|sveltekit-hybrid|react-betterauth|react-localfirst|react-hybrid|ts-betterauth|ts-localfirst|ts-hybrid|ts-effect-localfirst|ts-effect-betterauth)
              ;;
            *)
              echo "::error::Unknown starter '$STARTER_FILTER'"
              exit 1
              ;;
          esac

      - name: Validate workflow_dispatch preview run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_run_id != '' }}
        env:
          PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
        run: |
          if [[ ! "$PREVIEW_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::preview_run_id must be a workflow run ID, got '$PREVIEW_RUN_ID'"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: env.REUSE_PREVIEW != 'true'
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: starters-e2e-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            starters-e2e-pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Same pinned, version-validated installer as the shipped package build.
      - uses: ./.github/actions/install-rust-tool
        if: env.REUSE_PREVIEW != 'true'
        with:
          tool: wasm-pack@0.13.1

      - name: Build release artifacts and packages
        if: env.REUSE_PREVIEW != 'true'
        run: pnpm run build:starters-e2e

      - name: Verify starter package artifact hand-off
        if: env.REUSE_PREVIEW != 'true'
        run: node dev/artifacts/verify-starter-e2e-artifacts.mjs

      - name: Wait for the release preview of this commit
        id: preview
        if: env.REUSE_PREVIEW == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
        run: node dev/scripts/await-release-preview.mjs

      - name: Download the release preview's packages
        if: env.REUSE_PREVIEW == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pkg-jazz-tools
          path: packages/jazz-tools
          run-id: ${{ steps.preview.outputs.run_id }}
          github-token: ${{ github.token }}

      - if: env.REUSE_PREVIEW == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pkg-jazz-wasm
          path: crates/jazz-wasm
          run-id: ${{ steps.preview.outputs.run_id }}
          github-token: ${{ github.token }}

      - if: env.REUSE_PREVIEW == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pkg-jazz-napi
          path: crates/jazz-napi
          run-id: ${{ steps.preview.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Restore executable permissions on CLI binaries
        # Artifact downloads drop the mode bits; publish restores them the same way.
        if: env.REUSE_PREVIEW == 'true'
        run: |
          chmod 755 \
            packages/jazz-tools/bin/native/jazz-tools-darwin-arm64 \
            packages/jazz-tools/bin/native/jazz-tools-darwin-x64 \
            packages/jazz-tools/bin/native/jazz-tools-linux-arm64 \
            packages/jazz-tools/bin/native/jazz-tools-linux-x64

      - name: Pack workspace tarballs
        # Mirrors PACKAGES_TO_PACK in run-starter.ts. The harness picks these up
        # via `--tarball-dir` and pins them as `pnpm.overrides` in each
        # scaffolded app, exactly the same as running `pnpm pack` in-process.
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_e2e-state/tarballs"
          for pkg in jazz-tools jazz-napi jazz-wasm; do
            dir="packages/$pkg"
            if [ ! -d "$dir" ]; then dir="crates/$pkg"; fi
            (cd "$dir" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/_e2e-state/tarballs")
          done
          ls -la "$GITHUB_WORKSPACE/_e2e-state/tarballs"

      - name: Verify packed preview jazz-napi and stage its Linux binary
        # The same packed-payload check publish runs. The scaffolded apps cannot
        # install the unpublished @garden-co/jazz-napi-* platform packages, so
        # the harness copies this binary into them after checking that its
        # fingerprint matches the packed loader.
        if: env.REUSE_PREVIEW == 'true'
        run: |
          node dev/artifacts/verify-packed-napi.mjs "$(ls "$GITHUB_WORKSPACE"/_e2e-state/tarballs/jazz-napi-*.tgz)"
          cp crates/jazz-napi/npm/linux-x64-gnu/jazz-napi.linux-x64-gnu.node crates/jazz-napi/
          node -e 'require("./crates/jazz-napi")'

      - name: Cache Playwright browsers
        # Same key in the matrix below — prepare populates, matrix restores.
        # The cache is per-OS; we don't key on lockfile because the harness
        # installs Playwright from inside the scaffolded folder anyway, which
        # pins its own version. The install command below is idempotent on a
        # cache hit (Playwright skips re-downloading already-present browsers).
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Upload prebuilt artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: starters-e2e-build-state
          # Tarballs feed `--tarball-dir`. jazz-tools/dist and jazz-napi's
          # generated root runtime closure are needed at *harness* runtime (the
          # harness imports `jazz-tools/dev`, which in turn requires jazz-napi).
          # The tracked bootstrap loads native-loader.cjs and its fingerprint
          # receipt when the machine-local build pointer is absent in a clean
          # matrix checkout.
          path: |
            _e2e-state/tarballs/**
            packages/jazz-tools/dist/**
            crates/jazz-napi/index.js
            crates/jazz-napi/index.d.ts
            crates/jazz-napi/*.node
            crates/jazz-napi/*.manifest.json
            crates/jazz-napi/native-loader.cjs
            crates/jazz-napi/native-artifact-fingerprint.cjs
          if-no-files-found: error
          retention-days: 1

  e2e:
    needs: prepare
    name: E2E ${{ matrix.starter }}${{ matrix.cancel_reopen_subscription_probe && ' cancel/reopen' || '' }}
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'changeset-release/release' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        starter:
          - next-betterauth
          - next-localfirst
          - next-hybrid
          - sveltekit-betterauth
          - sveltekit-localfirst
          - sveltekit-hybrid
          - react-betterauth
          - react-localfirst
          - react-hybrid
          - ts-betterauth
          - ts-localfirst
          - ts-hybrid
          - ts-effect-localfirst
          - ts-effect-betterauth
        cancel_reopen_subscription_probe: [false]
        include:
          - starter: ts-betterauth
            cancel_reopen_subscription_probe: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: starters-e2e-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            starters-e2e-pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Restore prebuilt artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: starters-e2e-build-state
          path: .

      - name: Verify restored NAPI harness runtime
        # Fail before creating a starter when the artifact handoff is missing
        # any generated bootstrap file required by jazz-tools/dev.
        run: node -e 'require("./crates/jazz-napi")'

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        # On a cache hit this is effectively just the apt step (~30s); the
        # browser binaries are restored from cache. --with-deps still runs each
        # job because the system libs aren't part of the cache.
        run: pnpm exec playwright install chromium --with-deps

      - name: Skip if starter doesn't match dispatch filter
        id: filter
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.starter != '' && github.event.inputs.starter != matrix.starter
        run: echo "skip=1" >> "$GITHUB_OUTPUT"

      - name: Run create-jazz-e2e harness
        if: steps.filter.outputs.skip != '1'
        # `--tarball-dir` makes the harness reuse the prebuilt tarballs from
        # `prepare` instead of running `pnpm pack` (which would need build:core
        # to have run in this job). `--keep` retains the scaffolded project so
        # the artifact-upload step below can grab Playwright traces on failure.
        run: pnpm --filter create-jazz-e2e exec tsx src/cli.ts ${{ matrix.starter }} --tarball-dir "$GITHUB_WORKSPACE/_e2e-state/tarballs" --verbose --keep ${{ matrix.cancel_reopen_subscription_probe && '--cancel-reopen-subscription-probe' || '' }}

      - name: Upload Playwright traces on failure
        if: failure() && steps.filter.outputs.skip != '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-traces-${{ matrix.starter }}${{ matrix.cancel_reopen_subscription_probe && '-cancel-reopen' || '' }}
          path: /tmp/cje2e-${{ matrix.starter }}-*/test-app/test-results/**
          if-no-files-found: ignore
          retention-days: 7
