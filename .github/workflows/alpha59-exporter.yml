name: alpha.59 exporter

# Builds `jazz-alpha59-export`, the first half of moving a self-hosted
# alpha.59 server data dir to the current format (the second half is
# `jazz-tools migrate-alpha59 import`), and attaches it to a GitHub release.
#
# The exporter has to link alpha.59 itself, so it is built inside a
# v2.0.0-alpha.59 checkout with `dev/migrate-alpha59/prepare.sh`, from the
# hooks and dump crate at `ref`. Dispatched by hand (or by an agent) for the
# release that self-hosters upgrade to; the assets stay on that release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release to attach the exporter to, e.g. 2.0.0-alpha.60 (tag v<version>). The release, draft or published, must exist."
        required: true
        type: string
      ref:
        description: "Commit or tag whose dev/migrate-alpha59 and dump crate to build. Empty means the release tag."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: alpha59-exporter-${{ inputs.version }}
  cancel-in-progress: false

env:
  CACHE_SCOPE_REPOSITORY_ID: ${{ github.repository_id }}

jobs:
  build:
    name: Build exporter (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 for its older glibc (2.35), so the binary runs on
          # more servers.
          - os: blacksmith-4vcpu-ubuntu-2204
            platform: linux-x64
          - os: blacksmith-4vcpu-ubuntu-2204-arm
            platform: linux-arm64
          - os: blacksmith-6vcpu-macos-15
            platform: darwin-arm64
    steps:
      - name: Validate inputs
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^2\.0\.0-alpha\.[0-9]+$ ]]; then
            echo "::error::version must look like 2.0.0-alpha.N"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref || format('v{0}', inputs.version) }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: v2.0.0-alpha.59
          path: .a59

      - uses: ./.github/actions/setup-build
        with:
          setup-node: "false"
          rust-cache: "false"

      - name: Install the exporter into the alpha.59 checkout
        run: A59_DIR="$PWD/.a59" dev/migrate-alpha59/prepare.sh

      - name: Build
        working-directory: .a59
        run: cargo build --release -p jazz-alpha59-export

      - name: Smoke test
        run: |
          set +e
          .a59/target/release/jazz-alpha59-export 2>usage.txt
          status=$?
          set -e
          cat usage.txt
          test "$status" = 2
          grep -q "usage: jazz-alpha59-export" usage.txt

      - name: Stage
        run: |
          mkdir -p dist
          cp .a59/target/release/jazz-alpha59-export "dist/jazz-alpha59-export-${{ matrix.platform }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jazz-alpha59-export-${{ matrix.platform }}
          path: dist/jazz-alpha59-export-${{ matrix.platform }}
          if-no-files-found: error

  attach:
    name: Attach to v${{ inputs.version }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: jazz-alpha59-export-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum jazz-alpha59-export-* > jazz-alpha59-export.sha256 && cat jazz-alpha59-export.sha256

      - name: Upload
        run: gh release upload "v${{ inputs.version }}" dist/* --clobber
