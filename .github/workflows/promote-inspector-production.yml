name: Promote inspector production

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Verify the exact deployment and project without promoting"
        required: false
        default: false
        type: boolean
      deploy-sha:
        description: "Exact GitHub source commit SHA of the verified staged deployment"
        required: true
        type: string
      deploy-branch:
        description: "Vercel deployment branch to promote"
        required: false
        default: "release"
        type: string
  workflow_call:
    inputs:
      deploy-branch:
        required: false
        default: "release"
        type: string
      deploy-sha:
        description: "GitHub source commit SHA to promote"
        required: true
        type: string
jobs:
  promote-inspector-production:
    name: Promote inspector production
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    concurrency:
      group: inspector-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_INSPECTOR_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_INSPECTOR_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_INSPECTOR_TOKEN }}
      VERCEL_DEPLOY_BRANCH: ${{ inputs.deploy-branch }}
      DEPLOY_SHA: ${{ inputs.deploy-sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Guard Vercel credentials
        run: |
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing ${name}. Configure the matching Vercel inspector GitHub secret."
              exit 1
            fi
          done

      - name: Resolve staged inspector deployment
        id: inspector-deployment
        run: GITHUB_SHA="${DEPLOY_SHA}" node dev/scripts/resolve-inspector-deployment.mjs

      - name: Verify or promote staged inspector deployment
        env:
          DEPLOYMENT_URL: ${{ steps.inspector-deployment.outputs.deployment_url }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
        run: node dev/scripts/promote-inspector-deployment.mjs
