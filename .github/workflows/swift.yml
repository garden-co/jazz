name: Swift

# The Swift bindings on Linux: the StagePlan Swift example's app files must
# be byte-identical to StagePlan's, its committed JazzApp.swift must be what
# the Swift back end writes, and the Jazz Swift package and the example
# must build and pass their tests against libjazz_ffi built from this tree.
on:
  pull_request:
    paths:
      - "crates/jazz-ffi/**"
      - "crates/jazz-app/**"
      - "crates/jazz-codegen/**"
      - "packages/jazz-swift/**"
      - "examples/stage-plan/apps/swift-cli/**"
      - "examples/stage-plan/apps/react-localfirst/jazz.*.json"
      - ".github/workflows/swift.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SWIFT_VERSION: "6.2.1"

jobs:
  swift-linux:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: StagePlan's app files are copied unchanged
        run: |
          for file in jazz.app.json jazz.permissions.json; do
            cmp examples/stage-plan/apps/react-localfirst/$file examples/stage-plan/apps/swift-cli/$file \
              || { echo "::error::examples/stage-plan/apps/swift-cli/$file differs from react-localfirst's: copy it, never edit it"; exit 1; }
          done
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.93.1"
      - name: Install Swift
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev libxml2-dev libncurses6 libedit2 libsqlite3-0 binutils libstdc++-13-dev zlib1g-dev
          curl -fsSL "https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2404/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04.tar.gz" -o swift.tgz
          mkdir -p "$RUNNER_TEMP/swift" && tar xzf swift.tgz -C "$RUNNER_TEMP/swift" --strip-components=1
          echo "$RUNNER_TEMP/swift/usr/bin" >> "$GITHUB_PATH"
      - run: swift --version
      - name: Build jazz-tools (the example's tests start its server)
        run: cargo build -p jazz-cli --bin jazz-tools
      - name: The committed Swift bindings are current
        run: target/debug/jazz-tools generate --check --dir examples/stage-plan/apps/swift-cli
      - name: Build libjazz_ffi and the UniFFI Swift sources
        run: packages/jazz-swift/scripts/build-ffi.sh
      - name: Jazz Swift package tests
        working-directory: packages/jazz-swift
        run: swift test
      - name: StagePlan Swift example tests
        working-directory: examples/stage-plan/apps/swift-cli
        run: swift test
      - name: StagePlan Swift CLI demo against a local server
        working-directory: examples/stage-plan/apps/swift-cli
        env:
          JAZZ_SERVER_URL: http://127.0.0.1:1625
          JAZZ_APP_ID: 00000000-0000-4000-8000-00000057a9e0
          JAZZ_BACKEND_SECRET: ci-backend-secret
          JAZZ_ADMIN_SECRET: ci-admin-secret
        run: |
          ../../../../target/debug/jazz-tools server "$JAZZ_APP_ID" --in-memory --port 1625 \
            --backend-secret "$JAZZ_BACKEND_SECRET" --admin-secret "$JAZZ_ADMIN_SECRET" > server.log 2>&1 &
          for _ in $(seq 100); do grep -q "Listening on" server.log && break; sleep 0.1; done
          swift run stage-plan-swift demo | tee demo.out
          grep -q "doing   Load in" demo.out
