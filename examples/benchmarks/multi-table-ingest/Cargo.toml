[package]
name = "jazz-example-multi-table-ingest-benchmark"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
jazz = { workspace = true, features = ["runtime"] }
jazz-storage-rocksdb = { workspace = true }
tempfile = "3.27.0"

[dev-dependencies]
divan = { workspace = true }

[[bench]]
name = "ingest_memory_walltime"
harness = false

[[bench]]
name = "ingest_rocksdb_walltime"
harness = false
