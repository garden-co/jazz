[package]
name = "jazz-example-band-chat-benchmark"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
jazz = { workspace = true, features = ["testing"] }
jazz-benchmark-guard = { path = "../../../crates/benchmark-guard" }
uuid = "1.18.1"

[dev-dependencies]
divan = { workspace = true }

# CodSpeed measures `walltime` on every merge (dev/benchmarks/codspeed-artifact.mjs).
[[bench]]
name = "walltime"
harness = false

# The band after years of use: measured by the nightly CodSpeed run only.
[[bench]]
name = "nightly"
harness = false

[[bin]]
name = "band-chat-memory-receipt"
path = "src/bin/memory_receipt.rs"
