[package]
name = "jazz-example-doc-shelf-benchmark"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
jazz = { workspace = true, features = ["testing"] }
jazz-benchmark-guard = { path = "../../../crates/benchmark-guard" }
tempfile = "3.27.0"
serde_json = "1.0.145"
tungstenite = "0.29"
postcard = { version = "1.1.3", features = ["alloc"] }
futures-util = "0.3.31"

[dev-dependencies]
divan = { workspace = true }

[[bench]]
name = "walltime"
harness = false

[[bin]]
name = "doc-shelf-footprint"
path = "src/bin/footprint.rs"

[[bin]]
name = "doc-shelf-do-ceiling-ws"
path = "src/bin/do_ceiling_ws.rs"
