[package]
name = "jazz-example-band-book-benchmark"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
jazz = { workspace = true, features = ["testing", "transport-compression-zstd"] }
jazz-storage-rocksdb.workspace = true
jazz-benchmark-guard = { path = "../../../crates/benchmark-guard" }
serde_json = "1.0.145"
tempfile = "3.27.0"
uuid = "1.18.1"

[dev-dependencies]
divan.workspace = true

# CodSpeed measures only `walltime` (dev/benchmarks/codspeed-artifact.mjs).
[[bench]]
name = "walltime"
harness = false

# The rest of the policy sweep: measured by the nightly CodSpeed run only
# (dev/benchmarks/codspeed-artifact.mjs).
[[bench]]
name = "nightly"
harness = false

[[bin]]
name = "band-book-policy-read-receipt"
path = "src/bin/receipt.rs"
