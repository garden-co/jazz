<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App - Jazz React Client</title>
    <style>
      body {
        font-family: system-ui;
        max-width: 600px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .done {
        text-decoration: line-through;
        opacity: 0.6;
      }
      li {
        padding: 0.5rem 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .delete-btn {
        margin-left: auto;
        cursor: pointer;
      }
      small {
        color: #666;
      }
      .settlement-badge {
        display: inline-flex;
        align-items: center;
        margin-bottom: 0.75rem;
        padding: 0.2rem 0.5rem;
        border-radius: 999px;
        background: #e2e8f0;
        color: #334155;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .settlement-badge--local {
        background: #dbeafe;
        color: #1e40af;
      }
      .settlement-badge--remote {
        background: #dcfce7;
        color: #166534;
      }
      form {
        margin-bottom: 1rem;
        display: flex;
        gap: 0.5rem;
      }
      input[type="text"] {
        flex: 1;
        padding: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
