<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App - Jazz React Client</title>
    <style>
      body {
        font-family: system-ui;
        max-width: 600px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .done {
        text-decoration: line-through;
        opacity: 0.6;
      }
      li {
        padding: 0.5rem 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .delete-btn {
        margin-left: auto;
        cursor: pointer;
      }
      small {
        color: #666;
      }
      .query-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }
      .query-options {
        flex: 1 1 auto;
      }
      .query-options > summary {
        cursor: pointer;
        font-weight: 600;
      }
      .query-options__controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        margin-top: 0.5rem;
      }
      .query-tier-control {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      .query-tier-control select {
        padding: 0.25rem 0.4rem;
      }
      #tier-help-button {
        padding: 0.25rem 0.5rem;
      }
      #query-preview-status {
        margin: 0 0 0.75rem;
        color: #475569;
      }
      #tier-help-dialog {
        max-width: min(36rem, calc(100vw - 2rem));
        max-height: calc(100vh - 2rem);
        overflow-y: auto;
        border: 1px solid #cbd5e1;
        border-radius: 0.5rem;
        padding: 1.25rem;
        color: #0f172a;
      }
      #tier-help-dialog::backdrop {
        background: rgb(15 23 42 / 45%);
      }
      #tier-help-dialog h2 {
        margin-top: 0;
      }
      #tier-help-dialog ul {
        padding-left: 1.25rem;
      }
      #tier-help-dialog li {
        display: list-item;
        padding: 0.25rem 0;
      }
      #tier-help-close {
        margin-top: 0.5rem;
      }
      .settlement-badge {
        display: inline-flex;
        align-items: center;
        padding: 0.2rem 0.5rem;
        border-radius: 999px;
        background: #e2e8f0;
        color: #334155;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .settlement-badge--local {
        background: #dbeafe;
        color: #1e40af;
      }
      .settlement-badge--remote {
        background: #dcfce7;
        color: #166534;
      }
      form {
        margin-bottom: 1rem;
        display: flex;
        gap: 0.5rem;
      }
      input[type="text"] {
        flex: 1;
        padding: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
