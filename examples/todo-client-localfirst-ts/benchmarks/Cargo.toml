[package]
name = "jazz-example-todo-benchmark"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
jazz = { workspace = true, features = ["testing", "transport-compression-zstd"] }
jazz-storage-rocksdb.workspace = true
jazz-benchmark-guard = { path = "../../../crates/benchmark-guard" }
serde_json = "1.0.145"
tempfile = "3.27.0"
uuid = "1.18.1"
libc = "0.2"

[dev-dependencies]
divan.workspace = true

[[bench]]
name = "walltime"
harness = false

[[bin]]
name = "todo-profile"
path = "src/bin/profile.rs"
