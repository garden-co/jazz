[package]
name = "stage-plan-rust-cli"
version = "0.1.0"
edition = "2024"
publish = false
description = "StagePlan from Rust: a backend client of the app's TypeScript main backend, over the generated jazz-app bindings"

[lib]
path = "src/lib.rs"

[[bin]]
name = "stage-plan"
path = "src/main.rs"

[dependencies]
jazz-app = { path = "../../../../crates/jazz-app" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs"] }
uuid = "1"

[dev-dependencies]
jazz-server = { path = "../../../../crates/jazz-server", features = ["test"] }
tempfile = "3"
