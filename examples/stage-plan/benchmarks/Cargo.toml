[package]
name = "jazz-example-stage-plan-benchmark"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
jazz = { workspace = true, features = ["testing"] }
jazz-storage-rocksdb.workspace = true
jazz-benchmark-guard = { path = "../../../crates/benchmark-guard" }
serde_json = "1.0.145"
tempfile = "3.27.0"
uuid = "1.18.1"
libc = "0.2"

[dev-dependencies]
divan.workspace = true

# CodSpeed measures only `walltime` (dev/benchmarks/codspeed-artifact.mjs).
[[bench]]
name = "walltime"
harness = false

# Former W1 scaling points and memory twins: compiled by the nightly benchmark
# API check, runnable locally, not measured on CodSpeed.
[[bench]]
name = "nightly"
harness = false

[[bin]]
name = "stage-plan-tasks-profile"
path = "src/bin/tasks_profile.rs"

[[bin]]
name = "stage-plan-tasks-history-depth"
path = "src/bin/tasks_history_depth.rs"

[[bin]]
name = "stage-plan-crew-dashboard"
path = "src/bin/crew_dashboard.rs"
