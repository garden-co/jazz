[package]
name = "jazz-example-permissioned-resources-benchmark"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
bench-alloc-metrics = []
bench-perf-control = []
bench-alloc-sites = ["dep:backtrace", "jazz-sim/bench-alloc-sites"]
cold-settle-attribution = [
  "jazz/cold-settle-attribution",
  "jazz-sim/cold-settle-attribution",
  "dep:tracing",
]

[dependencies]
jazz-sim = { path = "../../../crates/jazz-sim" }
backtrace = { version = "0.3", optional = true }
tracing = { version = "0.1", optional = true }
postcard = { version = "1.1.3", features = ["alloc"] }
zstd = "0.13.3"
jazz = { workspace = true, features = ["testing", "transport-compression-zstd"] }
jazz-storage-rocksdb.workspace = true
jazz-benchmark-guard = { path = "../../../crates/benchmark-guard" }
serde_json = "1.0.145"
tempfile = "3.27.0"
uuid = "1.18.1"
libc = "0.2"

[dev-dependencies]
divan.workspace = true

[[bench]]
name = "walltime"
harness = false

[[bin]]
name = "permissioned-resources-profile"
path = "src/bin/profile.rs"
