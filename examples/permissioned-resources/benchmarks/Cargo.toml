[package]
name = "jazz-example-permissioned-resources-benchmark"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
zstd = "0.13.3"
jazz = { workspace = true, features = ["testing"] }
jazz-benchmark-guard = { path = "../../../crates/benchmark-guard" }
