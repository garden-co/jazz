[package]
name = "jazz-example-big-label-benchmark"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
jazz = { workspace = true, features = ["testing"] }
sha2 = "0.10"
tempfile = "3.27.0"
jazz-benchmark-guard = { path = "../../../crates/benchmark-guard" }
jazz-testkit = { path = "../../../crates/jazz-testkit", default-features = false, features = [
  "scenarios",
] }
uuid = "1.18.1"

[dev-dependencies]
divan = { workspace = true }

[[bench]]
name = "loads"
harness = false

[[bench]]
name = "ingest_walltime"
harness = false

# Measured by the nightly CodSpeed run only (dev/benchmarks/codspeed-artifact.mjs).
[[bench]]
name = "contention"
harness = false
