<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jazz branching project planner</title>
    <style>
      body {
        font: 16px/1.5 system-ui;
        max-width: 960px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 1rem;
      }
      section {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 1rem;
      }
      li {
        margin: 0.6rem 0;
      }
      button {
        margin-left: 0.5rem;
      }
      code {
        background: #eee;
        padding: 0.1rem 0.3rem;
      }
    </style>
  </head>
  <body>
    <h1>Branching project planner</h1>
    <p>
      Change main to compare a live base with a frozen base. Edit an inherited task in the frozen
      draft, then reopen the database to restore the saved snapshot and your draft changes.
    </p>
    <p><button id="change-main">Change main</button><button id="reopen">Save and reopen</button></p>
    <p id="status" role="status"></p>
    <main>
      <section>
        <h2>Main</h2>
        <ul id="main-tasks"></ul>
      </section>
      <section>
        <h2>Draft over live main</h2>
        <ul id="live-draft-tasks"></ul>
      </section>
      <section>
        <h2>Draft over frozen main</h2>
        <ul id="draft-tasks"></ul>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
