[package]
name = "jazz-native-transport"
version.workspace = true
edition = "2024"
description = "Native (non-browser) WebSocket transport between Jazz clients and servers."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
# Only what builds the library: tests, benches and their fixtures stay in the repo.
include = ["src/**", "build.rs", "README.md"]

[dependencies]
jazz = { workspace = true }
futures = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
  "rustls-tls-native-roots",
  "rustls-tls-webpki-roots",
] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
jazz = { workspace = true, features = ["testing", "transport-compression-zstd"] }
jazz-server = { path = "../jazz-server", features = ["test"] }
axum = { version = "0.8.9", default-features = false, features = ["tokio"] }
jazz-benchmark-guard = { path = "../benchmark-guard" }
tempfile = "3.27.0"
