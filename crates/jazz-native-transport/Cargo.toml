[package]
name = "jazz-native-transport"
version.workspace = true
edition = "2024"
description = "Native (non-browser) WebSocket transport between Jazz clients and servers."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
# Only what builds the library: tests, benches and their fixtures stay in the repo.
include = ["src/**", "build.rs", "README.md"]

[dependencies]
jazz = { workspace = true }
futures = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
  "rustls-tls-native-roots",
  "rustls-tls-webpki-roots",
] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
# The OS's roots for reqwest, whose own feature for them is not used: see
# src/http.rs.
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-native-certs = "0.8"
tracing = "0.1"
bytes = "1"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4", "v5"] }
tokio = { version = "1", features = ["io-util", "test-util"] }
base64 = "0.22"
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
jazz = { workspace = true, features = ["testing", "transport-compression-zstd"] }
jazz-server = { path = "../jazz-server", features = ["test"] }
axum = { version = "0.8.9", default-features = false, features = ["tokio"] }
jazz-benchmark-guard = { path = "../benchmark-guard" }
tempfile = "3.27.0"
