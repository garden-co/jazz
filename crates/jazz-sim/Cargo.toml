[package]
name = "jazz-sim"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
profiling = ["dep:pprof"]
# Attribute a cold settle's wall time to each node's ticks and to the
# transport codec (src/phase_attribution.rs). Off in every ordinary build.
cold-settle-attribution = []

[dependencies]
hdrhistogram = "7.5.4"
jazz = { path = "../jazz", default-features = false, features = ["testing"] }
libc = "0.2"
pprof = { version = "0.15.0", features = ["flamegraph"], optional = true }
postcard = { version = "1.1.3", features = ["alloc"] }
# Same version as jazz-db's: both link the one bundled SQLite.
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1.0.145"
tempfile = "3.27.0"
uuid = "1.18.1"

[dev-dependencies]
jazz-benchmark-guard = { path = "../benchmark-guard" }


[[bench]]
name = "micro"
harness = false

[[bench]]
name = "s1_saas"
harness = false

[[bench]]
name = "s2_canvas"
harness = false

[[bench]]
name = "s3_permissions"
harness = false

[[bench]]
name = "s4_order_processing"
harness = false

[[bench]]
name = "s5_durable_stream"
harness = false

[[bench]]
name = "s7_migrations"
harness = false

[[bench]]
name = "s8_branch_views"
harness = false

[[bench]]
name = "s9_durable_execution"
harness = false
