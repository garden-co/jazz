[package]
name = "jazz-napi"
version = "0.1.0"
edition = "2024"

[features]
# Linux RN API harness only; never enabled by published binding defaults. It
# needs jazz-native-relay, which is not ported to SQLite yet, so enabling it
# fails the build with that explanation.
rn-test-bridge = []
# The published Node binding is a WebSocket peer. Its TypeScript carrier
# advertises the binding's actual wire capabilities, so the default package
# includes the same native zstd codec used by the shipped jazz-tools server.
default = ["transport-compression-zstd"]
transport-compression-zstd = ["jazz/transport-compression-zstd"]

[lib]
crate-type = ["cdylib"]

[dependencies]
jazz = { path = "../jazz", default-features = false, features = ["runtime"] }
jazz-server = { path = "../jazz-server", features = ["embedded-server"] }
jazz-otel.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }
futures = "0.3"
base64 = "0.22"
napi = { version = "3", features = ["napi6", "serde-json", "async"] }
napi-derive = "3"
libsodium-sys-stable = "=1.24.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# local_dynamic_tls: a dlopen'd cdylib with mimalloc's default initial-exec
# TLS exhausts glibc's static TLS reserve ("cannot allocate memory in static
# TLS block") once enough other libraries load first. Dynamic TLS is the
# supported mode for shared libraries; see dev/CI_NOTES.md (2026-07-19).
# no_opt_arch: libmimalloc-sys2 otherwise compiles mimalloc with
# -march=armv8.1-a on arm64, so the addon faults with SIGILL on ARMv8.0 hosts
# (#4049). GCC's outline atomics still pick LSE at runtime where present.
mimalloc-safe = { version = "0.1", features = ["local_dynamic_tls", "no_opt_arch"] }

[build-dependencies]
napi-build = "2"
