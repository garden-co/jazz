[package]
name = "groove"
version = "0.1.0"
edition = "2024"
# Integration tests are listed explicitly below so the flat files build as
# one binary; see tests/integration/main.rs.
autotests = false

[features]
default = []
test = []
cold-settle-attribution = []

[dependencies]
tracing = "0.1"
internment = { version = "0.8.6", features = ["serde"] }
bytes = "1"
blake3 = "1"
smallvec = "1.15"
paste = "1.0.15"
thiserror = "2.0.17"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1.3", features = ["alloc"] }
uuid = { version = "1.18.1", features = ["serde", "v4", "v5"] }
web-time = "1.1.0"
rustc-hash.workspace = true
idb-tree = { path = "../idb-tree" }
futures = "0.3"
getrandom = "0.3"

[dev-dependencies]
jazz-benchmark-guard = { path = "../benchmark-guard" }
hdrhistogram = "7.5.4"
rusqlite = { version = "0.34", features = ["bundled"] }
tempfile = "3.27.0"
jazz-storage-rocksdb.workspace = true
futures-test = "0.3"
divan = { workspace = true }

[[bench]]
name = "scenario"
harness = false

[[bench]]
name = "micro"
harness = false

[[bench]]
name = "record_validation"
harness = false

[[bench]]
name = "pull_vs_snapshot"
harness = false

[[bench]]
name = "steady_state"
harness = false

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "inline_scalar_allocations"
path = "tests/inline_scalar_allocations.rs"

[[test]]
name = "nested_record_allocations"
path = "tests/nested_record_allocations.rs"
