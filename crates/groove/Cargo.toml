[package]
name = "groove"
version = "0.1.0"
edition = "2024"

[features]
default = []
test = []
cold-settle-attribution = []

[dependencies]
internment = { version = "0.8.6", features = ["serde"] }
bytes = "1"
smallvec = "1.15"
paste = "1.0.15"
thiserror = "2.0.17"
serde = { version = "1.0.228", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }
uuid = { version = "1.18.1", features = ["serde", "v5"] }
web-time = "1.1.0"
rustc-hash.workspace = true
opfs-btree = { path = "../opfs-btree" }

[dev-dependencies]
jazz-benchmark-guard = { path = "../benchmark-guard" }
hdrhistogram = "7.5.4"
rusqlite = { version = "0.34", features = ["bundled"] }
tempfile = "3.27.0"
serde_json = "1"
jazz-storage-rocksdb.workspace = true

[[bench]]
name = "scenario"
harness = false

[[bench]]
name = "micro"
harness = false
