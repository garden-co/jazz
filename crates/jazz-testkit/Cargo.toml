[package]
name = "jazz-testkit"
version = "0.1.0"
edition = "2024"
autotests = false

[features]
default = ["scenarios", "transport-compression-zstd"]
scenarios = [
  "jazz/testing",
  "dep:jsonwebtoken",
  "dep:jazz-native-transport",
  "dep:jazz-server",
  "dep:reqwest",
  "dep:serde",
  "dep:serde_json",
  "dep:tempfile",
  "dep:tokio",
  "dep:uuid",
]
transport-compression-zstd = ["jazz/transport-compression-zstd", "dep:zstd"]

[dependencies]
jazz.workspace = true
jazz-native-transport = { workspace = true, optional = true }
jazz-server = { path = "../jazz-server", features = ["test"], optional = true }
jsonwebtoken = { version = "10.4", default-features = false, features = [
  "rust_crypto",
  "use_pem",
], optional = true }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tempfile = { version = "3.27.0", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"], optional = true }
uuid = { version = "1", features = ["v5"], optional = true }
zstd = { version = "0.13.3", optional = true }

[dev-dependencies]
postcard = { version = "1.1.3", features = ["alloc"] }

[[test]]
name = "all"
path = "tests/all/main.rs"

[[test]]
name = "policies_integration"
path = "tests/policies_integration/main.rs"

[[test]]
name = "query"
path = "tests/query/main.rs"
