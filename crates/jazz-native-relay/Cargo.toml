[package]
name = "jazz-native-relay"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
jazz.workspace = true
jazz-storage-sqlite.workspace = true
jazz-native-transport.workspace = true
futures = "0.3"
getrandom = "0.3"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.17"
url = "2"
blake3 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
base64 = "0.22"
jazz-server = { path = "../jazz-server", features = ["test"] }
jazz-testkit = { path = "../jazz-testkit", default-features = false, features = ["scenarios"] }
