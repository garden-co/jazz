[package]
name = "jazz-native-relay"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
jazz = { workspace = true, features = ["runtime"] }
jazz-native-transport.workspace = true
jazz-text = { workspace = true, features = ["serde"] }
futures = "0.3"
getrandom = "0.3"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.17"
url = "2"
blake3 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
jazz = { workspace = true, features = ["testing"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
stacker = "0.1"
libc = "0.2"
tempfile = "3.27.0"
base64 = "0.22"
jazz-server = { path = "../jazz-server", features = ["test"] }
jazz-testkit = { path = "../jazz-testkit", default-features = false, features = ["scenarios"] }

