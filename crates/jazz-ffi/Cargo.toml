[package]
name = "jazz-ffi"
version.workspace = true
edition = "2024"
description = "JSON-in/JSON-out bindings of jazz-app for Swift and Kotlin (UniFFI) and Go (C ABI)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
# Only what builds the library: tests, benches and their fixtures stay in the repo.
include = ["src/**", "build.rs", "README.md", "include/**"]
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
# Generates the Swift and Kotlin sources: see README.md.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
jazz-app.workspace = true
base64 = "0.22"
futures-executor = "0.3"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
uuid = "1"
# Pinned exactly: the generated Swift and Kotlin sources must match the
# scaffolding this crate is built with. Only this crate depends on UniFFI;
# jazz-wasm, jazz-napi and jazz-rn never see it.
uniffi = { version = "=0.32.2", default-features = false }

[dev-dependencies]
jazz-server = { path = "../jazz-server", features = ["test"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
