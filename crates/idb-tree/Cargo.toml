[package]
name = "idb-tree"
version = "0.1.0"
edition = "2024"
description = "Async page-store B-tree for Jazz browser persistence."
license = "MIT OR Apache-2.0"
repository = "https://github.com/garden-co/jazz"

[dependencies]
thiserror = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
futures = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
