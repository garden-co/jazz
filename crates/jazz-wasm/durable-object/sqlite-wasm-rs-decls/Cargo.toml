# Keep rusqlite's SQL value/error conversion types without bundling SQLite C.
# Omitting the sqlite adapter excludes native execution: this build neither calls nor
# supplies sqlite3_* functions. The isolated workspace patch is never published.
[package]
name = "sqlite-wasm-rs"
version = "0.5.5"
edition = "2021"
license = "MIT"
publish = false

[features]
# rusqlite names these; they select nothing here.
bindgen = []
sqlite3mc = []

[lib]
name = "sqlite_wasm_rs"
path = "src/lib.rs"
