[package]
name = "jazz-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for the Jazz database engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
console_error_panic_hook = { version = "0.1", optional = true }
ed25519-dalek = "2"
futures-util = "0.3.31"
futures-channel = "0.3.31"
jazz = { path = "../jazz", default-features = false }
js-sys = "0.3.82"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1"
sha2 = "0.10"
tracing = { version = "0.1", default-features = false, features = ["std"] }
wasm-tracing = { package = "jazz-wasm-tracing", path = "../wasm-tracing" }
uuid = { version = "1.18.1", features = ["v5", "v7", "serde", "js"] }
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4.55"
web-time = "1.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
talc = "5.0.4"
sqlite-wasm-rs = { version = "0.5", default-features = false, optional = true }
sqlite-wasm-vfs = { version = "0.2", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
web-sys = { version = "0.3", features = [
  "FileSystemDirectoryHandle",
  "MessageChannel",
  "StorageManager",
  "Navigator",
  "WorkerGlobalScope",
  "WorkerNavigator",
] }

[features]
default = ["browser", "console_error_panic_hook", "transport-compression-ruzstd"]
# The browser's durable stores: SQLite compiled in, on IndexedDB or OPFS.
browser = ["dep:sqlite-wasm-rs", "dep:sqlite-wasm-vfs"]
# A Cloudflare Durable Object's own SQLite (`ctx.storage.sql`) instead of
# SQLite compiled in. Built without `browser`, from a workspace that patches
# sqlite-wasm-rs to its declarations only (dev/durable-objects/native-sqlite).
durable-object = []
bench-probes = []
# Browser store comparison probes (IndexedDB vs OPFS); never in release builds.
browser-bench = ["browser"]
transport-compression-lz4 = ["jazz/transport-compression-lz4"]
transport-compression-zstd = ["jazz/transport-compression-zstd"]
transport-compression-ruzstd = ["jazz/transport-compression-ruzstd"]

# `wasm-opt` here REPLACES wasm-pack's defaults, so we must include `-O` ourselves
# or optimization is silently disabled. `-g` preserves debug info for profiling builds.
# See https://github.com/DataDog/js-instrumentation-wasm/pull/12
[package.metadata.wasm-pack.profile.profiling]
wasm-opt = ["-O", "-g"]

# `-O` (level 2) matched higher levels in our runtime benchmarks, so we stop there.
# `-g` is kept because it had no measurable impact on runtime or output size,
# and it preserves the wasm `name` section so function names appear in profilers.
# wasm-pack only recognizes the profile names `dev`/`profiling`/`release`; any other
# name is silently ignored and wasm-pack falls back to its built-in defaults.
# `--low-memory-unused` lets wasm-opt fold `ptr + constant` into load/store
# offsets. The two forms differ only when `ptr + constant` wraps past 4 GiB into
# the first 1 KiB, which no valid Rust access does: that address range is the
# bottom of the shadow stack, reached only by a stack overflow, which then traps
# instead of silently corrupting memory. It cuts gzip by 2.75% and measured
# neutral-to-faster in the fresh-Chromium read/write benchmarks.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "-g", "--low-memory-unused"]
