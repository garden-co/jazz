[package]
name = "jazz-do"
version = "0.1.0"
edition = "2021"
publish = false
description = "jazz-wasm for Cloudflare Durable Objects, on ctx.storage.sql"

[lib]
crate-type = ["cdylib"]

[dependencies]
jazz-server = { path = "../../../../crates/jazz-server", default-features = false }
jazz = { path = "../../../../crates/jazz", default-features = false }
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4.55"
js-sys = "0.3.82"
serde_json = "1"
jazz-wasm = { path = "../../../../crates/jazz-wasm", default-features = false, features = [
  "durable-object",
  "server",
  "console_error_panic_hook",
  "transport-compression-ruzstd",
] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "-g", "--low-memory-unused"]

[features]
scope-tests = ["jazz-wasm/durable-object-tests"]
