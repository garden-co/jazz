[package]
name = "jazz-compression"
version.workspace = true
edition = "2024"
description = "Transport compression codecs (lz4, zstd, zrip) for Jazz's sync protocol."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
# Only what builds the library: tests, benches and their fixtures stay in the repo.
include = ["src/**", "build.rs", "README.md"]

[features]
default = []
lz4 = ["dep:lz4_flex"]
zstd = ["dep:zstd"]
zrip = ["dep:zrip"]

[dependencies]
lz4_flex = { version = "0.11.5", default-features = false, features = ["frame"], optional = true }
zrip = { version = "0.8.27", default-features = false, features = ["std", "simd"], optional = true }
zstd = { version = "0.13.3", optional = true }

[dev-dependencies]
zstd = "0.13.3"
