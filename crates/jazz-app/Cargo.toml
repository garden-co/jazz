[package]
name = "jazz-app"
version.workspace = true
edition = "2024"
description = "Typed, Send + Clone Rust handle for a Jazz app opened from its jazz.app.json"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
# Only what builds the library: tests, benches and their fixtures stay in the repo.
include = ["src/**", "build.rs", "README.md"]

[dependencies]
jazz = { workspace = true, features = ["runtime"] }
jazz-native-transport.workspace = true
futures-core = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }

[dev-dependencies]
jazz-codegen = { path = "../jazz-codegen" }
jazz-server = { path = "../jazz-server", features = ["test"] }
futures = "0.3"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
