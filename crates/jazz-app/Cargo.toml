[package]
name = "jazz-app"
version = "0.1.0"
edition = "2024"
description = "Typed, Send + Clone Rust handle for a Jazz app opened from its jazz.app.json"

[features]
# `Endpoint::router`: the app's Jazz endpoint as an Axum router.
axum = ["dep:axum"]

[dependencies]
axum = { version = "0.8.9", optional = true, default-features = false, features = [
  "http1",
  "tokio",
  "ws",
] }
jazz = { workspace = true, features = ["runtime"] }
jazz-native-transport.workspace = true
base64 = "0.22"
futures-core = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.3"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
  "rustls-tls-native-roots",
] }

[dev-dependencies]
hmac = "0.12"
sha2 = "0.10"
jazz-codegen = { path = "../jazz-codegen" }
jazz-server = { path = "../jazz-server", features = ["test"] }
futures = "0.3"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
  "handshake",
] }

[[example]]
name = "endpoint_server"
required-features = ["axum"]
