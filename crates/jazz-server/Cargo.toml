[package]
name = "jazz-server"
version = "0.1.0"
edition = "2024"

[features]
default = []
otel = ["dep:jazz-otel", "dep:opentelemetry"]
embedded-server = ["jazz/runtime"]
sqlite = []
sync-autopsy = ["jazz/sync-autopsy"]
test = ["embedded-server", "sync-autopsy", "jazz/testing"]

[dependencies]
jazz = { workspace = true, default-features = false, features = ["runtime"] }
jazz-storage-rocksdb.workspace = true
jazz-otel = { workspace = true, optional = true }
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "json",
  "matched-path",
  "original-uri",
  "query",
  "tokio",
  "tracing",
  "ws",
] }
base64 = "0.22"
futures = "0.3"
futures-util = "0.3"
http = "1"
jsonwebtoken = { version = "10.4", default-features = false, features = ["rust_crypto", "use_pem"] }
hex = "0.4"
opentelemetry = { version = "0.31", optional = true }
postcard = { version = "1.1.3", features = ["alloc"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10"
tokio = { version = "1", features = [
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tower-http = { version = "0.6.8", default-features = false, features = ["cors", "trace"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tracing = "0.1"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
uuid = { version = "1.18.1", features = ["serde", "v4", "v5", "v7"] }

[dev-dependencies]
groove.workspace = true
jazz = { workspace = true, default-features = false, features = ["testing"] }
tempfile = "3.27.0"
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
  "rustls-tls-native-roots",
  "rustls-tls-webpki-roots",
] }
tower = { version = "0.5", features = ["util"] }
