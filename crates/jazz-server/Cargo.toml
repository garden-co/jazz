[package]
name = "jazz-server"
version.workspace = true
edition = "2024"
description = "The Jazz sync server, as a library."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
# Only what builds the library: tests, benches and their fixtures stay in the repo.
include = ["src/**", "build.rs", "README.md"]

[features]
default = ["sqlite"]
# Include Jazz's built-in SQLite backend; disable for host-provided storage.
sqlite = ["jazz/sqlite", "dep:rusqlite", "jazz-sql/sqlite"]
otel = ["dep:jazz-otel", "dep:opentelemetry"]
embedded-server = ["jazz/runtime", "dep:tower"]
test = ["embedded-server", "jazz/testing"]

[dependencies]
jazz = { package = "jazz-core", version = "=2.0.0-alpha.66", path = "../jazz", default-features = false, features = ["runtime"] }
jazz-sql.workspace = true
jazz-otel = { workspace = true, optional = true }
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "json",
  "matched-path",
  "original-uri",
  "query",
  "tokio",
  "tracing",
  "ws",
] }
base64 = "0.22"
bytes = "1"
futures = "0.3"
futures-util = "0.3"
http = "1"
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
jsonwebtoken = { version = "10.4", default-features = false, features = ["rust_crypto", "use_pem"] }
hex = "0.4"
hmac = "0.12"
opentelemetry = { version = "0.31", optional = true }
postcard = { version = "1.1.3", features = ["alloc"] }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10"
tokio = { version = "1", features = [
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.6.8", default-features = false, features = ["cors", "trace"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tracing = "0.1"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
uuid = { version = "1.18.1", features = ["serde", "v4", "v5", "v7"] }

[dev-dependencies]
flate2 = "1"
jazz = { workspace = true, default-features = false, features = ["testing"] }
tempfile = "3.27.0"
tokio = { version = "1", features = ["io-util", "test-util"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
  "rustls-tls-native-roots",
  "rustls-tls-webpki-roots",
] }
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "trusted_workload"
required-features = ["test"]

[[test]]
name = "admin_secret_credential"
required-features = ["test"]
