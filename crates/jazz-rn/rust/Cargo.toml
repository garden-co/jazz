[package]
name = "jazz-rn"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
uniffi = "0.30.0"
thiserror = "1.0.64"
jazz = { path = "../../jazz", default-features = false, features = ["sqlite", "transport-compression-zstd"] }
futures = "0.3"
base64 = "0.22.1"
serde_json = "1.0"
postcard = { version = "1.1.3", features = ["alloc"] }

[build-dependencies]
uniffi = { version = "0.30.0", features = ["build"] }

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
