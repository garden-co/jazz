buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["DummyLibForAndroid_kotlinVersion"]

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
} else {
  throw new GradleException(
    "jazz-rn requires the React Native New Architecture. Enable newArchEnabled=true " +
      "(Expo: add the jazz-rn config plugin, then run expo prebuild)."
  )
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["JazzRn_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["JazzRn_" + name]).toInteger()
}

// Resolve through the consuming app's Node graph rather than assuming a
// repository layout. This is the same package boundary the React Gradle plugin
// itself uses, and works for Expo's nested/pnpm install as well as bare RN.
def reactNativeDir = new File([
  "node",
  "--print",
  "require.resolve('react-native/package.json')",
].execute(null, rootProject.projectDir).text.trim()).getParentFile().getAbsoluteFile()

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.jazzrn"
  }

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    consumerProguardFiles 'proguard-rules.pro'

  }

  buildFeatures {
    buildConfig true
    // Expose this library's native target to AGP's prefab graph. That same
    // graph supplies ReactAndroidConfig.cmake and fbjniConfig.cmake to the
    // external CMake invocation below; do not try to discover a private RN
    // build directory from CMake.
    prefab true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

}

// 32-bit x86 is retired: it is neither a supported Android device target nor
// the x86_64 emulator ABI used by the installed-app receipt. Keep this list
// aligned with the sealed artifact manifest before enabling the CMake host.
def relayNativeArtifactsPresent = ["arm64-v8a", "armeabi-v7a", "x86_64"].every { abi ->
  file("src/main/jniLibs/${abi}/libjazz_native_relay.a").isFile()
} && file("../native/include/jazz_native_relay.h").isFile()

if (relayNativeArtifactsPresent) {
  android {
    defaultConfig {
      externalNativeBuild {
        cmake {
          arguments "-DANDROID_STL=c++_shared",
            "-DREACT_NATIVE_DIR=${reactNativeDir}"
        }
      }
    }
    externalNativeBuild { cmake { path "CMakeLists.txt" } }
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
  }
}
