[package]
name = "jazz-core"
version.workspace = true
edition = "2024"
description = "Jazz's engine: a local-first, distributed, real-time database with full edit history and authorized sync, on SQLite."
autobins = false
autobenches = false
autotests = false
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
# Only what builds the library: tests, benches and their fixtures stay in the repo.
include = ["src/**", "build.rs", "README.md", "ENV.md"]
readme = "README.md"

# Published as jazz-core (`jazz` on crates.io is an unrelated project); the
# library keeps the name `jazz`, so code still says `use jazz::`.
[lib]
name = "jazz"
path = "src/lib.rs"

[features]
# Jazz is the common semantic library. Process and target shells select
# transport and compression capabilities explicitly.
default = ["sqlite"]
sqlite = ["jazz-db/sqlite"]
runtime = ["sqlite", "dep:jsonwebtoken", "dep:tokio", "jazz-model/runtime"]
# See jazz-db's `sql-trace`.
sql-trace = ["jazz-db/sql-trace"]
# See jazz-db's `durable-object-limits`.
durable-object-limits = ["jazz-db/durable-object-limits"]
# See jazz-db's `managed-storage-emulation`.
managed-storage-emulation = ["testing", "jazz-db/managed-storage-emulation"]
# How an app's backend admits its clients' sockets
# (`tools::backend_admission`). Only backends take it: `raw_value` grows every
# user of serde_json, and browsers must not pay for it.
backend-admission = ["serde_json/raw_value"]
testing = [
  "backend-admission",
  "runtime",
  "jazz-types/testing",
  "jazz-model/testing",
  "jazz-protocol/testing",
  "jazz-db/testing",
]
transport-compression-lz4 = ["jazz-compression/lz4", "jazz-protocol/transport-compression-lz4"]
transport-compression-zstd = ["jazz-compression/zstd", "jazz-protocol/transport-compression-zstd"]
transport-compression-ruzstd = [
  "jazz-compression/ruzstd",
  "jazz-protocol/transport-compression-ruzstd",
]

[dependencies]
futures-core = "0.3.31"
futures-channel = "0.3.31"
futures = "0.3"
futures-util = "0.3"
jazz-types.workspace = true
jazz-model.workspace = true
jazz-protocol.workspace = true
jazz-db.workspace = true
bytes = "1"
jazz-compression.workspace = true
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["serde", "v4", "v5", "v7"] }
web-time = "1.1"
tracing = "0.1"
hex = "0.4"
rand = "0.8"
rustc-hash.workspace = true
serde_bytes = "0.11"
internment = "0.8"
smallvec = { version = "1.11", features = ["serde"] }
stacker = "0.1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"], optional = true }
jsonwebtoken = { version = "10.4", default-features = false, features = [
  "rust_crypto",
  "use_pem",
], optional = true }
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }

[dev-dependencies]
# Jazz's own tests (and the layer crates' test helpers they call) need the
# `testing` feature, so a featureless `cargo test -p jazz-core` enables it here.
jazz = { package = "jazz-core", path = ".", default-features = false, features = ["testing"] }
# The JSON Schemas of the app files, checked against the fixtures (jazz-model
# already depends on this crate).
jsonschema = { version = "0.42", default-features = false }
divan.workspace = true
jazz-benchmark-guard = { path = "../benchmark-guard" }
hdrhistogram = "7.5.4"
tempfile = "3.27.0"
tar = "0.4"
libc = "0.2"
criterion = "0.5"
flate2 = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
insta = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = { version = "10.4", default-features = false, features = ["rust_crypto", "use_pem"] }
futures = "0.3"
tokio = { version = "1", features = [
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "sync",
  "test-util",
  "time",
] }
tower = { version = "0.5", features = ["util"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }

[[bench]]
name = "fanout"
harness = false

[[bench]]
name = "fanout_wire"
harness = false

[[bench]]
name = "fanout_relations"
harness = false

[[bench]]
name = "fanout_policy_tables"
harness = false

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "durable_file"
path = "tests/durable_file.rs"

[[test]]
name = "maintained_differential"
path = "tests/maintained_differential.rs"
