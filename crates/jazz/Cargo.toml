[package]
name = "jazz"
version = "0.1.0"
edition = "2024"
autobins = false
autobenches = false
autotests = true

[features]
# Jazz is the common semantic library. Process and target shells select
# storage, transport, compression, and server capabilities explicitly.
default = []
rocksdb = ["groove/rocksdb", "dep:rocksdb"]
sqlite = ["dep:rusqlite"]
native-websocket-transport = [
  "dep:reqwest",
  "dep:tokio",
  "dep:tokio-tungstenite",
  "dep:tungstenite",
]
client = ["native-websocket-transport"]
server = [
  "native-websocket-transport",
  "dep:axum",
  "dep:tracing-subscriber",
  "dep:tower-http",
  "dep:async-stream",
]
sync-autopsy = []
# Disabled-by-default counters for the cold-settle attribution bench. They do
# not alter protocol behavior or production measurement paths.
cold-settle-attribution = ["groove/cold-settle-attribution"]
r3-open-attribution = ["rocksdb", "testing"]
testing = []
transport-compression-lz4 = ["dep:lz4_flex"]
transport-compression-zstd = ["dep:zstd"]
transport-compression-ruzstd = ["dep:ruzstd"]
test-utils = ["server", "client", "sqlite", "sync-autopsy"]
test = ["test-utils", "rocksdb", "transport-compression-zstd"]

[dependencies]
futures-core = "0.3.31"
futures-channel = "0.3.31"
futures = "0.3"
futures-util = "0.3"
blake3 = "1"
groove = { workspace = true, default-features = false }
lz4_flex = { version = "0.11.5", default-features = false, features = ["frame"], optional = true }
postcard = { version = "1.1.3", features = ["alloc"] }
ruzstd = { version = "0.8.2", default-features = false, optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["serde", "v4", "v5", "v7"] }
web-time = "1.1"
zstd = { version = "0.13.3", optional = true }
tracing = "0.1"
hex = "0.4"
rand = "0.8"
serde_bytes = "0.11"
jsonschema = { version = "0.42", default-features = false }
internment = "0.8"
smallvec = { version = "1.11", features = ["serde"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"], optional = true }
rocksdb = { package = "rust-rocksdb", version = "0.48.0", default-features = false, features = [
  "lz4",
  "zstd",
], optional = true }
rusqlite = { version = "0.34", features = ["bundled"], optional = true }
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "json",
  "matched-path",
  "original-uri",
  "query",
  "tokio",
  "tracing",
  "ws",
], optional = true }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
  "rustls-tls-native-roots",
  "rustls-tls-webpki-roots",
], optional = true }
tungstenite = { version = "0.29", default-features = false, features = [
  "handshake",
], optional = true }
bytes = { version = "1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tower-http = { version = "0.6.8", default-features = false, features = [
  "cors",
  "trace",
], optional = true }
async-stream = { version = "0.3", optional = true }
jsonwebtoken = { version = "10.4", default-features = false, features = ["rust_crypto", "use_pem"] }
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
], optional = true }

[dev-dependencies]
jazz-benchmark-guard = { path = "../benchmark-guard" }
hdrhistogram = "7.5.4"
tempfile = "3.27.0"
libc = "0.2"
criterion = "0.5"
insta = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bytes = "1"
jsonwebtoken = { version = "10.4", default-features = false, features = ["rust_crypto", "use_pem"] }
futures = "0.3"
tokio = { version = "1", features = [
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "sync",
  "test-util",
  "time",
] }
tower = { version = "0.5", features = ["util"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }

