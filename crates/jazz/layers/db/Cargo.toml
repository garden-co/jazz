[package]
name = "jazz-db"
version = "0.1.0"
edition = "2024"
description = "Jazz's database layer: the thread-affine Db facade over the node, and its binding codec."

[features]
default = []
runtime = ["jazz-model/runtime", "jazz-node/runtime"]
sync-autopsy = []
# Disabled-by-default counters for the cold-settle attribution bench.
cold-settle-attribution = ["groove/cold-settle-attribution", "jazz-node/cold-settle-attribution"]
# Test helpers shared with the crates above this one.
testing = [
  "runtime",
  "jazz-types/testing",
  "jazz-model/testing",
  "jazz-protocol/testing",
  "jazz-engine/testing",
  "jazz-node/testing",
]
transport-compression-lz4 = ["jazz-node/transport-compression-lz4"]
transport-compression-zstd = ["jazz-node/transport-compression-zstd"]
transport-compression-ruzstd = ["jazz-node/transport-compression-ruzstd"]

[dependencies]
groove = { workspace = true, default-features = false }
jazz-types.workspace = true
jazz-model.workspace = true
jazz-protocol.workspace = true
jazz-engine.workspace = true
jazz-node.workspace = true
blake3 = "1"
bytes = "1"
futures = "0.3"
futures-channel = "0.3.31"
futures-core = "0.3.31"
hex = "0.4"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
stacker = "0.1"
thiserror = "2.0.17"
tracing = "0.1"
uuid = { version = "1.18.1", features = ["serde", "v4", "v5", "v7"] }
web-time = "1.1"

[dev-dependencies]
groove = { workspace = true, default-features = false, features = ["test"] }
jazz-types = { workspace = true, features = ["testing"] }
jazz-model = { workspace = true, features = ["testing"] }
jazz-protocol = { workspace = true, features = ["testing"] }
jazz-engine = { workspace = true, features = ["testing"] }
jazz-node = { workspace = true, features = ["testing"] }
jazz-benchmark-guard = { path = "../../../benchmark-guard" }
jazz-storage-rocksdb.workspace = true
tempfile = "3.27.0"
