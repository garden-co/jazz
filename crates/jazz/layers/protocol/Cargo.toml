[package]
name = "jazz-protocol"
version.workspace = true
edition = "2024"
description = "Jazz's protocol layer: sync messages, wire frames, protocol limits and authorization scopes."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
# Only what builds the library: tests, benches and their fixtures stay in the repo.
include = [
  "src/**",
  "build.rs",
  "README.md",
  "fixtures/wire_frame_artifact_corpus_v6.json",
  "fixtures/wire_reasoned_error_v1.json",
]

[features]
default = []
# Test helpers shared with the crates above this one.
testing = ["jazz-types/testing", "jazz-model/testing"]
transport-compression-lz4 = ["jazz-compression/lz4"]
transport-compression-zstd = ["jazz-compression/zstd"]
transport-compression-ruzstd = ["jazz-compression/ruzstd"]

[dependencies]
jazz-types.workspace = true
jazz-model.workspace = true
jazz-compression.workspace = true
hex = "0.4"
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.8"
rustc-hash.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0.145"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["serde", "v4", "v5", "v7"] }
web-time = "1.1"

[dev-dependencies]
jazz-types = { workspace = true, features = ["testing"] }
jazz-model = { workspace = true, features = ["testing"] }
