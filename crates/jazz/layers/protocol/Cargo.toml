[package]
name = "jazz-protocol"
version = "0.1.0"
edition = "2024"
description = "Jazz's protocol layer: sync messages, wire frames, protocol limits and authorization scopes."

[features]
default = []
# Test helpers shared with the crates above this one.
testing = ["jazz-types/testing", "jazz-model/testing"]
transport-compression-lz4 = ["jazz-compression/lz4"]
transport-compression-zstd = ["jazz-compression/zstd"]
transport-compression-ruzstd = ["jazz-compression/ruzstd"]

[dependencies]
groove = { workspace = true, default-features = false }
jazz-types.workspace = true
jazz-model.workspace = true
jazz-compression.workspace = true
blake3 = "1"
hex = "0.4"
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.8"
rustc-hash.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0.145"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["serde", "v4", "v5", "v7"] }
web-time = "1.1"

[dev-dependencies]
groove = { workspace = true, default-features = false, features = ["test"] }
jazz-types = { workspace = true, features = ["testing"] }
jazz-model = { workspace = true, features = ["testing"] }
