[package]
name = "jazz-types"
version = "0.1.0"
edition = "2024"
description = "Bottom layer of Jazz: wire-stable ids, time, object and identity types."

[features]
default = []
# Test helpers shared with the crates above this one.
testing = []

[dependencies]
bytes = "1"
blake3 = "1"
paste = "1.0.15"
rustc-hash.workspace = true
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["serde", "v4", "v5", "v7"] }
serde_bytes = "0.11"
internment = { version = "0.8.6", features = ["serde"] }
smallvec = { version = "1.11", features = ["serde", "const_generics"] }
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
getrandom = "0.3"


[dev-dependencies]
futures = "0.3"
