[package]
name = "jazz-model"
version = "0.1.0"
edition = "2024"
description = "Jazz's data model layer: schema, queries, transactions and the public schema model."

[features]
default = []
runtime = []
# Test helpers shared with the crates above this one.
testing = ["runtime", "jazz-types/testing"]

[dependencies]
groove = { workspace = true, default-features = false }
jazz-types.workspace = true
base64 = "0.22"
blake3 = "1"
hex = "0.4"
internment = "0.8"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0.145"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["serde", "v4", "v5", "v7"] }

# The browser build validates JSON columns through its JS host instead, which
# keeps this crate's regex/IDNA/bignum dependencies out of the WASM binary.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
jsonschema = { version = "0.42", default-features = false }

[dev-dependencies]
groove = { workspace = true, default-features = false, features = ["test"] }
