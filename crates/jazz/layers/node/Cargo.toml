[package]
name = "jazz-node"
version = "0.1.0"
edition = "2024"
description = "Jazz's node layer: the storage-backed node state machine and per-peer sync state."

[features]
default = []
runtime = ["jazz-model/runtime"]
# Disabled-by-default counters for the cold-settle attribution bench.
cold-settle-attribution = ["groove/cold-settle-attribution"]
# Test helpers shared with the crates above this one.
testing = [
  "runtime",
  "jazz-types/testing",
  "jazz-model/testing",
  "jazz-protocol/testing",
  "jazz-engine/testing",
]
transport-compression-lz4 = ["jazz-protocol/transport-compression-lz4"]
transport-compression-zstd = ["jazz-protocol/transport-compression-zstd"]
transport-compression-ruzstd = ["jazz-protocol/transport-compression-ruzstd"]

[dependencies]
groove = { workspace = true, default-features = false }
jazz-types.workspace = true
jazz-model.workspace = true
jazz-protocol.workspace = true
jazz-engine.workspace = true
blake3 = "1"
bytes = "1"
futures = "0.3"
hex = "0.4"
postcard = { version = "1.1.3", features = ["alloc"] }
rustc-hash.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tracing = "0.1"
uuid = { version = "1.18.1", features = ["serde", "v4", "v5", "v7"] }
web-time = "1.1"

[dev-dependencies]
groove = { workspace = true, default-features = false, features = ["test"] }
jazz-types = { workspace = true, features = ["testing"] }
jazz-model = { workspace = true, features = ["testing"] }
jazz-protocol = { workspace = true, features = ["testing"] }
jazz-engine = { workspace = true, features = ["testing"] }
jazz-benchmark-guard = { path = "../../../benchmark-guard" }
jazz-storage-rocksdb.workspace = true
jazz-storage-sqlite.workspace = true
base64 = "0.22"
flate2 = "1"
rocksdb = { package = "rust-rocksdb", version = "0.48.0", default-features = false, features = [
  "lz4",
  "zstd",
] }
rusqlite = { version = "0.34", features = ["bundled"] }
sha2 = "0.10"
tar = "0.4"
tempfile = "3.27.0"
