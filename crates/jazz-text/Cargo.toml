[package]
name = "jazz-text"
version.workspace = true
edition = "2024"
description = "Jazz's text primitives: the authority's text merge and stateless anchors into text."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
# Only what builds the library: tests, benches and their fixtures stay in the repo.
include = ["src/**", "build.rs", "README.md"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"], optional = true }

[features]
# Serialize anchors, ranges and their resolves for host bindings.
serde = ["dep:serde"]

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
