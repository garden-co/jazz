[package]
name = "jazz-alpha59-alpha60-dump"
version.workspace = true
edition = "2024"
description = "The dump format between the alpha59-alpha60 exporter and its importer."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
# Only what builds the library: tests, benches and their fixtures stay in the repo.
include = ["src/**", "build.rs", "README.md"]

[dependencies]
serde_json = "1.0"
blake3 = "1.8"
ciborium = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
