[workspace]
resolver = "2"
members = [
  "crates/benchmark-guard",
  "crates/jazz",
  "crates/jazz/layers/db",
  "crates/jazz/layers/model",
  "crates/jazz/layers/protocol",
  "crates/jazz/layers/types",
  "crates/jazz-compression",
  "crates/jazz-e2ee",
  "crates/jazz-e2ee-client",
  "crates/jazz-text",
  "crates/wasm-tracing",
  "crates/jazz-wasm",
  "crates/jazz-native-transport",
  "crates/jazz-native-relay",
  "crates/jazz-app",
  # JSON-in/JSON-out bindings of jazz-app-support: UniFFI (Swift, Kotlin), C ABI (Go).
  "crates/jazz-ffi",
  "crates/jazz-cli",
  "crates/jazz-codegen",
  "crates/jazz-server",
  "crates/jazz-testkit",
  "crates/jazz-otel",
  "crates/jazz-sim",
  "crates/jazz-napi",
  # Opens its app through jazz-app-support's Send + Clone handle.
  "examples/todo-server-rs",
  "examples/stage-plan/apps/rust-cli",
  # The docs copy, whose snippets the docs include by region.
  "examples/docs/todo-server-rs",
  # The docs' backend-client snippets.
  "examples/docs/backend-client-rs",
  # The encryption docs' Rust snippets.
  "examples/docs/e2ee-rs",
  # Probes the backend-client contract against a TS main backend.
  "examples/rust-backend-clients/probe",
  "examples/stage-plan/benchmarks",
  "examples/band-book/benchmarks",
  "examples/permissioned-resources/benchmarks",
  "examples/big-label/benchmarks",
  "examples/epic-drop/benchmarks",
  "examples/band-chat/benchmarks",
  "examples/music-agent/benchmarks",
  "examples/record-player/benchmarks",
  "examples/doc-shelf/benchmarks",
  "examples/world-tour/benchmarks",
  "examples/poster-shop/benchmarks",
  "examples/jamazon-warehouse/benchmarks",
  "examples/wequencer/benchmarks",
]
exclude = [
  # The patched ruzstd fork, published as jazz-ruzstd. Not a member, since its
  # upstream tests aren't vendored; dev/scripts/publish-crates.mjs adds it
  # while packaging so it verifies with the crates that depend on it.
  "vendor/ruzstd",
  "vendor/sqlite-wasm-rs",
]

# The browser build's SQLite. A global patch, so rusqlite's wasm FFI and
# jazz-wasm link the same copy; it drops SQLite extensions Jazz never uses.
# See vendor/sqlite-wasm-rs/JAZZ_PATCH.md.
[patch.crates-io]
sqlite-wasm-rs = { path = "vendor/sqlite-wasm-rs" }

# Shared by every crate published to crates.io. The version stays in
# lockstep with the jazz-tools npm package: `pnpm release:version` runs
# dev/scripts/sync-crate-versions.mjs, and CI checks it
# (dev/scripts/check-lockstep-versions.mjs).
[workspace.package]
version = "2.0.0-beta.4"
license = "MIT"
repository = "https://github.com/garden-co/jazz"
homepage = "https://jazz.tools"
rust-version = "1.100"

[workspace.dependencies]
jazz = { package = "jazz-core", version = "=2.0.0-beta.4", path = "crates/jazz", default-features = false }
jazz-db = { version = "=2.0.0-beta.4", path = "crates/jazz/layers/db", default-features = false }
jazz-model = { version = "=2.0.0-beta.4", path = "crates/jazz/layers/model", default-features = false }
jazz-protocol = { version = "=2.0.0-beta.4", path = "crates/jazz/layers/protocol", default-features = false }
jazz-types = { version = "=2.0.0-beta.4", path = "crates/jazz/layers/types", default-features = false }
jazz-compression = { version = "=2.0.0-beta.4", path = "crates/jazz-compression", default-features = false }
jazz-text = { version = "=2.0.0-beta.4", path = "crates/jazz-text" }
jazz-e2ee = { version = "=2.0.0-beta.4", path = "crates/jazz-e2ee" }
jazz-e2ee-client = { version = "=2.0.0-beta.4", path = "crates/jazz-e2ee-client" }
jazz-codegen = { version = "=2.0.0-beta.4", path = "crates/jazz-codegen" }
jazz-otel = { version = "=2.0.0-beta.4", path = "crates/jazz-otel" }
jazz-native-transport = { version = "=2.0.0-beta.4", path = "crates/jazz-native-transport" }
jazz-server = { version = "=2.0.0-beta.4", path = "crates/jazz-server" }
jazz-app-support = { version = "=2.0.0-beta.4", path = "crates/jazz-app" }
rustc-hash = "2.1.1"
divan = { package = "codspeed-divan-compat", version = "5.0.1" }

# Keep useful file/line information in normal dev and test builds without
# generating full debugger metadata. Tests inherit the dev profile.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The browser SQLite is C built by sqlite-wasm-rs. At -O0 its VDBE loop
# (sqlite3VdbeExec) needs over 50,000 wasm locals, more than wasm-bindgen's
# parser and V8 accept, so a dev-profile wasm test build cannot load. cc-rs
# follows this opt-level.
[profile.dev.package.sqlite-wasm-rs]
opt-level = 1

# Opt into full debugger metadata with `--profile debugging`.
[profile.debugging]
inherits = "dev"
debug = true

# The Linux jazz-tools server binary keeps line tables for Jazz's own crates
# so heap profiles, CPU profiles and panics resolve to file:line in production. Everything else
# (optimization, codegen units) matches `release`; other release artifacts
# (NAPI, WASM) stay without debug info.
[profile.release-server]
inherits = "release"
debug = "line-tables-only"

# Dependencies, including bundled C such as SQLite (cc-rs turns any debug
# level into full `-g`), keep only their symbol names.
[profile.release-server.package."*"]
debug = false

[profile.perf]
inherits = "release"
opt-level = 2
lto = false
debug = 1
codegen-units = 256

# Size-oriented profile used only by the jazz-rn relay artifact build
# (`crates/jazz-rn/scripts/build-relay-artifacts.sh`); nothing else selects it.
#
# The script must build the relay with `cargo rustc --crate-type staticlib`:
# rustc silently skips LTO when an rlib is emitted in the same invocation, and
# `jazz-native-relay` must keep `crate-type = ["rlib", "staticlib"]` because
# `jazz-napi` depends on the rlib. Fat LTO is only real in a staticlib-only build.
#
# Unwind stays at the `release` default. `panic = "abort"` would terminate the
# host process when the relay owner thread panics. Panics that leave an
# `extern "C"` entry point already abort since Rust 1.81, so the C boundary is
# the same either way.
#
# Measured on a fully stripped arm64 link proxy referencing all 28 exported
# symbols (SQLite engine, no RocksDB): 16.7 MB -> 9.9 MB executable, 7.2 MB ->
# 4.8 MB gzip, device `.a` 69.6 MB -> 21.1 MB. Full table in
# https://github.com/garden-co/jazz/pull/3016.
# `debug`/`strip` are already the `release` defaults, so they are not
# restated; the `.a` ships as built (nothing in the normal pipeline strips it)
# and the inherited `debug = false` is what keeps debuginfo out.
[profile.release-mobile]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
