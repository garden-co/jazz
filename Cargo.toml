[workspace]
resolver = "2"
members = [
  "crates/benchmark-guard",
  "crates/idb-tree",
  "crates/groove",
  "crates/jazz",
  "crates/jazz-compression",
  "crates/jazz-native-transport",
  "crates/jazz-native-relay",
  "crates/jazz-cli",
  "crates/jazz-server",
  "crates/jazz-storage-rocksdb",
  "crates/jazz-storage-sqlite",
  "crates/jazz-testkit",
  "crates/jazz-otel",
  "crates/jazz-sim",
  "crates/jazz-wasm",
  "crates/jazz-napi",
  "crates/wasm-tracing",
  # The old Axum todo server examples expect a Send + Sync JazzClient in shared
  # router state. Core Db ownership is currently local-thread by design;
  # keep these examples as integration targets, but out of workspace-wide green
  # gates until they are rebuilt around the new server boundary.
  # "examples/todo-server-rs",
  # "examples/docs/todo-server-rs",
  "examples/todo-client-localfirst-ts/benchmarks",
  "examples/permissioned-resources/benchmarks",
  "examples/policy-scoped-documents/benchmarks",
  "examples/big-label/benchmarks",
  "examples/chat-react/benchmarks",
  "examples/auth-simple-chat/benchmarks",
  "examples/epic-drop/benchmarks",
  "examples/band-chat/benchmarks",
  "examples/music-agent/benchmarks",
  "examples/record-player/benchmarks",
  "examples/world-tour/benchmarks",
  "examples/poster-shop/benchmarks",
  "examples/jamazon-warehouse/benchmarks",
  "examples/wequencer/benchmarks",
  "examples/benchmarks/w1",
  "dev/benchmarks/storage/bench-core",
]
exclude = ["examples/todo-server-rs", "examples/docs/todo-server-rs", "vendor/ruzstd"]

[workspace.dependencies]
groove = { path = "crates/groove", default-features = false }
jazz = { path = "crates/jazz", default-features = false }
jazz-compression = { path = "crates/jazz-compression", default-features = false }
jazz-otel = { path = "crates/jazz-otel" }
jazz-storage-rocksdb = { path = "crates/jazz-storage-rocksdb" }
jazz-storage-sqlite = { path = "crates/jazz-storage-sqlite" }
jazz-native-transport = { path = "crates/jazz-native-transport" }
rustc-hash = "2.1.1"
divan = { package = "codspeed-divan-compat", version = "5.0.1" }

[patch.crates-io]
rust-rocksdb = { git = "https://github.com/zaidoon1/rust-rocksdb.git", tag = "v0.48.0" }

# Keep useful file/line information in normal dev and test builds without
# generating full debugger metadata. Tests inherit the dev profile.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Opt into full debugger metadata with `--profile debugging`.
[profile.debugging]
inherits = "dev"
debug = true

[profile.perf]
inherits = "release"
opt-level = 2
lto = false
debug = 1
codegen-units = 256

# Size-oriented profile used only by the jazz-rn relay artifact build
# (`crates/jazz-rn/scripts/build-relay-artifacts.sh`); nothing else selects it.
#
# The script must build the relay with `cargo rustc --crate-type staticlib`:
# rustc silently skips LTO when an rlib is emitted in the same invocation, and
# `jazz-native-relay` must keep `crate-type = ["rlib", "staticlib"]` because
# `jazz-napi` depends on the rlib. Fat LTO is only real in a staticlib-only build.
#
# `panic = "abort"` is deliberate and worth ~7 MB of unwind tables. Consequence:
# a panic in a relay tokio task terminates the host process instead of being
# contained by that task. Panics already abort at the crate's `extern "C"`
# boundary since Rust 1.81 (unconditional for `extern "C"`, not an edition
# rule), so this narrows, not introduces, the exposure.
#
# Measured on a fully stripped arm64 link proxy referencing all 27 exported
# symbols: 37.7 MB -> 15.7 MB executable, 15.7 MB -> 7.7 MB gzip, device `.a`
# 107 MB -> 30 MB. Full table in https://github.com/garden-co/jazz/issues/3008.
# ponytail: `debug`/`strip` are already the `release` defaults, so they are not
# restated; the `.a` ships as built (nothing in the normal pipeline strips it)
# and the inherited `debug = false` is what keeps debuginfo out.
[profile.release-mobile]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
