[workspace]
resolver = "2"
members = [
  "crates/benchmark-guard",
  "crates/jazz",
  "crates/jazz/layers/db",
  "crates/jazz/layers/model",
  "crates/jazz/layers/protocol",
  "crates/jazz/layers/types",
  "crates/jazz-compression",
  "crates/wasm-tracing",
  "crates/jazz-wasm",
  "crates/jazz-native-transport",
  "crates/jazz-native-relay",
  "crates/jazz-cli",
  "crates/jazz-server",
  "crates/jazz-testkit",
  "crates/jazz-otel",
  "crates/jazz-sim",
  "crates/jazz-napi",
  # The Axum todo server examples need a Send + Sync JazzClient in shared
  # router state, and Db is thread-local by design, so they stay outside the
  # workspace.
  # "examples/todo-server-rs",
  # "examples/docs/todo-server-rs",
  "examples/stage-plan/benchmarks",
  "examples/band-book/benchmarks",
  "examples/permissioned-resources/benchmarks",
  "examples/big-label/benchmarks",
  "examples/epic-drop/benchmarks",
  "examples/band-chat/benchmarks",
  "examples/music-agent/benchmarks",
  "examples/record-player/benchmarks",
  "examples/doc-shelf/benchmarks",
  "examples/world-tour/benchmarks",
  "examples/poster-shop/benchmarks",
  "examples/jamazon-warehouse/benchmarks",
  "examples/wequencer/benchmarks",
]
exclude = ["examples/todo-server-rs", "examples/docs/todo-server-rs", "vendor/ruzstd"]

[workspace.dependencies]
jazz = { path = "crates/jazz", default-features = false }
jazz-db = { path = "crates/jazz/layers/db", default-features = false }
jazz-model = { path = "crates/jazz/layers/model", default-features = false }
jazz-protocol = { path = "crates/jazz/layers/protocol", default-features = false }
jazz-types = { path = "crates/jazz/layers/types", default-features = false }
jazz-compression = { path = "crates/jazz-compression", default-features = false }
jazz-otel = { path = "crates/jazz-otel" }
jazz-native-transport = { path = "crates/jazz-native-transport" }
rustc-hash = "2.1.1"
divan = { package = "codspeed-divan-compat", version = "5.0.1" }

# Keep useful file/line information in normal dev and test builds without
# generating full debugger metadata. Tests inherit the dev profile.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Opt into full debugger metadata with `--profile debugging`.
[profile.debugging]
inherits = "dev"
debug = true

# The Linux jazz-tools server binary keeps line tables for Jazz's own crates
# so heap profiles, CPU profiles and panics resolve to file:line in production. Everything else
# (optimization, codegen units) matches `release`; other release artifacts
# (NAPI, WASM) stay without debug info.
[profile.release-server]
inherits = "release"
debug = "line-tables-only"

# Dependencies, including bundled C such as SQLite (cc-rs turns any debug
# level into full `-g`), keep only their symbol names.
[profile.release-server.package."*"]
debug = false

[profile.perf]
inherits = "release"
opt-level = 2
lto = false
debug = 1
codegen-units = 256

# Size-oriented profile used only by the jazz-rn relay artifact build
# (`crates/jazz-rn/scripts/build-relay-artifacts.sh`); nothing else selects it.
#
# The script must build the relay with `cargo rustc --crate-type staticlib`:
# rustc silently skips LTO when an rlib is emitted in the same invocation, and
# `jazz-native-relay` must keep `crate-type = ["rlib", "staticlib"]` because
# `jazz-napi` depends on the rlib. Fat LTO is only real in a staticlib-only build.
#
# Unwind stays at the `release` default. `panic = "abort"` would terminate the
# host process when the relay owner thread panics. Panics that leave an
# `extern "C"` entry point already abort since Rust 1.81, so the C boundary is
# the same either way.
#
# Measured on a fully stripped arm64 link proxy referencing all 28 exported
# symbols (SQLite engine, no RocksDB): 16.7 MB -> 9.9 MB executable, 7.2 MB ->
# 4.8 MB gzip, device `.a` 69.6 MB -> 21.1 MB. Full table in
# https://github.com/garden-co/jazz/pull/3016.
# ponytail: `debug`/`strip` are already the `release` defaults, so they are not
# restated; the `.a` ships as built (nothing in the normal pipeline strips it)
# and the inherited `debug = false` is what keeps debuginfo out.
[profile.release-mobile]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
